function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function renderFinanceBudget(el){
  const f = state.finance;
  const historyKeys = Object.keys(state.financeHistory).sort();
  el.innerHTML = `
    <div class="grid2">
      <div>
        <div class="field"><label>Měsíční příjem (Kč)</label><input type="number" id="f-income" value="${f.income}" placeholder="0"></div>
        <h2 class="sub" style="margin-top:18px;">Výdaje</h2>
        <div class="expense-rows" id="f-expenses"></div>
      </div>
      <div>
        <h2 class="sub">Bilance</h2>
        <div class="result-big" id="f-balance">0 Kč</div>
        <p class="muted" style="margin-top:-4px;">zůstatek po odečtení výdajů</p>
        <div class="bal-bar" id="f-bar"></div>
        <div class="legend" id="f-legend"></div>
      </div>
    </div>
    <div class="row" style="margin-top:24px;">
      <button class="btn primary" id="f-save"><i class="ti ti-check"></i> Uložit rozpočet</button>
    </div>
    ${historyKeys.length ? `
      <div class="divider"></div>
      <h2 class="sub">Historie zůstatku</h2>
      <p class="muted" style="margin-top:-6px;">Ukládá se automaticky při každém uložení rozpočtu, jeden záznam na měsíc.</p>
      <div id="f-history-chart"></div>
    ` : ''}
  `;
  const expenseDefs = [
    {key:'rent', label:'Nájem', color:'var(--rust)'},
    {key:'energy', label:'Energie', color:'var(--ochre)'},
    {key:'internet', label:'Internet / telefon', color:'var(--teal)'},
    {key:'insurance', label:'Pojištění', color:'#7B8CB2'},
    {key:'other', label:'Ostatní', color:'var(--ink-faint)'}
  ];
  const wrap = document.getElementById('f-expenses');
  expenseDefs.forEach(d=>{
    const row = document.createElement('div');
    row.className = 'expense-row';
    row.innerHTML = `<label style="margin:0;">${d.label}</label><input type="number" data-key="${d.key}" value="${f[d.key]}" placeholder="0"><span></span>`;
    wrap.appendChild(row);
  });
  function recalc(){
    const income = parseFloat(document.getElementById('f-income').value)||0;
    let total = 0;
    const vals = {};
    expenseDefs.forEach(d=>{
      const v = parseFloat(document.querySelector(`[data-key="${d.key}"]`).value)||0;
      vals[d.key]=v; total+=v;
    });
    const bal = income - total;
    document.getElementById('f-balance').textContent = (bal>=0?'+':'') + Math.round(bal).toLocaleString('cs-CZ') + ' Kč';
    document.getElementById('f-balance').style.color = bal>=0 ? 'var(--teal-ink)' : 'var(--danger)';
    const bar = document.getElementById('f-bar');
    bar.innerHTML='';
    const legend = document.getElementById('f-legend');
    legend.innerHTML='';
    const base = income>0 ? income : total || 1;
    expenseDefs.forEach(d=>{
      const pct = Math.max(0,(vals[d.key]/base)*100);
      if(pct>0){
        const seg=document.createElement('div');
        seg.className='seg';
        seg.style.width=pct+'%';
        seg.style.background=d.color;
        bar.appendChild(seg);
      }
      const li=document.createElement('span');
      li.innerHTML = `<span class="dot" style="background:${d.color}"></span>${d.label}: ${Math.round(vals[d.key]).toLocaleString('cs-CZ')} Kč`;
      legend.appendChild(li);
    });
  }
  el.querySelectorAll('input').forEach(inp=>inp.addEventListener('input', recalc));
  recalc();
  if(historyKeys.length) renderFinanceHistoryChart(historyKeys);
  document.getElementById('f-save').addEventListener('click', ()=>{
    state.finance.income = document.getElementById('f-income').value;
    expenseDefs.forEach(d=>{ state.finance[d.key] = document.querySelector(`[data-key="${d.key}"]`).value; });
    saveKey('sovaa:finance', state.finance);
    const income = parseFloat(state.finance.income)||0;
    const total = expenseDefs.reduce((a,d)=>a+(parseFloat(state.finance[d.key])||0),0);
    state.financeHistory[monthKey(new Date())] = { income, expenses: total, balance: income-total };
    saveKey('sovaa:finance-history', state.financeHistory);
    showToast('Rozpočet uložen');
    renderFinance();
  });
}
/** Jednoduchý sloupcový graf (čisté SVG/CSS, bez knihovny) posledních až 12 měsíců zůstatku. */
function renderFinanceHistoryChart(historyKeys){
  const wrap = document.getElementById('f-history-chart');
  if(!wrap) return;
  const recent = historyKeys.slice(-12);
  const maxAbs = Math.max(1, ...recent.map(k=>Math.abs(state.financeHistory[k].balance)));
  const monthNames = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
  wrap.innerHTML = `<div class="fin-history-chart">${recent.map(k=>{
    const entry = state.financeHistory[k];
    const h = Math.max(4, Math.round((Math.abs(entry.balance)/maxAbs)*90));
    const color = entry.balance>=0 ? 'var(--teal)' : 'var(--danger)';
    const [y,m] = k.split('-');
    const label = monthNames[parseInt(m)-1] + " '" + y.slice(2);
    return `<div class="fin-history-bar-wrap" title="${label}: ${Math.round(entry.balance).toLocaleString('cs-CZ')} Kč">
      <div class="fin-history-bar" style="height:${h}px; background:${color};"></div>
      <div class="fin-history-label">${label}</div>
    </div>`;
  }).join('')}</div>`;
}

function buildTodayBanner(){
  const banner = document.getElementById('cal-today-banner');
  const today = new Date();
  const parts = [];
  if(state.settings.showNameday){
    const name = NAMEDAYS[mmdd(today)];
    if(name) parts.push(`dnes slaví <b>${esc(name)}</b>`);
  }
  if(state.settings.showBirthdays){
    const todays = state.birthdays.filter(b=>b.day===today.getDate() && b.month===today.getMonth()+1);
    todays.forEach(b=>{
      const age = b.year ? ` (${today.getFullYear()-b.year} let)` : '';
      parts.push(`narozeniny má <b>${esc(b.name)}</b>${age}`);
    });
  }
  if(!parts.length){ banner.innerHTML=''; return; }
  banner.innerHTML = `<div class="today-banner"><i class="ti ti-sparkles"></i><span>${parts.join(' · ')}</span></div>`;

/** Boční panel „Dnes" — vidět jen na širší obrazovce (viz media query), pod záložkami.
 *  Malý bonus za otevření appky na počítači: rychlý přehled dne bez klikání na Kalendář. */
function renderSidebarToday(){
  const wrap = document.getElementById('sidebar-today');
  if(!wrap) return;
  const today = new Date();
  const dateLabel = today.toLocaleDateString('cs-CZ', {weekday:'long', day:'numeric', month:'long'});
  const rows = [];
  if(state.settings.showNameday){
    const name = NAMEDAYS[mmdd(today)];
    if(name) rows.push(`<div class="st-row"><i class="ti ti-sparkles"></i><span>Svátek: ${esc(name.split(',')[0])}${name.includes(',')?' a další':''}</span></div>`);
  }
  if(state.settings.showBirthdays){
    state.birthdays.filter(b=>b.day===today.getDate() && b.month===today.getMonth()+1).forEach(b=>{
      rows.push(`<div class="st-row"><i class="ti ti-cake"></i><span>${esc(b.name)} má narozeniny</span></div>`);
    });
  }
  const todayTasks = tasksOn(fmtDate(today));
  if(todayTasks.length){
    const doneToday = todayTasks.filter(t=>isTaskDone(t, fmtDate(today))).length;
    rows.push(`<div class="st-row"><i class="ti ti-list-check"></i><span>Úkoly: ${doneToday} z ${todayTasks.length} hotovo</span></div>`);
  }
  const todayHabits = state.habits.filter(h=>habitScheduled(h, fmtDate(today)));
  if(todayHabits.length){
    const habitsDone = todayHabits.filter(h=>habitDone(h, fmtDate(today))).length;
    rows.push(`<div class="st-row"><i class="ti ti-flame"></i><span>Návyky: ${habitsDone} z ${todayHabits.length}</span></div>`);
  }
  const eatenToday = eatenOn(fmtDate(today));
  if(eatenToday.kcal>0) rows.push(`<div class="st-row"><i class="ti ti-tools-kitchen-2"></i><span>Snědeno: ${Math.round(eatenToday.kcal)} kcal</span></div>`);
  paymentsOn(fmtDate(today)).forEach(r=>rows.push(`<div class="st-row"><i class="ti ti-coin"></i><span>Platba: ${esc(r.name)} · ${esc(finSigned(r))}</span></div>`));
  const todaysEvents = state.events[fmtDate(today)]||[];
  if(todaysEvents.length){
    rows.push(`<div class="st-row"><i class="ti ti-calendar-event"></i><span>${todaysEvents.length} ${todaysEvents.length===1?'událost':'události'} v kalendáři</span></div>`);
  }
  wrap.innerHTML = `
    <div class="st-date">${dateLabel.charAt(0).toUpperCase()+dateLabel.slice(1)}</div>
    ${rows.length ? rows.join('') : '<div class="st-row st-empty"><i class="ti ti-moon"></i><span>Dnes nic zvláštního</span></div>'}
  `;
}
function buildCalGrid(){
  const monthNames = ['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
  document.getElementById('c-month').textContent = monthNames[calCursor.getMonth()] + ' ' + calCursor.getFullYear();
  const grid = document.getElementById('c-grid');
  grid.innerHTML = '';
  ['Po','Út','St','Čt','Pá','So','Ne'].forEach(d=>{
    const h = document.createElement('div');
    h.className='cal-dow'; h.textContent=d;
    grid.appendChild(h);
  });
  const year = calCursor.getFullYear(), month = calCursor.getMonth();
  const firstDay = new Date(year, month, 1);
  let startOffset = firstDay.getDay()-1; if(startOffset<0) startOffset=6;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  const todayStr = fmtDate(new Date());
  const cells = [];
  for(let i=startOffset;i>0;i--) cells.push({d:daysInPrev-i+1, other:true, month:month-1});
  for(let d=1; d<=daysInMonth; d++) cells.push({d, other:false, month});
  while(cells.length%7!==0) cells.push({d:cells.length, other:true, month:month+1});
  cells.forEach(c=>{
    const dateObj = new Date(year, c.month, c.d);
    const dateStr = fmtDate(dateObj);
    const cell = document.createElement('div');
    cell.className = 'cal-day' + (c.other?' other':'') + (dateStr===todayStr?' today':'') + (dateStr===selectedDate?' selected':'');
    const evCount = (state.events[dateStr]||[]).length;
    const payCount = paymentsOn(dateStr).length;
    const bdayCount = state.birthdays.filter(b=>b.day===dateObj.getDate() && b.month===dateObj.getMonth()+1).length;
    const namedayStr = state.settings.showNameday ? (NAMEDAYS[mmdd(dateObj)]||'') : '';
    const namedayFirst = namedayStr ? namedayStr.split(',')[0] : '';
    let dots = '';
    if(evCount || payCount || (state.settings.showBirthdays && bdayCount)){
      dots = '<div class="dotwrap">';
      if(evCount) dots += '<span class="evdot"></span>'.repeat(Math.min(evCount,2));
      if(payCount) dots += '<span class="paydot"></span>';
      if(state.settings.showBirthdays && bdayCount) dots += '<span class="bdaydot"></span>'.repeat(Math.min(bdayCount,2));
      dots += '</div>';
    }
    cell.innerHTML = `${c.d}` + (namedayFirst?`<span class="nameday">${esc(namedayFirst)}</span>`:'') + dots;
    cell.addEventListener('click', ()=>{ selectedDate = dateStr; renderCalendar(); });
    grid.appendChild(cell);
  });
}
function buildDayEvents(){
  const dateObj = new Date(selectedDate+'T00:00:00');
  const label = dateObj.toLocaleDateString('cs-CZ', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const nameday = NAMEDAYS[mmdd(dateObj)];
  document.getElementById('c-selected-label').innerHTML = label.charAt(0).toUpperCase()+label.slice(1) + (nameday?` <span class="muted" style="font-family:'Inter',sans-serif; font-size:13px; font-weight:400;">— svátek: ${esc(nameday)}</span>`:'');
  const list = document.getElementById('c-ev-list');
  const evs = state.events[selectedDate]||[];
  const pays = paymentsOn(selectedDate);
  if(!evs.length && !pays.length){
    list.innerHTML = '<p class="muted">Žádné události tento den.</p>';
    return;
  }
  list.innerHTML='';
  evs.forEach((text, idx)=>{
    const row = document.createElement('div');
    row.className='ev-item';
    row.innerHTML = `<span>${esc(text)}</span>`;
    const del = document.createElement('button');
    del.className='icon-btn';
    del.innerHTML = '<i class="ti ti-x"></i>';
    del.addEventListener('click', ()=>{
      state.events[selectedDate].splice(idx,1);
      if(!state.events[selectedDate].length) delete state.events[selectedDate];
      saveKey('sovaa:events', state.events);
      renderCalendar();
    });
    row.appendChild(del);
    list.appendChild(row);
  });
  pays.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'ev-item pay-item';
    row.innerHTML = `<span><i class="ti ti-coin"></i> Platba: ${esc(r.name)} · ${esc(finSigned(r))}</span>`;
    list.appendChild(row);
  });
}
function addEvent(){
  const inp = document.getElementById('c-ev-input');
  const val = inp.value.trim();
  if(!val) return;
  if(!state.events[selectedDate]) state.events[selectedDate]=[];
  state.events[selectedDate].push(val);
  inp.value='';
  saveKey('sovaa:events', state.events);
  showToast('Událost přidána');
  renderCalendar();
}
function buildBirthdayList(){
  const wrap = document.getElementById('bday-list');
  if(!state.birthdays.length){
    wrap.innerHTML = '<p class="muted">Zatím žádné narozeniny přátel.</p>';
    return;
  }
  const monthNames = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
  wrap.innerHTML='';
  [...state.birthdays].sort((a,b)=> a.month-b.month || a.day-b.day).forEach(b=>{
    const row = document.createElement('div');
    row.className='bday-item';
    row.innerHTML = `<span>${esc(b.name)} — ${b.day}. ${monthNames[b.month-1]}${b.year?', '+b.year:''}</span>`;
    const del = document.createElement('button');
    del.className='icon-btn';
    del.innerHTML='<i class="ti ti-x"></i>';
    del.addEventListener('click', ()=>{
      state.birthdays = state.birthdays.filter(x=>x.id!==b.id);
      saveKey('sovaa:birthdays', state.birthdays);
      showToast('Narozeniny smazány');
      renderCalendar();
    });
    row.appendChild(del);
    wrap.appendChild(row);

function addBirthday(){
  const name = document.getElementById('bday-name').value.trim();
  const day = parseInt(document.getElementById('bday-day').value);
  const month = parseInt(document.getElementById('bday-month').value);
  if(!name || !day || !month || day<1 || day>31 || month<1 || month>12){
    showToast('Vyplň jméno, den (1–31) a měsíc (1–12)');
    return;
  }
  state.birthdays.push({ id:'b'+Date.now(), name, day, month });
  saveKey('sovaa:birthdays', state.birthdays);
  document.getElementById('bday-name').value='';
  document.getElementById('bday-day').value='';
  document.getElementById('bday-month').value='';
  showToast('Narozeniny přidány');
  renderCalendar();
}

/* ---------------- 10. Trezor (PIN + šifrování) ----------------
   Obsah trezoru se šifruje AES-GCM klíčem odvozeným z PINu (PBKDF2).
   Do localStorage se ukládá jen sůl a šifrovaná data — nikdy samotný PIN.
   Klíč žije jen v paměti a mizí při zamknutí, přepnutí záložky nebo obnovení stránky. */
let vaultKey = null;
let vaultEntries = [];
let activeVaultId = null;

function hasCrypto(){ return !!(window.crypto && window.crypto.subtle); }
function bufToB64(buf){
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let bin = '';
  bytes.forEach(b=>bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64ToBuf(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
async function deriveVaultKey(pin, saltBytes){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:saltBytes, iterations:150000, hash:'SHA-256'},
    keyMaterial,
    {name:'AES-GCM', length:256},
    false,
    ['encrypt','decrypt']
  );
}
async function vaultEncrypt(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return bufToB64(iv) + '.' + bufToB64(cipher);
}
async function vaultDecrypt(key, packed){
  const [ivB64, cB64] = packed.split('.');
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBuf(ivB64)}, key, b64ToBuf(cB64));
  return JSON.parse(new TextDecoder().decode(plain));
}
function vaultIsSetUp(){ return !!localStorage.getItem('sovaa:vault-salt'); }
function lockVault(){ vaultKey = null; vaultEntries = []; activeVaultId = null; }

function renderVault(){
  const el = document.getElementById('page-vault');
  if(!hasCrypto()){
    el.innerHTML = `
      <p class="eyebrow">Soukromá sekce</p>
      <h1 class="section-title">Trezor</h1>
      <div class="vault-warning">Tento prohlížeč nepodporuje šifrování (Web Crypto API), takže Trezor tu nemůže bezpečně fungovat. Zkus aktuální verzi Chrome, Safari nebo Edge.</div>
    `;
    return;
  }
  if(!vaultIsSetUp()){
    el.innerHTML = `
      <p class="eyebrow">Soukromá sekce</p>
      <h1 class="section-title">Trezor</h1>
      <div class="vault-lock">
        <i class="ti ti-lock"></i>
        <h2 class="sub">Nastav si PIN</h2>
        <p class="muted">Obsah trezoru bude zašifrovaný tímto PINem. Nikam se neposílá a appka si ho nikde neukládá — pokud ho zapomeneš, obsah nejde obnovit.</p>
        <div class="field" style="text-align:left; margin-top:20px;"><label>Nový PIN (4–6 číslic)</label><input type="password" id="v-pin1" inputmode="numeric" maxlength="6" style="text-align:center; font-size:20px; letter-spacing:6px;"></div>
        <div class="field" style="text-align:left;"><label>Zopakuj PIN</label><input type="password" id="v-pin2" inputmode="numeric" maxlength="6" style="text-align:center; font-size:20px; letter-spacing:6px;"></div>
        <button class="btn primary" id="v-setup" style="width:100%;"><i class="ti ti-lock"></i> Vytvořit trezor</button>
      </div>
    `;
    document.getElementById('v-setup').addEventListener('click', async ()=>{
      const p1 = document.getElementById('v-pin1').value;
      const p2 = document.getElementById('v-pin2').value;
      if(p1.length<4 || !/^\d+$/.test(p1)){ showToast('PIN musí mít 4–6 číslic'); return; }
      if(p1!==p2){ showToast('PINy se neshodují'); return; }
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveVaultKey(p1, salt);
      const verifier = await vaultEncrypt(key, {ok:true});
      const data = await vaultEncrypt(key, []);
      localStorage.setItem('sovaa:vault-salt', bufToB64(salt));
      localStorage.setItem('sovaa:vault-verifier', verifier);
      localStorage.setItem('sovaa:vault-data', data);
      vaultKey = key;
      vaultEntries = [];
      showToast('Trezor vytvořen a odemčen');
      renderVault();
    });
    return;
  }
  if(!vaultKey){
    el.innerHTML = `
      <p class="eyebrow">Soukromá sekce</p>
      <h1 class="section-title">Trezor</h1>
      <div class="vault-lock">
        <i class="ti ti-lock"></i>
        <h2 class="sub">Zamčeno</h2>
        <p class="muted">Zadej svůj PIN.</p>
        <div class="field" style="text-align:left; margin-top:20px;"><input type="password" id="v-pin" inputmode="numeric" maxlength="6" style="text-align:center; font-size:20px; letter-spacing:6px;" placeholder="••••"></div>
        <button class="btn primary" id="v-unlock" style="width:100%;"><i class="ti ti-lock-open"></i> Odemknout</button>
        <p class="muted" style="margin-top:18px;"><a href="#" id="v-forgot">Zapomněl(a) jsem PIN</a></p>
      </div>
    `;
    const tryUnlock = async ()=>{
      const pin = document.getElementById('v-pin').value;
      const salt = b64ToBuf(localStorage.getItem('sovaa:vault-salt'));
      const key = await deriveVaultKey(pin, salt);
      try{
        await vaultDecrypt(key, localStorage.getItem('sovaa:vault-verifier'));
        vaultKey = key;
        vaultEntries = await vaultDecrypt(key, localStorage.getItem('sovaa:vault-data'));
        renderVault();
      }catch(e){
        showToast('Nesprávný PIN');
      }
    };
    document.getElementById('v-unlock').addEventListener('click', tryUnlock);
    document.getElementById('v-pin').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
    document.getElementById('v-forgot').addEventListener('click', (e)=>{
      e.preventDefault();
      if(confirm('Bez PINu nejde obsah trezoru dešifrovat. Dá se jen smazat a začít znovu — všechna data v trezoru se ztratí. Opravdu smazat trezor?')){
        localStorage.removeItem('sovaa:vault-salt');
        localStorage.removeItem('sovaa:vault-verifier');
        localStorage.removeItem('sovaa:vault-data');
        lockVault();
        showToast('Trezor smazán');
        renderVault();
      }
    });
    return;
  }
  /* odemčeno */
  if(activeVaultId===null && vaultEntries.length) activeVaultId = vaultEntries[0].id;
  const active = vaultEntries.find(v=>v.id===activeVaultId);
  el.innerHTML = `
    <p class="eyebrow">Soukromá sekce — odemčeno</p>
    <h1 class="section-title">Trezor</h1>
    <div class="row" style="margin-bottom:18px;">
      <button class="btn" id="v-lock"><i class="ti ti-lock"></i> Zamknout</button>
      <button class="btn danger" id="v-wipe"><i class="ti ti-trash"></i> Smazat celý trezor</button>
    </div>
    <div class="split-layout">
      <div>
        <button class="btn primary" id="v-new" style="width:100%; margin-bottom:14px;"><i class="ti ti-plus"></i> Nový záznam</button>
        <div class="item-list" id="v-list"></div>
      </div>
      <div id="v-editor"></div>
    </div>
  `;
  document.getElementById('v-lock').addEventListener('click', ()=>{ lockVault(); showToast('Trezor zamčen'); renderVault(); });
  document.getElementById('v-wipe').addEventListener('click', ()=>{
    if(confirm('Opravdu nenávratně smazat celý trezor a jeho obsah?')){
      localStorage.removeItem('sovaa:vault-salt');
      localStorage.removeItem('sovaa:vault-verifier');
      localStorage.removeItem('sovaa:vault-data');
      lockVault();
      showToast('Trezor smazán');
      renderVault();
    }
  });
  const list = document.getElementById('v-list');
  renderTitledList(list, vaultEntries, activeVaultId, {
    emptyText: 'Trezor je prázdný.',
    getTitleHtml: (v)=> `<i class="ti ti-key" style="font-size:12px; margin-right:4px;"></i>${esc(v.title)||'Bez názvu'}`,
    onSelect: (v)=>{ activeVaultId = v.id; renderVault(); }
  });
  const editor = document.getElementById('v-editor');
  const persistVault = async ()=>{
    const data = await vaultEncrypt(vaultKey, vaultEntries);
    localStorage.setItem('sovaa:vault-data', data);
  };
  document.getElementById('v-new').addEventListener('click', async ()=>{
    const v = { id:'v'+Date.now(), title:'', content:'', updated:Date.now() };
    vaultEntries.push(v);
    activeVaultId = v.id;
    await persistVault();
    renderVault();
  });
  if(!active){
    editor.innerHTML = `<div class="empty-state"><i class="ti ti-shield-lock"></i>Vyber záznam nebo založ nový — hesla, čísla dokladů, cokoliv citlivého.</div>`;
    return;
  }
  editor.innerHTML = `
    <div class="field"><input type="text" id="v-title" value="${escAttr(active.title)}" placeholder="Název (např. Heslo k e-mailu)" style="font-family:'Fraunces',serif; font-size:19px; font-weight:500; border:none; padding:4px 0; background:transparent;"></div>
    <textarea id="v-content" style="min-height:260px;" placeholder="Obsah je uložený jen zašifrovaně...">${esc(active.content)}</textarea>
    <div class="row" style="margin-top:14px;">
      <button class="btn primary" id="v-save"><i class="ti ti-check"></i> Uložit</button>
      <button class="btn danger" id="v-del"><i class="ti ti-trash"></i> Smazat záznam</button>
    </div>
  `;
  document.getElementById('v-save').addEventListener('click', async ()=>{
    active.title = document.getElementById('v-title').value.trim();
    active.content = document.getElementById('v-content').value;
    active.updated = Date.now();
    await persistVault();
    showToast('Uloženo do trezoru');
    renderVault();
  });
  document.getElementById('v-del').addEventListener('click', async ()=>{
    vaultEntries = vaultEntries.filter(v=>v.id!==active.id);
    activeVaultId = vaultEntries.length ? vaultEntries[0].id : null;
    await persistVault();
    showToast('Záznam smazán');
    renderVault();
  });
}

  const notifPerm = ('Notification' in window) ? Notification.permission : 'unsupported';
  el.innerHTML = `

    <div class="setting-row">
      <div class="setting-text"><b>Svátek dne v kalendáři</b><span>Ukazuje jméno, které dnes slaví, nahoře na stránce Kalendář a u jednotlivých dní.</span></div>

    </div>
    ${notifPerm==='denied' ? '<p class="muted" style="margin-top:8px;">Upozornění jsou v prohlížeči zablokovaná — povol je v nastavení webu, pokud je chceš používat.</p>' : ''}
    ${notifPerm==='unsupported' ? '<p class="muted" style="margin-top:8px;">Tento prohlížeč nepodporuje systémová upozornění.</p>' : ''}

    <div class="divider"></div>
    <h2 class="sub">Úvodní obrazovka</h2>
    <p class="muted" style="margin-top:-6px;">Co se má ukázat hned po otevření appky. Co nepoužíváš, vypni.</p>

    <div class="divider"></div>
    <h2 class="sub">Moje strava</h2>
    <p class="muted" style="margin-top:-6px;">V Kuchařce se pak zobrazí jen recepty, které ti vyhovují. U každého receptu se strava určuje ze surovin, případně ji nastavíš ručně.</p>
    <div class="diet-checks">${DIET_KEYS.map(k=>`<label class="diet-check"><input type="checkbox" data-diet="${k}" ${(s.diets||[]).includes(k)?'checked':''}> ${DIET_LABELS[k]}</label>`).join('')}</div>

    <div class="divider"></div>
    <h2 class="sub">O appce</h2>
    <p class="muted">SOVAA běží celá lokálně v tomto prohlížeči — žádná data se nikam neposílají. Svátky vycházejí z tradičního českého občanského kalendáře.</p>
  `;
  el.querySelectorAll('[data-startcard]').forEach(cb=>cb.addEventListener('change', ()=>{
    state.settings.startCards = Object.fromEntries(START_CARDS.map(([k])=>[k, !!el.querySelector(`[data-startcard="${k}"]`).checked]));
    saveKey('sovaa:settings', state.settings);
    renderStart();
  }));
  el.querySelectorAll('[data-diet]').forEach(cb=>cb.addEventListener('change', ()=>{
    state.settings.diets = [...el.querySelectorAll('[data-diet]:checked')].map(x=>x.dataset.diet);

  }));
  document.getElementById('s-nameday').addEventListener('click', ()=>{

    renderSettings();

  });
  document.getElementById('s-birthdays').addEventListener('click', ()=>{
    state.settings.showBirthdays = !state.settings.showBirthdays;

    state.settings.browserNotify = !state.settings.browserNotify;
    saveKey('sovaa:settings', state.settings);
    renderSettings();
  });
}

/* ---------------- 11b. Denní upozornění při otevření appky ---------------- */
function maybeNotifyToday(){
  if(!state.settings.browserNotify) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const todayKey = fmtDate(new Date());
  if(localStorage.getItem('sovaa:last-notify-date')===todayKey) return;
  const today = new Date();
  const bits = [];
  const name = NAMEDAYS[mmdd(today)];
  if(name) bits.push('Dnes slaví: '+name);
  const bdays = state.birthdays.filter(b=>b.day===today.getDate() && b.month===today.getMonth()+1);
  bdays.forEach(b=>bits.push('Narozeniny: '+b.name));
  paymentsOn(fmtDate(today)).forEach(r=>bits.push('Dnes platba: '+r.name+' '+Math.round(r.amount)+' Kč'));
  paymentsOn(addDays(fmtDate(today),1)).forEach(r=>bits.push('Zítra platba: '+r.name+' '+Math.round(r.amount)+' Kč'));
  if(bits.length){
    try{ new Notification('SOVAA', {body: bits.join(' · ')}); }catch(e){}
  }
  localStorage.setItem('sovaa:last-notify-date', todayKey);
}
