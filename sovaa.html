/* ---------------- 5c. Návyky a nálada (týdenní mřížka, série dní, deník nálady) ----------------
   Návyk má plán (které dny v týdnu se mají plnit). Splnění se ukládá po dnech do state.habitLog,
   nálada (1–5) po dnech do state.moods. Série = počet plánovaných dnů v řadě, které jsi splnil. */
const HABIT_ICONS = ['ti-barbell','ti-pill','ti-book','ti-salad','ti-droplet','ti-moon','ti-run','ti-brush','ti-meditation','ti-music','ti-sun','ti-heart'];
const HABIT_PRESETS = [
  ['Cvičení','ti-barbell','teal'], ['Vitamíny','ti-pill','ochre'], ['Čtení','ti-book','plum'],
  ['Pití vody','ti-droplet','blue'], ['Meditace','ti-meditation','olive'], ['Spánek před půlnocí','ti-moon','plum']
];
const MOODS = [
  { v:1, emoji:'😞', label:'Špatně' }, { v:2, emoji:'😕', label:'Nic moc' }, { v:3, emoji:'😐', label:'Ujde to' },
  { v:4, emoji:'🙂', label:'Dobře' },  { v:5, emoji:'😄', label:'Skvěle' }
];
const MOOD_COLORS = ['#C95B4B','#D98C4A','#C9B24A','#7DAE5A','#3E8A7A'];
const DAY_LETTERS = ['P','Ú','S','Č','P','S','N'];
const DAY_NAMES = ['Po','Út','St','Čt','Pá','So','Ne'];

function saveHabits(){ saveKey('sovaa:habits', state.habits); }
function saveHabitLog(){ saveKey('sovaa:habitlog', state.habitLog); }
function saveMoods(){ saveKey('sovaa:moods', state.moods); }
function dowOf(date){ return (new Date(date+'T00:00:00').getDay()+6)%7; }          // 0 = pondělí
function weekDates(date){
  const monday = addDays(date, -dowOf(date));
  return Array.from({length:7}, (_,i)=>addDays(monday, i));
}
function newHabit(over){
  return Object.assign({ id:'hb'+Date.now()+Math.random().toString(36).slice(2,5), name:'', icon:'ti-barbell', color:'teal',
    days:[0,1,2,3,4,5,6], created:weekDates(fmtDate(new Date()))[0] }, over||{});
}
function habitScheduled(h, date){ return date>=h.created && (h.days||[0,1,2,3,4,5,6]).includes(dowOf(date)); }
function habitDone(h, date){ return (state.habitLog[date]||[]).includes(h.id); }
function toggleHabit(h, date){
  const list = state.habitLog[date] || [];
  const i = list.indexOf(h.id);
  if(i>=0) list.splice(i,1); else list.push(h.id);
  if(list.length) state.habitLog[date] = list; else delete state.habitLog[date];
  saveHabitLog();
}
/** Série: kolik plánovaných dní v řadě je splněno (dnešek, který ještě není splněný, sérii nepřeruší). */
function habitStreak(h){
  const today = fmtDate(new Date());
  let streak = 0, date = today;
  for(let n=0; n<800 && date>=h.created; n++, date = addDays(date,-1)){
    if(!habitScheduled(h, date)) continue;
    if(habitDone(h, date)) streak++;
    else if(date!==today) break;
  }
  return streak;
}
/** Úspěšnost za posledních `days` dní (jen plánované dny od vzniku návyku). */
function habitRate(h, days){
  const today = fmtDate(new Date());
  let planned = 0, done = 0;
  for(let n=0; n<days; n++){
    const date = addDays(today, -n);
    if(!habitScheduled(h, date)) continue;
    planned++;
    if(habitDone(h, date)) done++;
  }
  return planned ? Math.round(done/planned*100) : null;
}
function setMood(date, v){
  if(state.moods[date]===v) delete state.moods[date]; else state.moods[date] = v;
  saveMoods();
}
function refreshHabits(){
  const wrap = document.getElementById('pl-habits');
  if(wrap) buildHabitsCard(wrap, fmtDate(new Date()));
  renderSidebarToday();
}

/* ---- karta „Návyky a nálada“ v záložce Dnes ---- */
function buildHabitsCard(wrap, date){
  const today = fmtDate(new Date());
  const week = weekDates(date);
  const open = state.settings.habitsOpen!==false;
  const fmtShort = (d)=>{ const x = new Date(d+'T00:00:00'); return x.getDate()+'. '+(x.getMonth()+1)+'.'; };
  const planned = state.habits.filter(h=>habitScheduled(h, date));
  const doneCount = planned.filter(h=>habitDone(h, date)).length;
  const mood = state.moods[date] || 0;
  const history = Array.from({length:14}, (_,i)=>addDays(today, i-13));
  const moodVals = history.map(d=>state.moods[d]).filter(Boolean);
  const avg = moodVals.length ? (moodVals.reduce((a,b)=>a+b,0)/moodVals.length) : null;

  let body = '';
  if(open){
    if(!state.habits.length){
      body = `<p class="muted" style="margin:4px 0 10px;">Zatím žádné návyky. Začni třeba některým z těchto:</p>
        <div class="row" id="hb-presets"></div>`;
    } else {
      body = `<div class="habit-grid">
        <div></div>${week.map((d,i)=>`<div class="hb-head${d===today?' today':''}" title="${esc(fmtShort(d))}">${DAY_LETTERS[i]}</div>`).join('')}<div></div>
        ${state.habits.map(h=>{
          const streak = habitStreak(h);
          return `<div class="hb-name" data-h="${escAttr(h.id)}" title="Upravit návyk"><i class="ti ${esc(h.icon)}" style="color:${PLAN_COLORS[h.color]||PLAN_COLORS.teal};"></i><span>${esc(h.name)}</span></div>
            ${week.map(d=>{
              const sched = habitScheduled(h, d), done = habitDone(h, d), future = d>today;
              const cls = 'hb-dot' + (done?' on':'') + (!sched?' off':'') + (future?' future':'');
              return `<button class="${cls}" data-h="${escAttr(h.id)}" data-d="${d}" style="--c:${PLAN_COLORS[h.color]||PLAN_COLORS.teal};" ${(!sched||future)?'disabled':''}
                aria-label="${esc(h.name)} ${esc(fmtShort(d))}" aria-pressed="${done}">${done?'✓':(sched?'':'–')}</button>`;
            }).join('')}
            <div class="hb-streak" title="Série splněných dní v řadě">${streak>0 ? `<i class="ti ti-flame"></i>${streak}` : ''}</div>`;
        }).join('')}
      </div>`;
    }
    body += `<div class="mood-block">
      <div class="mood-title">Nálada ${date===today ? 'dnes' : esc(fmtShort(date))}${avg!==null ? ` <span class="muted">· průměr 14 dní ${String(Math.round(avg*10)/10).replace('.',',')}</span>` : ''}</div>
      <div class="mood-row" id="hb-moods">${MOODS.map(m=>`<button class="mood-btn${mood===m.v?' on':''}" data-v="${m.v}" title="${m.label}" aria-label="${m.label}" aria-pressed="${mood===m.v}">${m.emoji}</button>`).join('')}
        <span class="mood-label">${mood ? MOODS[mood-1].label : 'Jak se dnes máš?'}</span></div>
      <div class="mood-history" title="Posledních 14 dní">${history.map(d=>{
        const v = state.moods[d];
        return `<span class="mood-dot" style="background:${v ? MOOD_COLORS[v-1] : 'var(--line)'};" title="${esc(fmtShort(d))}${v ? ': '+MOODS[v-1].label : ''}"></span>`;
      }).join('')}</div>
    </div>`;
  }
  wrap.innerHTML = `
    <div class="habit-card">
      <div class="habit-head">
        <button class="habit-toggle" id="hb-collapse" aria-expanded="${open}"><i class="ti ti-chevron-${open?'down':'right'}"></i><span class="habit-title">Návyky a nálada</span></button>
        <span class="muted">${state.habits.length ? `${doneCount} z ${planned.length} dnes · týden ${esc(fmtShort(week[0]))} – ${esc(fmtShort(week[6]))}` : ''}</span>
        <button class="btn-mini" id="hb-add"><i class="ti ti-plus"></i> Návyk</button>
      </div>
      ${body}
    </div>`;
  document.getElementById('hb-collapse').addEventListener('click', ()=>{
    state.settings.habitsOpen = !open;
    saveKey('sovaa:settings', state.settings);
    refreshHabits();
  });
  document.getElementById('hb-add').addEventListener('click', ()=>openHabitModal(null));
  const presets = document.getElementById('hb-presets');
  if(presets) HABIT_PRESETS.forEach(([name,icon,color])=>{
    const b = document.createElement('button');
    b.className = 'btn';
    b.innerHTML = `<i class="ti ${icon}"></i> ${esc(name)}`;
    b.addEventListener('click', ()=>{ state.habits.push(newHabit({ name, icon, color })); saveHabits(); refreshHabits(); });
    presets.appendChild(b);
  });
  wrap.querySelectorAll('.hb-dot:not([disabled])').forEach(b=>b.addEventListener('click', ()=>{
    const h = state.habits.find(x=>x.id===b.dataset.h);
    if(!h) return;
    toggleHabit(h, b.dataset.d);
    refreshHabits();
  }));
  wrap.querySelectorAll('.hb-name').forEach(n=>n.addEventListener('click', ()=>{
    const h = state.habits.find(x=>x.id===n.dataset.h);
    if(h) openHabitModal(h);
  }));
  wrap.querySelectorAll('.mood-btn').forEach(b=>b.addEventListener('click', ()=>{ setMood(date, +b.dataset.v); refreshHabits(); }));
}

/* ---- okno pro vytvoření / úpravu návyku ---- */
function closeHabitModal(){ const m = document.getElementById('habit-backdrop'); if(m) m.remove(); }
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeHabitModal(); });
function openHabitModal(habit){
  closeHabitModal();
  const draft = habit ? JSON.parse(JSON.stringify(habit)) : newHabit();
  draft.days = draft.days || [0,1,2,3,4,5,6];
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop open';
  wrap.id = 'habit-backdrop';
  wrap.innerHTML = `
    <div class="modal-panel plan-modal">
      <button class="icon-btn modal-close" id="hm-close" aria-label="Zavřít"><i class="ti ti-x"></i></button>
      <h2 class="sub">${habit ? 'Upravit návyk' : 'Nový návyk'}</h2>
      <div class="field"><label>Název</label><input type="text" id="hm-name" value="${escAttr(draft.name)}" placeholder="např. Cvičení"></div>
      <div class="field"><label>Které dny se má plnit</label><div class="day-toggles" id="hm-days"></div></div>
      <div class="field"><label>Barva</label><div class="swatches" id="hm-colors"></div></div>
      <div class="field"><label>Ikona</label><div class="icon-pick" id="hm-icons"></div></div>
      ${habit ? `<p class="muted">Série: ${habitStreak(habit)} · úspěšnost za 30 dní: ${habitRate(habit,30)===null ? '—' : habitRate(habit,30)+' %'}</p>` : ''}
      <div class="row">
        <button class="btn primary" id="hm-save"><i class="ti ti-check"></i> Uložit</button>
        <button class="btn" id="hm-cancel">Zrušit</button>
        ${habit ? '<button class="btn danger" id="hm-del"><i class="ti ti-trash"></i> Smazat</button>' : ''}
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const $h = id=>document.getElementById(id);
  const daysWrap = $h('hm-days');
  DAY_NAMES.forEach((n,i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'day-toggle' + (draft.days.includes(i) ? ' on' : '');
    b.textContent = n;
    b.dataset.d = i;
    b.addEventListener('click', ()=>{
      draft.days = draft.days.includes(i) ? draft.days.filter(x=>x!==i) : [...draft.days, i].sort();
      b.classList.toggle('on', draft.days.includes(i));
    });
    daysWrap.appendChild(b);
  });
  Object.keys(PLAN_COLORS).forEach(k=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch' + (k===draft.color ? ' on' : '');
    b.style.setProperty('--c', PLAN_COLORS[k]);
    b.title = k;
    b.addEventListener('click', ()=>{ draft.color = k; $h('hm-colors').querySelectorAll('.swatch').forEach(s=>s.classList.toggle('on', s===b)); });
    $h('hm-colors').appendChild(b);
  });
  HABIT_ICONS.forEach(ic=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'icon-opt' + (ic===draft.icon ? ' on' : '');
    b.innerHTML = `<i class="ti ${ic}"></i>`;
    b.addEventListener('click', ()=>{ draft.icon = ic; $h('hm-icons').querySelectorAll('.icon-opt').forEach(s=>s.classList.toggle('on', s===b)); });
    $h('hm-icons').appendChild(b);
  });
  $h('hm-close').addEventListener('click', closeHabitModal);
  $h('hm-cancel').addEventListener('click', closeHabitModal);
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) closeHabitModal(); });
  $h('hm-save').addEventListener('click', ()=>{
    const name = $h('hm-name').value.trim();
    if(!name){ showToast('Doplň název návyku'); return; }
    if(!draft.days.length){ showToast('Vyber aspoň jeden den v týdnu'); return; }
    draft.name = name;
    if(habit) Object.assign(habit, draft); else state.habits.push(draft);
    saveHabits();
    closeHabitModal();
    refreshHabits();
  });
  const del = $h('hm-del');
  if(del) del.addEventListener('click', ()=>{
    if(!confirm('Smazat návyk „'+habit.name+'“ i s jeho historií?')) return;
    state.habits = state.habits.filter(x=>x.id!==habit.id);
    Object.keys(state.habitLog).forEach(d=>{
      state.habitLog[d] = state.habitLog[d].filter(id=>id!==habit.id);
      if(!state.habitLog[d].length) delete state.habitLog[d];
    });
    saveHabits(); saveHabitLog();
    closeHabitModal();
    refreshHabits();
  });
  $h('hm-name').focus();
}

/* ---------------- 5d. Deník (kniha: jedna stránka na každý den) ----------------
   Vlevo je přehled dne (nálada, co se dělo, „před rokem“), vpravo linkovaná stránka na psaní.
   Text se ukládá automaticky; listuje se šipkami s animací otočení listu. */
const DIARY_PROMPTS = [
  'Co se dnes povedlo?', 'Za co jsem dnes vděčný?', 'Co mě dnes překvapilo?', 'Na co se těším zítra?',
  'Co jsem se dnes naučil?', 'Co mě dnes potěšilo?', 'Co bych příště udělal jinak?', 'S kým jsem dnes mluvil a co mi to dalo?',
  'Jak se dnes cítím a proč?', 'Co z dneška si chci zapamatovat?', 'Co mě dnes stálo nejvíc energie?', 'Jaký byl dnešek v jedné větě?'
];
const DIARY_FLIP_MS = 720;         // délka otočení listu
const DIARY_COVER_MS = 1300;       // délka otevření obálky
let diaryDate = fmtDate(new Date());
let diaryTimer = null;             // odložené automatické uložení
let diaryDirty = false;            // uživatel na zobrazené stránce něco napsal a ještě to není uložené
let diaryIntroTimer = null;

function saveDiary(){ saveKey('sovaa:diary', state.diary); }
function diaryText(date){ return (state.diary[date] && state.diary[date].text) || ''; }
function saveDiaryText(date, text){
  if(text===diaryText(date)) return false;
  if(text.trim()) state.diary[date] = { text, updated:Date.now() }; else delete state.diary[date];
  saveDiary();
  return true;
}
/** Okamžitě uloží, co je napsané na zobrazené stránce (před přepnutím dne/záložky, při zavření appky). */
function flushDiary(){
  clearTimeout(diaryTimer);
  diaryTimer = null;
  if(!diaryDirty) return;                  // nic nového → nepřepisovat (např. po nahrání zálohy)
  const t = document.getElementById('dy-text');
  if(t && t.dataset.date) saveDiaryText(t.dataset.date, t.value);
  diaryDirty = false;
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushDiary(); });
window.addEventListener('pagehide', flushDiary);

function reducedMotion(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
function wordCount(text){ const t = text.trim(); return t ? t.split(/\s+/).length : 0; }
function diarySnippet(text, max){
  const s = text.replace(/\s+/g,' ').trim();
  return s.length>max ? s.slice(0,max-1)+'…' : s;
}
function diaryStreak(){
  const today = fmtDate(new Date());
  let streak = 0, date = today;
  for(let n=0; n<4000; n++, date = addDays(date,-1)){
    if(state.diary[date]) streak++;
    else if(date!==today) break;
  }
  return streak;
}
function yearsAgoLabel(n){ return n===1 ? 'před rokem' : `před ${n} lety`; }
/** Záznamy ze stejného dne v minulých letech (nejnovější první). */
function diaryYearsAgo(date){
  return Object.keys(state.diary).filter(k=>k.slice(5)===date.slice(5) && k<date).sort().reverse()
    .map(k=>({ date:k, years:+date.slice(0,4)-+k.slice(0,4), text:state.diary[k].text }));
}
/** Co se ten den dělo v ostatních částech appky. */
function diaryDayFacts(date){
  const facts = [];
  const tasks = tasksOn(date);
  if(tasks.length) facts.push(['ti-list-check', `Úkoly: ${tasks.filter(t=>isTaskDone(t,date)).length} z ${tasks.length} hotovo`]);
  const planned = state.habits.filter(h=>habitScheduled(h, date));
  if(planned.length) facts.push(['ti-flame', `Návyky: ${planned.filter(h=>habitDone(h,date)).length} z ${planned.length}`]);
  state.hobbyLogs.filter(l=>l.date===date).forEach(l=>{
    const h = state.hobbies.find(x=>x.id===l.hobbyId);
    if(h) facts.push(['ti-run', `${h.name}${logSummary(l,h) ? ': '+logSummary(l,h) : ''}`]);
  });
  (state.events[date]||[]).forEach(t=>facts.push(['ti-calendar-event', t]));
  state.birthdays.filter(b=>b.day===+date.slice(8,10) && b.month===+date.slice(5,7)).forEach(b=>facts.push(['ti-cake', `Narozeniny: ${b.name}`]));
  return facts;
}
function openDiaryDay(date, flip){
  flushDiary();
  diaryDate = date;
  renderDiary(false, flip);
}

/* ---- vykreslení knihy ---- */
function renderDiary(intro, flip){
  flushDiary();
  diaryDirty = false;
  clearTimeout(diaryIntroTimer);
  const el = document.getElementById('page-diary');
  const today = fmtDate(new Date());
  const date = diaryDate;
  const full = new Date(date+'T00:00:00').toLocaleDateString('cs-CZ', {day:'numeric', month:'long', year:'numeric'});
  const weekday = new Date(date+'T00:00:00').toLocaleDateString('cs-CZ', {weekday:'long'});
  const nameday = state.settings.showNameday ? (NAMEDAYS[mmdd(new Date(date+'T00:00:00'))]||'').split(',')[0] : '';
  const mood = state.moods[date] || 0;
  const facts = diaryDayFacts(date);
  const ago = diaryYearsAgo(date).slice(0,3);
  const entries = Object.keys(state.diary).length;
  const prompt = DIARY_PROMPTS[Math.floor((new Date(date+'T00:00:00') - new Date(+date.slice(0,4),0,0))/864e5) % DIARY_PROMPTS.length];
  const text = diaryText(date);
  el.innerHTML = `
    <p class="eyebrow">Tvoje stránky</p>
    <h1 class="section-title">Deník</h1>
    <div class="plan-nav">
      <button class="icon-btn" id="dy-prev" aria-label="Předchozí den"><i class="ti ti-chevron-left" style="font-size:20px;"></i></button>
      <div class="plan-date">${esc(full)}</div>
      <button class="icon-btn" id="dy-next" aria-label="Další den" ${date>=today?'disabled':''}><i class="ti ti-chevron-right" style="font-size:20px;"></i></button>
      <input type="date" id="dy-jump" value="${date}" max="${today}">
      ${date===today ? '' : '<button class="btn" id="dy-today"><i class="ti ti-bookmark"></i> Dnes</button>'}
      <button class="btn" id="dy-index"><i class="ti ti-list"></i> Obsah</button>
    </div>
    <div class="book-wrap">
      <div class="book" id="book">
        <section class="book-page page-left">
          <div class="pg-date">
            <div class="pg-day">${+date.slice(8,10)}</div>
            <div class="pg-month">${esc(full.replace(/^\d+\.\s*/,''))}<span>${esc(weekday)}</span></div>
          </div>
          ${nameday ? `<div class="pg-nameday">Svátek má ${esc(nameday)}</div>` : ''}
          <div class="pg-section">
            <h4>Nálada</h4>
            <div class="mood-row" id="dy-moods">${MOODS.map(m=>`<button class="mood-btn${mood===m.v?' on':''}" data-v="${m.v}" title="${m.label}" aria-label="${m.label}" aria-pressed="${mood===m.v}">${m.emoji}</button>`).join('')}
              <span class="mood-label">${mood ? MOODS[mood-1].label : ''}</span></div>
          </div>
          <div class="pg-section">
            <h4>Co se dělo</h4>
            ${facts.length ? `<ul class="pg-facts">${facts.map(([ic,t])=>`<li><i class="ti ${ic}"></i><span>${esc(t)}</span></li>`).join('')}</ul>` : '<p class="pg-empty">Z ostatních záložek tu zatím nic není.</p>'}
          </div>
          <div class="pg-section">
            <h4>Tento den v minulých letech</h4>
            ${ago.length ? ago.map(a=>`<div class="pg-ago" data-date="${a.date}"><b>${yearsAgoLabel(a.years)}</b> · ${esc(new Date(a.date+'T00:00:00').toLocaleDateString('cs-CZ'))}<div>${esc(diarySnippet(a.text, 170))}</div></div>`).join('')
              : '<p class="pg-empty">Z tohoto dne zatím nemáš žádný starší záznam.</p>'}
          </div>
          <div class="pg-foot">${entries} ${entries===1?'zápis':(entries<5&&entries>0?'zápisy':'zápisů')} · série ${diaryStreak()} ${diaryStreak()===1?'den':(diaryStreak()>1&&diaryStreak()<5?'dny':'dní')}</div>
        </section>
        <section class="book-page page-right">
          <div class="pg-prompt">${esc(prompt)}</div>
          <textarea id="dy-text" data-date="${date}" placeholder="Začni psát…" spellcheck="true" aria-label="Zápis v deníku">${esc(text)}</textarea>
          <div class="pg-meta"><span id="dy-status">${text ? 'Uloženo' : ''}</span><span id="dy-count">${wordCount(text)} ${wordCount(text)===1?'slovo':(wordCount(text)>1&&wordCount(text)<5?'slova':'slov')}</span></div>
        </section>
        ${intro ? `<div class="cover" id="book-cover" role="button" tabindex="0" aria-label="Otevřít deník">
          <div class="cover-inner"><div class="cover-orn"></div><div class="cover-title">Deník</div>
            <div class="cover-sub">${esc(state.profile.name || 'SOVAA')}</div><div class="cover-year">${esc(date.slice(0,4))}</div>
            <div class="cover-hint">klepni pro otevření</div></div></div>` : ''}
      </div>
    </div>
  `;
  const book = document.getElementById('book');

  /* obálka (úvodní animace) a otočení listu */
  const cover = document.getElementById('book-cover');
  if(cover){
    const open = ()=>{
      if(!cover.isConnected || cover.classList.contains('open')) return;
      cover.classList.add('open');
      setTimeout(()=>cover.remove(), DIARY_COVER_MS);
    };
    if(reducedMotion()) cover.remove();
    else {
      cover.addEventListener('click', open);
      cover.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') open(); });
      diaryIntroTimer = setTimeout(open, 750);
    }
  }
  if(flip && !reducedMotion()){
    const leaf = document.createElement('div');
    leaf.className = 'leaf '+flip;
    leaf.innerHTML = '<div class="face front"></div><div class="face back"></div>';
    book.appendChild(leaf);
    setTimeout(()=>leaf.remove(), DIARY_FLIP_MS);
  }

  /* ovládání */
  const nav = (delta)=>{
    const target = addDays(diaryDate, delta);
    if(target>today) return;
    openDiaryDay(target, delta>0 ? 'next' : 'prev');
  };
  document.getElementById('dy-prev').addEventListener('click', ()=>nav(-1));
  document.getElementById('dy-next').addEventListener('click', ()=>nav(1));
  document.getElementById('dy-jump').addEventListener('change', (e)=>{
    const v = e.target.value;
    if(!v) return;
    const target = v>today ? today : v;
    openDiaryDay(target, target>diaryDate ? 'next' : 'prev');
  });
  const todayBtn = document.getElementById('dy-today');
  if(todayBtn) todayBtn.addEventListener('click', ()=>openDiaryDay(today, today>diaryDate ? 'next' : 'prev'));
  document.getElementById('dy-index').addEventListener('click', openDiaryIndex);
  el.querySelectorAll('.pg-ago').forEach(a=>a.addEventListener('click', ()=>openDiaryDay(a.dataset.date, 'prev')));
  el.querySelectorAll('#dy-moods .mood-btn').forEach(b=>b.addEventListener('click', ()=>{
    flushDiary();
    setMood(date, +b.dataset.v);
    renderDiary(false);
  }));
  const ta = document.getElementById('dy-text');
  ta.addEventListener('input', ()=>{
    diaryDirty = true;
    const n = wordCount(ta.value);
    document.getElementById('dy-count').textContent = `${n} ${n===1?'slovo':(n>1&&n<5?'slova':'slov')}`;
    document.getElementById('dy-status').textContent = 'Ukládám…';
    clearTimeout(diaryTimer);
    diaryTimer = setTimeout(()=>{
      saveDiaryText(ta.dataset.date, ta.value);
      diaryDirty = false;
      const st = document.getElementById('dy-status');
      if(st) st.textContent = ta.value.trim() ? 'Uloženo' : '';
    }, 500);
  });
  ta.addEventListener('blur', flushDiary);
}

/* ---- Obsah: všechny zápisy podle měsíců ---- */
function closeDiaryIndex(){ const m = document.getElementById('diary-backdrop'); if(m) m.remove(); }
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeDiaryIndex(); });
function openDiaryIndex(){
  flushDiary();
  closeDiaryIndex();
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop open';
  wrap.id = 'diary-backdrop';
  wrap.innerHTML = `
    <div class="modal-panel plan-modal">
      <button class="icon-btn modal-close" id="di-close" aria-label="Zavřít"><i class="ti ti-x"></i></button>
      <h2 class="sub">Obsah deníku</h2>
      <input type="text" id="di-q" placeholder="Hledat v zápisech…">
      <div id="di-list" class="di-list"></div>
    </div>`;
  document.body.appendChild(wrap);
  const draw = ()=>{
    const q = document.getElementById('di-q').value.trim().toLowerCase();
    const dates = Object.keys(state.diary).filter(d=>!q || state.diary[d].text.toLowerCase().includes(q)).sort().reverse();
    const list = document.getElementById('di-list');
    if(!dates.length){ list.innerHTML = `<p class="muted">${Object.keys(state.diary).length ? 'Nic nenalezeno.' : 'Zatím žádné zápisy. Otevři stránku a začni psát.'}</p>`; return; }
    let month = '', html = '';
    dates.forEach(d=>{
      const m = new Date(d+'T00:00:00').toLocaleDateString('cs-CZ', {month:'long', year:'numeric'});
      if(m!==month){ month = m; html += `<h4 class="di-month">${esc(m.charAt(0).toUpperCase()+m.slice(1))}</h4>`; }
      const mv = state.moods[d];
      html += `<div class="di-row" data-date="${d}"><span class="di-day">${+d.slice(8,10)}.</span>
        <span class="di-mood">${mv ? MOODS[mv-1].emoji : ''}</span>
        <span class="di-snip">${esc(diarySnippet(state.diary[d].text, 90))}</span>
        <span class="di-words">${wordCount(state.diary[d].text)} sl.</span></div>`;
    });
    list.innerHTML = html;
    list.querySelectorAll('.di-row').forEach(r=>r.addEventListener('click', ()=>{
      const d = r.dataset.date;
      closeDiaryIndex();
      openDiaryDay(d, d>diaryDate ? 'next' : 'prev');
    }));
  };
  document.getElementById('di-q').addEventListener('input', draw);
  document.getElementById('di-close').addEventListener('click', closeDiaryIndex);
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) closeDiaryIndex(); });
  draw();
  document.getElementById('di-q').focus();
}

/* ---------------- 5e. Jídlo a energie (snědeno vs. spáleno), váha ----------------
   Výdej za den = klidový výdej (BMR, Mifflin–St Jeor) × běžná aktivita + kalorie ze sportu.
   Bez údajů o těle se ukazuje jen snědeno a spáleno sportem. Všechny hodnoty jsou orientační. */
const MEAL_TYPES = [['breakfast','Snídaně'], ['lunch','Oběd'], ['dinner','Večeře'], ['snack','Svačina'], ['other','Jiné']];
const MEAL_TYPE_NAME = Object.fromEntries(MEAL_TYPES);
const PAL_OPTIONS = [[1.2,'Sedavý den (bez sportu)'], [1.375,'Lehce aktivní (občas chůze, práce na nohou)'], [1.55,'Aktivní (fyzická práce)']];
const GOAL_OPTIONS = [[0,'Udržovat váhu'], [-300,'Mírně hubnout (−300 kcal/den)'], [-500,'Hubnout (−500 kcal/den)'], [300,'Nabírat (+300 kcal/den)']];
/* MET podle rychlosti (km/h), podle Compendium of Physical Activities — zaokrouhlené orientační hodnoty */
const MET_TABLE = {
  run:  [[6.4,6.0],[8.0,8.3],[9.7,9.8],[11.3,11.0],[12.9,11.8],[14.5,12.8],[16,14.5]],
  bike: [[10,4.0],[16,6.8],[20,8.0],[25,10.0],[30,12.0]]
};
const MET_FIXED = { swim:6.0, hike:6.0, football:7.0, gym:5.0, custom:4.5 };
const DEFAULT_SPEED = { run:9, bike:18, hike:4.5, swim:2.0 };      // km/h, když zadáš jen vzdálenost

function saveMeals(){ saveKey('sovaa:meals', state.meals); }
function saveWeights(){ saveKey('sovaa:weights', state.weights); }
function saveBody(){ saveKey('sovaa:body', state.body); }
function r1(n){ return Math.round(n*10)/10; }
function mealTypeByHour(){ const h = new Date().getHours(); return h<10 ? 'breakfast' : (h<15 ? 'lunch' : (h<21 ? 'dinner' : 'other')); }

/* ---- tělo, váha, výdej ---- */
function latestWeight(date){
  const keys = Object.keys(state.weights).filter(k=>k<=date).sort();
  return keys.length ? Number(state.weights[keys[keys.length-1]]) : null;
}
function bmrFor(date){
  const w = latestWeight(date), h = Number(state.body.height), by = Number(state.body.birthYear), sex = state.body.sex;
  if(!(w>0 && h>0 && by>1900 && (sex==='m' || sex==='f'))) return null;
  const age = +date.slice(0,4) - by;
  return Math.round(10*w + 6.25*h - 5*age + (sex==='m' ? 5 : -161));
}
function baseBurn(date){
  const b = bmrFor(date);
  return b ? Math.round(b*(Number(state.body.pal)||1.2)) : null;
}
function sportKcalOn(date){ return state.hobbyLogs.filter(l=>l.date===date).reduce((s,l)=>s+(Number(l.kcal)||0), 0); }
function mealsOn(date){ return state.meals[date] || []; }
function eatenOn(date){
  return mealsOn(date).reduce((a,m)=>({ kcal:a.kcal+(m.kcal||0), p:a.p+(m.p||0), c:a.c+(m.c||0), f:a.f+(m.f||0) }), { kcal:0, p:0, c:0, f:0 });
}
/** Celkový výdej dne (základ + sport); bez údajů o těle jen sport. */
function burnOn(date){
  const base = baseBurn(date), sport = sportKcalOn(date);
  return { base, sport, total:(base||0)+sport };
}
function interpMet(table, speed){
  if(speed<=table[0][0]) return table[0][1];
  for(let i=1; i<table.length; i++){
    if(speed<=table[i][0]){
      const [x0,y0] = table[i-1], [x1,y1] = table[i];
      return y0 + (y1-y0)*(speed-x0)/(x1-x0);
    }
  }
  return table[table.length-1][1];
}
/** Odhad spálených kcal u sportu: MET × váha × čas. null, když chybí váha nebo čas/vzdálenost. */
function estimateSportKcal(h, amount, minutes, weight){
  if(!(weight>0)) return null;
  let min = Number(minutes)||0;
  const dist = h.unit==='km' ? (Number(amount)||0) : 0;
  if(!(min>0) && dist>0 && DEFAULT_SPEED[h.preset]) min = dist/DEFAULT_SPEED[h.preset]*60;
  if(!(min>0)) return null;
  let met;
  if(MET_TABLE[h.preset] && dist>0) met = interpMet(MET_TABLE[h.preset], dist/(min/60));
  else if(h.preset==='run') met = 9.8;
  else if(h.preset==='bike') met = 6.8;
  else met = MET_FIXED[h.preset] || 4.5;
  return Math.round(met*weight*(min/60));
}

/* ---- karta „Jídlo a energie“ v záložce Dnes ---- */
function refreshEnergy(){
  const wrap = document.getElementById('pl-energy');
  if(wrap) buildEnergyCard(wrap, fmtDate(new Date()));
  renderSidebarToday();
}
function buildEnergyCard(wrap, date){
  const open = state.settings.energyOpen!==false;
  const today = fmtDate(new Date());
  const eaten = eatenOn(date), burn = burnOn(date);
  const goal = Number(state.body.goal)||0;
  const meals = [...mealsOn(date)].sort((a,b)=>(a.ts||0)-(b.ts||0));
  const w = latestWeight(date);
  const hasBody = burn.base!==null;
  const balance = eaten.kcal - burn.total;
  const remaining = burn.total + goal - eaten.kcal;
  let body = '';
  if(open){
    const cells = hasBody ? `
      <div class="nutri-cell big"><b>${Math.round(eaten.kcal)}</b><span>snědeno (kcal)</span></div>
      <div class="nutri-cell" title="Klidový výdej × aktivita ${burn.base} + sport ${Math.round(burn.sport)}"><b>${Math.round(burn.total)}</b><span>výdej (kcal)</span></div>
      <div class="nutri-cell"><b style="color:${balance>0?'var(--rust)':'var(--teal-ink)'};">${balance>0?'+':'−'}${Math.round(Math.abs(balance))}</b><span>bilance (kcal)</span></div>
      <div class="nutri-cell"><b>${Math.round(Math.abs(remaining))}</b><span>${remaining>=0 ? 'ještě můžeš sníst' : 'přes cíl'}</span></div>`
      : `
      <div class="nutri-cell big"><b>${Math.round(eaten.kcal)}</b><span>snědeno (kcal)</span></div>
      <div class="nutri-cell"><b>${Math.round(burn.sport)}</b><span>spáleno sportem</span></div>`;
    const week = Array.from({length:7}, (_,i)=>addDays(date, i-6)).map(d=>({ d, eaten:eatenOn(d).kcal, burn:burnOn(d).total }));
    const maxW = Math.max(1, ...week.flatMap(x=>[x.eaten, x.burn]));
    body = `
      <div class="nutri-grid energy-grid">${cells}</div>
      <p class="muted" style="margin:8px 0 0;">Bílkoviny ${fmtDist(eaten.p)} g · sacharidy ${fmtDist(eaten.c)} g · tuky ${fmtDist(eaten.f)} g${hasBody && goal ? ` · cíl ${goal>0?'+':'−'}${Math.abs(goal)} kcal/den` : ''}</p>
      ${hasBody ? '' : '<p class="muted" style="margin:6px 0 0;">Doplň <b>váhu, výšku, rok narození a pohlaví</b> (tlačítko Údaje) a spočítá se i klidový výdej a denní bilance.</p>'}
      <div class="meal-list" id="en-meals">${meals.length ? meals.map(m=>`
        <div class="meal-row" data-id="${escAttr(m.id)}"><span class="meal-type">${esc(MEAL_TYPE_NAME[m.type]||'Jiné')}</span><span class="meal-name">${esc(m.name)}</span><span class="meal-kcal">${Math.round(m.kcal)} kcal</span>
          <button class="icon-btn" title="Smazat" aria-label="Smazat jídlo"><i class="ti ti-x"></i></button></div>`).join('') : '<p class="muted" style="margin:10px 0 0;">Zatím žádné jídlo. Přidej ho tlačítkem „+ Jídlo“, nebo v receptu klepni na „Snědl jsem“.</p>'}</div>
      <div class="energy-foot">
        <span>${w ? `Váha: <b>${String(r1(w)).replace('.',',')} kg</b>` : 'Váha zatím není zapsaná'}</span>
        <span class="muted">${energyWeightTrend(date)}</span>
      </div>
      <div class="week-bars" title="Posledních 7 dní: snědeno / výdej">${week.map(x=>`
        <div class="wb" title="${esc(new Date(x.d+'T00:00:00').toLocaleDateString('cs-CZ'))}: snědeno ${Math.round(x.eaten)}, výdej ${Math.round(x.burn)} kcal">
          <div class="wb-bars"><span class="wb-eat" style="height:${Math.max(2,Math.round(x.eaten/maxW*52))}px;"></span><span class="wb-burn" style="height:${Math.max(2,Math.round(x.burn/maxW*52))}px;"></span></div>
          <div class="wb-day${x.d===today?' today':''}">${DAY_LETTERS[dowOf(x.d)]}</div></div>`).join('')}
        <div class="wb-legend"><span><i class="wb-eat"></i> snědeno</span><span><i class="wb-burn"></i> výdej</span></div></div>`;
  }
  wrap.innerHTML = `
    <div class="habit-card energy-card">
      <div class="habit-head">
        <button class="habit-toggle" id="en-collapse" aria-expanded="${open}"><i class="ti ti-chevron-${open?'down':'right'}"></i><span class="habit-title">Jídlo a energie</span></button>
        <span class="muted">${Math.round(eaten.kcal)} kcal snědeno${hasBody ? ` · výdej ${Math.round(burn.total)}` : ''}</span>
        <button class="btn-mini" id="en-body"><i class="ti ti-user"></i> Údaje</button>
        <button class="btn-mini" id="en-add"><i class="ti ti-plus"></i> Jídlo</button>
      </div>
      ${body}
    </div>`;
  document.getElementById('en-collapse').addEventListener('click', ()=>{
    state.settings.energyOpen = !open;
    saveKey('sovaa:settings', state.settings);
    refreshEnergy();
  });
  document.getElementById('en-add').addEventListener('click', ()=>openMealModal({ date }));
  document.getElementById('en-body').addEventListener('click', ()=>openBodyModal(date));
  wrap.querySelectorAll('.meal-row').forEach(row=>row.querySelector('button').addEventListener('click', ()=>{
    state.meals[date] = mealsOn(date).filter(m=>m.id!==row.dataset.id);
    if(!state.meals[date].length) delete state.meals[date];
    saveMeals();
    refreshEnergy();
  }));
}
function energyWeightTrend(date){
  const keys = Object.keys(state.weights).filter(k=>k<=date).sort();
  if(keys.length<2) return '';
  const last = keys[keys.length-1], ref = addDays(date, -30);
  const older = keys.filter(k=>k<=ref);
  const base = older.length ? older[older.length-1] : keys[0];
  if(base===last) return '';
  const diff = Number(state.weights[last]) - Number(state.weights[base]);
  return `${diff>0?'+':'−'}${String(r1(Math.abs(diff))).replace('.',',')} kg od ${new Date(base+'T00:00:00').toLocaleDateString('cs-CZ')}`;
}

/* ---- okno: přidat jídlo (z receptu / ze surovin / ručně) ---- */
function closeMealModal(){ const m = document.getElementById('meal-backdrop'); if(m) m.remove(); }
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeMealModal(); });
function openMealModal(opts){
  closeMealModal();
  const date = opts.date || plannerDate;
  let mode = opts.recipeId ? 'recipe' : (state.recipes.length ? 'recipe' : 'food');
  const dow = dowOf(date);
  const plannedIds = (state.mealPlan[dow]||[]).filter(id=>state.recipes.some(r=>r.id===id));
  const recipeOpt = r=>`<option value="${escAttr(r.id)}" ${r.id===opts.recipeId?'selected':''}>${esc(r.title)||'Bez názvu'}</option>`;
  const planned = plannedIds.map(id=>state.recipes.find(r=>r.id===id));
  const others = state.recipes.filter(r=>!plannedIds.includes(r.id));
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop open';
  wrap.id = 'meal-backdrop';
  wrap.innerHTML = `
    <div class="modal-panel plan-modal">
      <button class="icon-btn modal-close" id="ml-close" aria-label="Zavřít"><i class="ti ti-x"></i></button>
      <h2 class="sub">Přidat jídlo</h2>
      <div class="lib-tabs" id="ml-modes"></div>
      <div id="ml-recipe">
        <div class="field"><label>Recept</label><select id="ml-rsel">${state.recipes.length
          ? (planned.length ? `<optgroup label="Z týdenního plánu na tento den">${planned.map(recipeOpt).join('')}</optgroup>` : '') + (others.length ? `<optgroup label="Všechny recepty">${others.map(recipeOpt).join('')}</optgroup>` : '')
          : '<option value="">Zatím nemáš žádný recept</option>'}</select></div>
        <div class="field"><label>Počet porcí</label><input type="number" step="0.5" min="0.5" id="ml-portions" value="${escAttr(opts.portions||1)}"></div>
      </div>
      <div id="ml-food" style="display:none;">
        <div class="field"><label>Surovina nebo potravina</label><input type="text" id="ml-fname" list="ml-flist" placeholder="např. banán, jogurt, rýže"></div>
        <datalist id="ml-flist">${FOOD_INDEX.map(f=>`<option value="${escAttr(f.label.replace(/\s*\(.*?\)/,''))}">`).join('')}</datalist>
        <div class="field"><label>Množství (g)</label><input type="number" step="any" min="0" id="ml-grams" value="100"></div>
      </div>
      <div id="ml-manual" style="display:none;">
        <div class="field"><label>Název</label><input type="text" id="ml-mname" placeholder="např. Oběd v restauraci"></div>
        <div class="grid2">
          <div class="field"><label>Energie (kcal)</label><input type="number" step="any" min="0" id="ml-mkcal"></div>
          <div class="field"><label>Bílkoviny (g, volitelné)</label><input type="number" step="any" min="0" id="ml-mp"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Sacharidy (g, volitelné)</label><input type="number" step="any" min="0" id="ml-mc"></div>
          <div class="field"><label>Tuky (g, volitelné)</label><input type="number" step="any" min="0" id="ml-mf"></div>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label>Kdy</label><select id="ml-type">${MEAL_TYPES.map(([k,n])=>`<option value="${k}" ${k===mealTypeByHour()?'selected':''}>${n}</option>`).join('')}</select></div>
        <div class="field"><label>Datum</label><input type="date" id="ml-date" value="${date}"></div>
      </div>
      <p class="nutri-preview" id="ml-preview"></p>
      <div class="row">
        <button class="btn primary" id="ml-save"><i class="ti ti-check"></i> Přidat</button>
        <button class="btn" id="ml-cancel">Zrušit</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const $m = id=>document.getElementById(id);

  /* spočítá hodnoty jídla podle aktivního režimu */
  const compute = ()=>{
    if(mode==='recipe'){
      const r = state.recipes.find(x=>x.id===$m('ml-rsel').value);
      if(!r) return { err:'Vyber recept.' };
      const nut = effectiveNutrition(r);
      if(!nut) return { err:'U tohoto receptu zatím nejsou spočítané nutriční hodnoty. Doplň suroviny s množstvím, nebo použij ruční zadání.' };
      const pt = parseNum($m('ml-portions').value);
      if(!(pt>0)) return { err:'Zadej počet porcí.' };
      const n = nut.perPortion;
      return { name:(r.title||'Bez názvu')+(pt!==1 ? ` (${String(pt).replace('.',',')}×)` : ''), kcal:n.kcal*pt, p:n.p*pt, c:n.c*pt, f:n.f*pt, recipeId:r.id };
    }
    if(mode==='food'){
      const name = $m('ml-fname').value.trim();
      const grams = parseNum($m('ml-grams').value);
      if(!name) return { err:'Napiš, co jsi snědl.' };
      if(!(grams>0)) return { err:'Zadej množství v gramech.' };
      const m = matchFood(name);
      if(!m || m.kind==='ignore') return { err:'Tuhle potravinu jsme v databázi nenašli — zadej ji ručně, nebo si ji přidej v Kuchařka → Suroviny.' };
      const k = grams/100, fd = m.food;
      return { name:`${name} ${fmtDist(grams)} g`, kcal:(fd.kcal||0)*k, p:(fd.p||0)*k, c:(fd.c||0)*k, f:(fd.f||0)*k };
    }
    const name = $m('ml-mname').value.trim();
    const kcal = parseNum($m('ml-mkcal').value);
    if(!name) return { err:'Doplň název.' };
    if(!(kcal>0)) return { err:'Zadej energii v kcal.' };
    return { name, kcal, p:parseNum($m('ml-mp').value)||0, c:parseNum($m('ml-mc').value)||0, f:parseNum($m('ml-mf').value)||0 };
  };
  const preview = ()=>{
    const res = compute();
    $m('ml-preview').textContent = res.err ? res.err : `≈ ${Math.round(res.kcal)} kcal · bílkoviny ${fmtDist(res.p)} g · sacharidy ${fmtDist(res.c)} g · tuky ${fmtDist(res.f)} g`;
    $m('ml-preview').classList.toggle('nutri-warn', !!res.err);
  };
  const setMode = (m)=>{
    mode = m;
    $m('ml-recipe').style.display = m==='recipe' ? '' : 'none';
    $m('ml-food').style.display = m==='food' ? '' : 'none';
    $m('ml-manual').style.display = m==='manual' ? '' : 'none';
    $m('ml-modes').querySelectorAll('.lib-tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.m===m));
    preview();
  };
  [['recipe','Z receptu','ti-tools-kitchen-2'], ['food','Ze surovin','ti-apple'], ['manual','Ručně','ti-pencil']].forEach(([k,label,ic])=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'lib-tab-btn';
    b.dataset.m = k;
    b.innerHTML = `<i class="ti ${ic}"></i> ${label}`;
    b.addEventListener('click', ()=>setMode(k));
    $m('ml-modes').appendChild(b);
  });
  wrap.querySelectorAll('input,select').forEach(el=>el.addEventListener('input', preview));
  wrap.querySelectorAll('select').forEach(el=>el.addEventListener('change', preview));
  setMode(mode);

  $m('ml-close').addEventListener('click', closeMealModal);
  $m('ml-cancel').addEventListener('click', closeMealModal);
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) closeMealModal(); });
  $m('ml-save').addEventListener('click', ()=>{
    const res = compute();
    if(res.err){ showToast(res.err); return; }
    const d = $m('ml-date').value || date;
    const meal = { id:'ml'+Date.now()+Math.random().toString(36).slice(2,5), name:res.name, kcal:Math.round(res.kcal), p:r1(res.p), c:r1(res.c), f:r1(res.f),
      type:$m('ml-type').value, ts:Date.now() };
    if(res.recipeId) meal.recipeId = res.recipeId;
    state.meals[d] = [...mealsOn(d), meal];
    saveMeals();
    closeMealModal();
    showToast('Jídlo přidáno');
    refreshEnergy();
  });
}

/* ---- okno: údaje o těle a váha ---- */
function closeBodyModal(){ const m = document.getElementById('body-backdrop'); if(m) m.remove(); }
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeBodyModal(); });

  closeBodyModal();
  const d0 = date || fmtDate(new Date());
  const b = state.body;
  const w = latestWeight(d0);
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop open';
  wrap.id = 'body-backdrop';
  wrap.innerHTML = `
    <div class="modal-panel plan-modal">
      <button class="icon-btn modal-close" id="bd-close" aria-label="Zavřít"><i class="ti ti-x"></i></button>
      <h2 class="sub">Údaje o těle</h2>

      <div class="grid2">

      <div class="field"><label>Cíl</label><select id="bd-goal">${GOAL_OPTIONS.map(([v,n])=>`<option value="${v}" ${Number(b.goal)===v?'selected':''}>${n}</option>`).join('')}</select></div>

  document.body.appendChild(wrap);

  const preview = ()=>{
    const tmp = { weight:parseNum($b('bd-weight').value), height:parseNum($b('bd-height').value), year:parseNum($b('bd-year').value), sex:$b('bd-sex').value, pal:Number($b('bd-pal').value) };
    const ok = tmp.weight>0 && tmp.height>0 && tmp.year>1900 && tmp.sex;

    const age = +d0.slice(0,4) - tmp.year;
    const bmr = Math.round(10*tmp.weight + 6.25*tmp.height - 5*age + (tmp.sex==='m' ? 5 : -161));
    $b('bd-preview').textContent = `Klidový výdej ≈ ${bmr} kcal, běžný den ≈ ${Math.round(bmr*tmp.pal)} kcal (bez sportu).`;
  };
  wrap.querySelectorAll('input,select').forEach(el=>{ el.addEventListener('input', preview); el.addEventListener('change', preview); });
  preview();
  $b('bd-close').addEventListener('click', closeBodyModal);
  $b('bd-cancel').addEventListener('click', closeBodyModal);
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) closeBodyModal(); });
  $b('bd-save').addEventListener('click', ()=>{
    const wt = parseNum($b('bd-weight').value);
    if(wt!=='' && !(wt>20 && wt<400)){ showToast('Váha vypadá nereálně — zkontroluj ji'); return; }
    if(wt>0) state.weights[d0] = wt;
    Object.assign(state.body, { height:parseNum($b('bd-height').value), birthYear:parseNum($b('bd-year').value), sex:$b('bd-sex').value,

    saveWeights(); saveBody();

    showToast('Údaje uloženy');

/* ---------------- 5f. Úvod (startovní obrazovka) ----------------
   Ukáže se jako první po otevření appky a po klepnutí na logo SOVAA. Není to záložka —
   je to rychlý přehled dneška s rychlým zápisem úkolu, výdaje a jídla. Karty jdou vypnout v Nastavení. */
const START_CARDS = [['tasks','Úkoly na dnes'], ['habits','Návyky a nálada'], ['energy','Jídlo a energie'], ['money','Peníze'], ['diary','Deník']];
function startCardOn(k){ return (state.settings.startCards || {})[k]!==false; }
function greetingNow(){
  const h = new Date().getHours();
  return h<5 ? 'Dobrou noc' : (h<10 ? 'Dobré ráno' : (h<18 ? 'Dobrý den' : 'Dobrý večer'));
}
function untilText(min){
  if(min<=0) return 'právě teď';
  if(min<60) return `za ${min} min`;
  const h = Math.floor(min/60), m = min%60;
  return `za ${h} h${m ? ' '+m+' min' : ''}`;
}
function diaryPromptFor(date){
  return DIARY_PROMPTS[Math.floor((new Date(date+'T00:00:00') - new Date(+date.slice(0,4),0,0))/864e5) % DIARY_PROMPTS.length];
}

function renderStart(){
  const el = document.getElementById('page-start');
  if(!el) return;
  const now = new Date(), today = fmtDate(now);
  const weekday = now.toLocaleDateString('cs-CZ', {weekday:'long'});
  const full = now.toLocaleDateString('cs-CZ', {day:'numeric', month:'long', year:'numeric'});
  const chips = [];
  if(state.settings.showNameday){
    const nd = NAMEDAYS[mmdd(now)];
    if(nd) chips.push(`<span class="allday-chip"><i class="ti ti-sparkles"></i>Svátek: ${esc(nd.split(',')[0])}</span>`);
  }
  if(state.settings.showBirthdays){
    state.birthdays.filter(b=>b.day===now.getDate() && b.month===now.getMonth()+1)
      .forEach(b=>chips.push(`<span class="allday-chip"><i class="ti ti-cake"></i>${esc(b.name)} má narozeniny</span>`));
  }
  (state.events[today]||[]).forEach(t=>chips.push(`<span class="allday-chip"><i class="ti ti-calendar-event"></i>${esc(t)}</span>`));
  el.innerHTML = `
    <div class="start-hero">
      <div>
        <div class="sg-hello">${greetingNow()}</div>
        <div class="sg-sub">${state.profile.name ? esc(state.profile.name)+' · ' : ''}${esc(weekday.charAt(0).toUpperCase()+weekday.slice(1))} ${esc(full)}</div>
      </div>
      <div class="start-chips">${chips.join('')}</div>
    </div>
    <div class="start-actions">
      <button class="btn" id="sa-task"><i class="ti ti-list-check"></i> Úkol</button>
      <button class="btn" id="sa-meal"><i class="ti ti-tools-kitchen-2"></i> Jídlo</button>
      <button class="btn" id="sa-expense"><i class="ti ti-coin"></i> Výdaj</button>
      <button class="btn" id="sa-diary"><i class="ti ti-book-2"></i> Deník</button>
      <button class="btn" id="sa-plan"><i class="ti ti-calendar-time"></i> Plán dne</button>
    </div>
    <div class="start-grid">
      ${startCardOn('tasks')  ? '<div class="start-card" id="st-tasks"></div>' : ''}
      ${startCardOn('habits') ? '<div id="pl-habits"></div>' : ''}
      ${startCardOn('energy') ? '<div id="pl-energy"></div>' : ''}
      ${startCardOn('money')  ? '<div class="start-card" id="st-money"></div>' : ''}
      ${startCardOn('diary')  ? '<div class="start-card" id="st-diary"></div>' : ''}
    </div>
    ${START_CARDS.every(([k])=>!startCardOn(k)) ? '<div class="empty-state"><i class="ti ti-layout-dashboard"></i>Všechny karty jsou vypnuté. Zapneš je v Nastavení (ozubené kolečko) → Úvodní obrazovka.</div>' : ''}
  `;
  const $s = id=>document.getElementById(id);
  $s('sa-task').addEventListener('click', ()=>{
    const q = $s('st-q');
    if(q){ q.scrollIntoView({behavior:'smooth', block:'center'}); q.focus(); }
    else openTaskModal(newTask({ date:today }), true);
  });
  $s('sa-meal').addEventListener('click', ()=>openMealModal({ date:today }));
  $s('sa-expense').addEventListener('click', ()=>{
    const a = $s('st-amt');
    if(a){ a.scrollIntoView({behavior:'smooth', block:'center'}); a.focus(); }
    else { finView = 'overview'; finMonth = monthKey(new Date()); switchTab('finance'); }
  });
  $s('sa-diary').addEventListener('click', ()=>switchTab('diary'));
  $s('sa-plan').addEventListener('click', ()=>{ plannerDate = today; plannerScrollPending = true; switchTab('today'); });

  if($s('st-tasks')) buildStartTasks($s('st-tasks'), today);
  if($s('pl-habits')) buildHabitsCard($s('pl-habits'), today);
  if($s('pl-energy')) buildEnergyCard($s('pl-energy'), today);
  if($s('st-money')) buildStartMoney($s('st-money'), today);
  if($s('st-diary')) buildStartDiary($s('st-diary'), today);
}

/* ---- karta: úkoly na dnes ---- */
function buildStartTasks(wrap, today){
  const tasks = tasksOn(today).slice().sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'));
  const done = tasks.filter(t=>isTaskDone(t, today)).length;
  const nowMin = nowMinutes();
  const next = tasks.find(t=>t.start && !isTaskDone(t, today) && toMin(t.start)>=nowMin);
  const shown = tasks.slice(0, 8);
  wrap.innerHTML = `
    <div class="sc-head"><h3>Na programu dnes</h3><span class="muted">${tasks.length ? `${done} z ${tasks.length} hotovo` : ''}</span></div>
    ${next ? `<div class="sc-next"><i class="ti ti-clock"></i> Další: <b>${next.start}</b> ${esc(next.title)} <span class="muted">(${untilText(toMin(next.start)-nowMin)})</span></div>` : ''}
    <div id="st-task-list"></div>
    ${tasks.length>shown.length ? `<p class="muted" style="margin:6px 0 0;">… a dalších ${tasks.length-shown.length} v plánu dne</p>` : ''}
    <div class="sc-add">
      <input type="text" id="st-q" placeholder="Nový úkol na dnes — třeba „14:30 Schůzka“" aria-label="Nový úkol">
      <button class="btn primary" id="st-add" aria-label="Přidat úkol"><i class="ti ti-plus"></i></button>
    </div>`;
  const list = wrap.querySelector('#st-task-list');
  if(!tasks.length) list.innerHTML = '<p class="muted" style="margin:8px 0;">Na dnešek nemáš nic naplánovaného.</p>';
  shown.forEach(t=>{
    const isDone = isTaskDone(t, today);
    const row = document.createElement('div');
    row.className = 'plan-row' + (isDone ? ' done' : '');
    row.style.setProperty('--c', PLAN_COLORS[t.color] || PLAN_COLORS.teal);
    row.innerHTML = `<input type="checkbox" ${isDone?'checked':''} aria-label="Hotovo">
      ${t.start ? `<span class="st-time">${esc(t.start)}</span>` : '<span class="st-time"></span>'}
      <i class="ti ${esc(t.icon||'ti-checkbox')} pr-icon"></i>
      <span class="pr-title">${esc(t.title)||'Bez názvu'}</span>
      <span class="pr-meta">${esc(fmtDur(t.duration||30))}</span>`;
    row.querySelector('input').addEventListener('change', ()=>toggleTaskDone(t, today));
    row.querySelector('.pr-title').addEventListener('click', ()=>openTaskModal(t, false));
    list.appendChild(row);
  });
  const add = ()=>{
    const input = wrap.querySelector('#st-q');
    const parsed = parseQuickTitle(input.value);
    if(!parsed.title) return;
    state.planner.push(newTask({ title:parsed.title, date:today, start:parsed.start }));
    savePlanner();
    renderToday();
    renderSidebarToday();
    const again = document.getElementById('st-q');
    if(again) again.focus();
  };
  wrap.querySelector('#st-add').addEventListener('click', add);
  wrap.querySelector('#st-q').addEventListener('keydown', (e)=>{ if(e.key==='Enter') add(); });
}

/* ---- karta: peníze (dnešní platby, utraceno, rychlý zápis výdaje) ---- */
function buildStartMoney(wrap, today){
  const ym = today.slice(0,7);
  const data = finMonthData(ym);
  const spentToday = data.items.filter(i=>i.date===today && !i.pending && i.type==='expense').reduce((s,i)=>s+i.amount, 0);
  const balance = data.income - data.expense;
  const pays = [...paymentsOn(today).map(r=>['Dnes',r]), ...paymentsOn(addDays(today,1)).map(r=>['Zítra',r])];
  wrap.innerHTML = `
    <div class="sc-head"><h3>Peníze</h3><span class="muted">tento měsíc <b style="color:${balance>=0?'var(--teal-ink)':'var(--danger)'};">${balance>=0?'+':'−'}${esc(fmtMoney(Math.abs(balance)))}</b></span></div>
    <p class="sc-line">Dnes utraceno: <b>${esc(fmtMoney(spentToday))}</b></p>
    ${pays.length ? `<div class="sc-pays">${pays.map(([when,r])=>`<div><i class="ti ti-coin"></i> ${when}: ${esc(r.name)} · ${esc(finSigned(r))}</div>`).join('')}</div>` : ''}
    <div class="sc-add sc-money">
      <input type="number" step="any" min="0" id="st-amt" placeholder="Částka (Kč)" aria-label="Částka výdaje">
      <select id="st-cat" aria-label="Kategorie">${finCatsOf('expense').map(c=>`<option value="${c.key}">${esc(c.name)}</option>`).join('')}</select>
      <input type="text" id="st-note" placeholder="Poznámka" aria-label="Poznámka">
      <button class="btn primary" id="st-spend" aria-label="Přidat výdaj"><i class="ti ti-plus"></i></button>
    </div>`;
  const spend = ()=>{
    const amount = parseNum(wrap.querySelector('#st-amt').value);
    if(!(amount>0)){ showToast('Zadej částku větší než 0'); return; }
    state.transactions.push({ id:'tx'+Date.now()+Math.random().toString(36).slice(2,5), date:today, amount, type:'expense',
      category:wrap.querySelector('#st-cat').value, note:wrap.querySelector('#st-note').value.trim(), ts:Date.now() });
    saveTransactions();
    showToast('Výdaj zapsán');
    renderStart();
    renderSidebarToday();
  };
  wrap.querySelector('#st-spend').addEventListener('click', spend);
  ['st-amt','st-note'].forEach(id=>wrap.querySelector('#'+id).addEventListener('keydown', (e)=>{ if(e.key==='Enter') spend(); }));
}

/* ---- karta: deník ---- */
function buildStartDiary(wrap, today){
  const words = wordCount(diaryText(today));
  const ago = diaryYearsAgo(today)[0];
  const streak = diaryStreak();
  wrap.innerHTML = `
    <div class="sc-head"><h3>Deník</h3><span class="muted">${streak>0 ? `série ${streak} ${streak===1?'den':(streak<5?'dny':'dní')}` : ''}</span></div>
    <p class="sc-prompt">„${esc(diaryPromptFor(today))}“</p>
    <p class="muted" style="margin:0 0 10px;">${words ? `Dnešní stránka: ${words} ${words===1?'slovo':(words<5?'slova':'slov')}.` : 'Dnešní stránka je zatím prázdná.'}</p>
    <button class="btn primary" id="st-diary-open"><i class="ti ti-book-2"></i> ${words ? 'Pokračovat v psaní' : 'Napsat do deníku'}</button>
    ${ago ? `<div class="st-ago" data-date="${ago.date}"><b>${esc(yearsAgoLabel(ago.years))}</b> · ${esc(new Date(ago.date+'T00:00:00').toLocaleDateString('cs-CZ'))}<div>${esc(diarySnippet(ago.text, 150))}</div></div>` : ''}`;
  wrap.querySelector('#st-diary-open').addEventListener('click', ()=>switchTab('diary'));
  const a = wrap.querySelector('.st-ago');
  if(a) a.addEventListener('click', ()=>{ switchTab('diary'); diaryDate = a.dataset.date; renderDiary(false); });
}

    <div class="kate-hero">
      <div class="avatar">${initials}</div>
      <div>
        <p class="kate-name">${esc(p.name) || 'Zadej své jméno'}</p>
        <p class="kate-motto">${p.motto ? '„'+esc(p.motto)+'“' : 'Doplň si své motto...'}</p>
      </div>
    </div>
    <div class="stat-cards">
      <div class="stat-card"><div class="stat-num">${state.notes.length}</div><div class="stat-label">poznámek</div></div>
      <div class="stat-card"><div class="stat-num">${state.library.length}</div><div class="stat-label">položek v knihovně</div></div>

      <div class="stat-card"><div class="stat-num">${financeBalanceText()}</div><div class="stat-label">měsíční zůstatek</div></div>
    </div>
    <div class="divider"></div>
    <h2 class="sub">O mně</h2>
    <div class="field"><label>Jméno</label><input type="text" id="h-name" value="${escAttr(p.name)}" placeholder="Jak se jmenuješ?"></div>
    <div class="field"><label>Motto / heslo</label><input type="text" id="h-motto" value="${escAttr(p.motto)}" placeholder="Tvoje osobní motto"></div>
    <div class="field"><label>Krátké shrnutí</label><textarea id="h-bio" placeholder="Pár vět o sobě, cílech, aktuálním zaměření...">${esc(p.bio)}</textarea></div>
    <button class="btn primary" id="h-save"><i class="ti ti-check"></i> Uložit profil</button>
    <div class="divider"></div>
    <h2 class="sub">Záloha a přenos mezi zařízeními</h2>
    <p class="muted" style="margin-top:-6px;">Data zůstávají jen v tomto prohlížeči. Pro přenos na jiný počítač/telefon stáhni zálohu a tam ji nahraj.</p>
    <div class="row" style="margin-top:10px;">
      <button class="btn" id="h-export"><i class="ti ti-download"></i> Stáhnout zálohu</button>
      <button class="btn" id="h-import-btn"><i class="ti ti-upload"></i> Nahrát zálohu</button>
      <input type="file" id="h-import-file" accept="application/json" style="display:none;">
    </div>
  `;
  document.getElementById('h-save').addEventListener('click', ()=>{
    state.profile = {
      name: document.getElementById('h-name').value.trim(),
      motto: document.getElementById('h-motto').value.trim(),
      bio: document.getElementById('h-bio').value.trim()
    };
    saveKey('sovaa:profile', state.profile);
    showToast('Profil uložen');
    renderHome();
  });
  document.getElementById('h-export').addEventListener('click', ()=>{
    const backup = {
      profile: state.profile, notes: state.notes, library: state.library,
      finance: state.finance, financeHistory: state.financeHistory,
      recipes: state.recipes, customFoods: state.customFoods, mealPlan: state.mealPlan, shopping: state.shopping,
      hobbies: state.hobbies, hobbyLogs: state.hobbyLogs, achievements: state.achievements, planner: state.planner,
      habits: state.habits, habitLog: state.habitLog, moods: state.moods, diary: state.diary,
      transactions: state.transactions, recurring: state.recurring, meals: state.meals, weights: state.weights, body: state.body,
      events: state.events, birthdays: state.birthdays,
      settings: state.settings, exported: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sovaa-zaloha-' + fmtDate(new Date()) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Záloha stažena (Trezor se nezálohuje)');
  });
  document.getElementById('h-import-btn').addEventListener('click', ()=>{
    document.getElementById('h-import-file').click();
  });
  document.getElementById('h-import-file').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(data.profile) state.profile = data.profile;
      if(data.notes) state.notes = data.notes;
      if(data.library) state.library = data.library;
      if(data.finance) state.finance = data.finance;
      if(data.financeHistory) state.financeHistory = data.financeHistory;
      if(Array.isArray(data.recipes)) state.recipes = data.recipes;
      if(Array.isArray(data.customFoods)) state.customFoods = data.customFoods;
      if(data.mealPlan && typeof data.mealPlan==='object') state.mealPlan = data.mealPlan;
      if(Array.isArray(data.shopping)) state.shopping = data.shopping;
      if(Array.isArray(data.hobbies)) state.hobbies = data.hobbies;
      if(Array.isArray(data.hobbyLogs)) state.hobbyLogs = data.hobbyLogs;
      if(Array.isArray(data.achievements)) state.achievements = data.achievements;
      if(Array.isArray(data.planner)) state.planner = data.planner;
      if(Array.isArray(data.habits)) state.habits = data.habits;
      if(data.habitLog && typeof data.habitLog==='object') state.habitLog = data.habitLog;
      if(data.moods && typeof data.moods==='object') state.moods = data.moods;
      if(data.diary && typeof data.diary==='object') state.diary = data.diary;
      if(Array.isArray(data.transactions)) state.transactions = data.transactions;
      if(Array.isArray(data.recurring)) state.recurring = data.recurring;
      if(data.meals && typeof data.meals==='object') state.meals = data.meals;
      if(data.weights && typeof data.weights==='object') state.weights = data.weights;
      if(data.body && typeof data.body==='object') state.body = Object.assign({}, state.body, data.body);
      if(data.events) state.events = data.events;
      if(data.birthdays) state.birthdays = data.birthdays;
      if(data.settings) state.settings = Object.assign({}, state.settings, data.settings);
      saveKey('sovaa:profile', state.profile);
      saveKey('sovaa:notes', state.notes);
      saveKey('sovaa:library', state.library);
      saveKey('sovaa:finance', state.finance);
      saveKey('sovaa:finance-history', state.financeHistory);
      saveKey('sovaa:recipes', state.recipes);
      saveKey('sovaa:foods', state.customFoods);
      saveKey('sovaa:mealplan', state.mealPlan);
      saveKey('sovaa:shopping', state.shopping);
      saveKey('sovaa:hobbies', state.hobbies);
      saveKey('sovaa:hobbylogs', state.hobbyLogs);
      saveKey('sovaa:achievements', state.achievements);
      saveKey('sovaa:planner', state.planner);
      saveKey('sovaa:habits', state.habits);
      saveKey('sovaa:habitlog', state.habitLog);
      saveKey('sovaa:moods', state.moods);
      saveKey('sovaa:diary', state.diary);
      saveKey('sovaa:transactions', state.transactions);
      saveKey('sovaa:recurring', state.recurring);
      saveKey('sovaa:meals', state.meals);
      saveKey('sovaa:weights', state.weights);
      saveKey('sovaa:body', state.body);
      saveKey('sovaa:events', state.events);
      saveKey('sovaa:birthdays', state.birthdays);
      saveKey('sovaa:settings', state.settings);
      showToast('Záloha nahrána');
      renderHome();
    }catch(err){
      showToast('Soubor se nepodařilo přečíst');
    }
    e.target.value = '';
  });
}
function financeBalanceText(){
  const f = state.finance;
  const income = parseFloat(f.income)||0;
  const expenses = ['rent','energy','internet','insurance','other'].reduce((a,k)=>a+(parseFloat(f[k])||0),0);
  const bal = income - expenses;
  if(!income && !expenses) return '—';
  return (bal>=0?'+':'') + Math.round(bal).toLocaleString('cs-CZ') + ' Kč';
}

/* ---------------- 6. Poznámky ---------------- */
function renderNotes(){
  const el = document.getElementById('page-notes');
  if(activeNoteId===null && state.notes.length) activeNoteId = state.notes[0].id;
  const active = state.notes.find(n=>n.id===activeNoteId);
  const allTags = collectTags(state.notes);
  el.innerHTML = `
    <p class="eyebrow">Nápady, myšlenky a seznamy úkolů</p>
    <h1 class="section-title">Poznámky</h1>
    ${allTags.length ? `<div class="tag-filter-row" id="n-tag-filters"></div>` : ''}
    <div class="split-layout">
      <div>
        <div class="row" style="margin-bottom:14px;">
          <button class="btn primary" id="n-new-text" style="flex:1;"><i class="ti ti-notes"></i> Poznámka</button>
          <button class="btn primary" id="n-new-checklist" style="flex:1;"><i class="ti ti-list-check"></i> Checklist</button>
        </div>
        <div class="item-list" id="n-list"></div>
      </div>
      <div id="n-editor"></div>
    </div>
  `;
  if(allTags.length){
    const filterWrap = document.getElementById('n-tag-filters');
    allTags.forEach(tag=>{
      const chip = document.createElement('button');
      chip.className = 'tag-filter-chip' + (notesTagFilter===tag ? ' active' : '');
      chip.textContent = tag;
      chip.addEventListener('click', ()=>{ notesTagFilter = (notesTagFilter===tag) ? null : tag; renderNotes(); });
      filterWrap.appendChild(chip);
    });
  }
  const visibleNotes = notesTagFilter ? state.notes.filter(n=>(n.tags||[]).includes(notesTagFilter)) : state.notes;
  const list = document.getElementById('n-list');
  renderTitledList(list, visibleNotes, activeNoteId, {
    emptyText: notesTagFilter ? 'Žádná poznámka s tímhle štítkem.' : 'Zatím žádné poznámky.',
    onSelect: (n)=>{ activeNoteId = n.id; renderNotes(); },
    getPinned: (n)=>!!n.pinned,
    onTogglePin: (n)=>{ n.pinned = !n.pinned; saveKey('sovaa:notes', state.notes); renderNotes(); },
    getTags: (n)=>n.tags||[],
    getTitleHtml: (n)=>{
      if((n.type||'text')==='checklist'){
        const total = (n.items||[]).length;
        const done = (n.items||[]).filter(i=>i.done).length;
        return `<i class="ti ti-list-check" style="font-size:12px; margin-right:4px; color:var(--teal);"></i>${esc(n.title)||'Bez názvu'} <span class="muted" style="font-size:11px;">(${done}/${total})</span>`;
      }
      return esc(n.title)||'Bez názvu';
    }
  });
  document.getElementById('n-new-text').addEventListener('click', ()=>createNote('text'));
  document.getElementById('n-new-checklist').addEventListener('click', ()=>createNote('checklist'));
  const editor = document.getElementById('n-editor');
  if(!active){
    editor.innerHTML = `<div class="empty-state"><i class="ti ti-notes"></i>Vyber poznámku nebo si založ novou — poznámku, nebo checklist na úkoly.</div>`;
    return;
  }
  if((active.type||'text')==='checklist'){
    renderChecklistEditor(active);
  } else {

function renderTextEditor(active){

    active.pinned = !active.pinned;
    saveKey('sovaa:notes', state.notes);

    state.notes = state.notes.filter(n=>n.id!==active.id);
    activeNoteId = state.notes.length ? state.notes[0].id : null;
    saveKey('sovaa:notes', state.notes);
    showToast('Poznámka smazána');
    renderNotes();
  });
}
/** Checklist: zaškrtávání a přidávání/mazání položek se ukládá hned (bez tlačítka Uložit).
 *  Název a štítky mají vlastní tlačítko Uložit stejně jako u textové poznámky. */
function renderChecklistEditor(active){
  const editor = document.getElementById('n-editor');
  const items = active.items || [];
  const done = items.filter(i=>i.done).length;
  editor.innerHTML = `
    <div class="field"><input type="text" id="n-title" value="${escAttr(active.title)}" placeholder="Název checklistu (např. Úkoly na pondělí)" style="font-family:'Fraunces',serif; font-size:19px; font-weight:500; border:none; padding:4px 0; background:transparent;"></div>
    ${items.length ? `<p class="muted checklist-progress">${done} z ${items.length} hotovo</p>` : ''}
    <div class="checklist-items" id="n-cl-items"></div>
    <div class="row" style="margin-top:4px;">
      <input type="text" id="n-cl-add" placeholder="Přidat položku a stisknout Enter..." style="flex:1;">
    </div>
    <div class="field" style="margin-top:16px;"><label>Štítky (oddělené čárkou)</label><input type="text" id="n-tags" value="${escAttr((active.tags||[]).join(', '))}" placeholder="např. práce, nápady"></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn primary" id="n-save"><i class="ti ti-check"></i> Uložit název a štítky</button>
      <button class="btn" id="n-pin"><i class="ti ti-pin"></i> ${active.pinned?'Odepíchnout':'Připíchnout'}</button>
      <button class="btn danger" id="n-del"><i class="ti ti-trash"></i> Smazat</button>
    </div>
  `;
  const itemsWrap = document.getElementById('n-cl-items');
  items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'checklist-item' + (item.done ? ' done' : '');
    row.innerHTML = `
      <input type="checkbox" ${item.done?'checked':''}>
      <span class="ci-text">${esc(item.text)}</span>
      <button class="icon-btn ci-del" title="Smazat položku"><i class="ti ti-x"></i></button>
    `;
    row.querySelector('input[type=checkbox]').addEventListener('change', ()=>{
      item.done = !item.done;
      active.updated = Date.now();
      saveKey('sovaa:notes', state.notes);
      renderNotes();
    });
    row.querySelector('.ci-del').addEventListener('click', ()=>{
      active.items = items.filter(i=>i.id!==item.id);
      active.updated = Date.now();
      saveKey('sovaa:notes', state.notes);
      renderNotes();
    });
    itemsWrap.appendChild(row);
  });
  const addInput = document.getElementById('n-cl-add');
  addInput.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter') return;
    const text = addInput.value.trim();
    if(!text) return;
    if(!active.items) active.items = [];
    active.items.push({ id:'ci'+Date.now()+Math.random().toString(36).slice(2,6), text, done:false });
    active.updated = Date.now();
    saveKey('sovaa:notes', state.notes);
    renderNotes();
    const freshInput = document.getElementById('n-cl-add');
    if(freshInput) freshInput.focus();
  });
  document.getElementById('n-save').addEventListener('click', ()=>{
    active.title = document.getElementById('n-title').value.trim();
    active.tags = parseTags(document.getElementById('n-tags').value);
    active.updated = Date.now();
    saveKey('sovaa:notes', state.notes);
    showToast('Uloženo');
    renderNotes();
  });
  document.getElementById('n-pin').addEventListener('click', ()=>{
    active.pinned = !active.pinned;
    saveKey('sovaa:notes', state.notes);
    renderNotes();
  });
  document.getElementById('n-del').addEventListener('click', ()=>{
    state.notes = state.notes.filter(n=>n.id!==active.id);
    activeNoteId = state.notes.length ? state.notes[0].id : null;
    saveKey('sovaa:notes', state.notes);
    showToast('Checklist smazán');
    renderNotes();
  });
}
function createNote(type){
  const n = { id: 'n'+Date.now(), type: type||'text', title:'', content:'', items:[], tags:[], pinned:false, updated: Date.now() };
  state.notes.push(n);
  activeNoteId = n.id;
  saveKey('sovaa:notes', state.notes);
  renderNotes();
}

/* ---------------- 7. Knihovna ("Co jsem...") ---------------- */
const LIB_TYPES = [
  {key:'book', label:'Knihy', icon:'ti-book'},
  {key:'movie', label:'Filmy a seriály', icon:'ti-device-tv'},
  {key:'place', label:'Místa', icon:'ti-map-pin'},
  {key:'wishlist', label:'Wishlist', icon:'ti-gift'}
];
function renderLibrary(){
  const el = document.getElementById('page-library');
  const itemsOfType = state.library.filter(i=>i.type===libFilter);
  const allTags = collectTags(itemsOfType);
  const items = libTagFilter ? itemsOfType.filter(i=>(i.tags||[]).includes(libTagFilter)) : itemsOfType;
  const active = state.library.find(i=>i.id===activeLibId);
  el.innerHTML = `
    <p class="eyebrow">Co jsem přečetl, viděl, navštívil a co bych chtěl</p>
    <h1 class="section-title">Knihovna</h1>
    <div class="lib-tabs" id="lib-tabs"></div>
    ${allTags.length ? `<div class="tag-filter-row" id="lib-tag-filters"></div>` : ''}
    <button class="btn primary" id="lib-new" style="margin-bottom:16px;"><i class="ti ti-plus"></i> Přidat položku</button>
    <div class="lib-card-list" id="lib-cards"></div>
    <div id="lib-editor" style="margin-top:24px;"></div>
  `;
  const tabsWrap = document.getElementById('lib-tabs');
  LIB_TYPES.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'lib-tab-btn' + (t.key===libFilter?' active':'');
    b.innerHTML = `<i class="ti ${t.icon}"></i> ${t.label}`;
    b.addEventListener('click', ()=>{ libFilter=t.key; activeLibId=null; libTagFilter=null; renderLibrary(); });
    tabsWrap.appendChild(b);
  });
  if(allTags.length){
    const filterWrap = document.getElementById('lib-tag-filters');
    allTags.forEach(tag=>{
      const chip = document.createElement('button');
      chip.className = 'tag-filter-chip' + (libTagFilter===tag ? ' active' : '');
      chip.textContent = tag;
      chip.addEventListener('click', ()=>{ libTagFilter = (libTagFilter===tag) ? null : tag; renderLibrary(); });
      filterWrap.appendChild(chip);
    });
  }
  const cardsWrap = document.getElementById('lib-cards');
  if(!items.length){
    cardsWrap.innerHTML = '';
    document.getElementById('lib-editor').innerHTML = active && active.type===libFilter ? '' :
      `<div class="empty-state"><i class="ti ti-stack-2"></i>${libTagFilter ? 'Nic s tímhle štítkem.' : 'Zatím tu nic není. Přidej první položku.'}</div>`;
  } else {
    [...items].sort((a,b)=>{
      const pa = a.pinned?1:0, pb = b.pinned?1:0;
      if(pa!==pb) return pb-pa;
      return b.updated-a.updated;
    }).forEach(item=>{
      const card = document.createElement('div');
      card.className = 'lib-card';
      const ratingStr = item.rating ? '★'.repeat(item.rating)+'☆'.repeat(5-item.rating) : '';
      let sub = '';
      if(item.type==='place') sub = item.status==='visited' ? 'navštíveno' : 'bucket list';
      if(item.type==='wishlist') sub = item.price ? item.price+' Kč' : '';
      const tags = item.tags||[];
      const tagsHtml = tags.length ? `<div class="tag-chips">${tags.map(t=>`<span class="tag-chip">${esc(t)}</span>`).join('')}</div>` : '';
      const pinHtml = `<button class="pin-btn ${item.pinned?'pinned':''}" title="${item.pinned?'Odepíchnout':'Připíchnout nahoru'}"><i class="ti ti-pin"></i></button>`;
      card.innerHTML = `<div class="row-top"><div class="t">${esc(item.title)||'Bez názvu'}</div>${pinHtml}</div><div class="r">${ratingStr}</div><div class="muted" style="font-size:11px; margin-top:2px;">${sub}</div>${tagsHtml}`;
      card.querySelector('.pin-btn').addEventListener('click', (e)=>{
        e.stopPropagation();
        item.pinned = !item.pinned;
        saveKey('sovaa:library', state.library);
        renderLibrary();
      });
      card.addEventListener('click', ()=>{ activeLibId = item.id; renderLibrary(); });
      cardsWrap.appendChild(card);
    });
  }
  document.getElementById('lib-new').addEventListener('click', ()=>{
    const n = { id:'l'+Date.now(), type:libFilter, title:'', rating:0, review:'', status:'wishlist', price:'', link:'', photo:'', tags:[], pinned:false, updated:Date.now() };
    state.library.push(n);
    activeLibId = n.id;
    saveKey('sovaa:library', state.library);
    renderLibrary();
  });
  if(active && active.type===libFilter) renderLibEditor(active);
}
function starsHtml(rating, editable){
  let html = `<div class="stars" id="lib-stars">`;
  for(let i=1;i<=5;i++){
    html += `<span class="star ${i<=rating?'filled':''}" data-val="${i}">★</span>`;
  }
  html += `</div>`;
  return html;
}
function renderLibEditor(item){
  const wrap = document.getElementById('lib-editor');
  const typeLabel = LIB_TYPES.find(t=>t.key===item.type).label;
  let extraFields = '';
  if(item.type==='place'){
    extraFields = `
      <div class="status-toggle">
        <button type="button" data-status="visited" class="${item.status==='visited'?'active':''}"><i class="ti ti-check"></i> Navštíveno</button>
        <button type="button" data-status="wishlist" class="${item.status==='wishlist'?'active':''}"><i class="ti ti-flag"></i> Bucket list</button>
      </div>
      <div class="field"><label>Fotka (volitelné)</label><input type="file" id="lib-photo" accept="image/*"></div>
      ${item.photo ? `<img src="${item.photo}" class="lib-photo-preview">` : ''}
    `;
  }
  if(item.type==='wishlist'){
    extraFields = `
      <div class="grid2">
        <div class="field"><label>Cena (Kč)</label><input type="number" id="lib-price" value="${escAttr(item.price)}" placeholder="0"></div>
        <div class="field"><label>Odkaz (volitelné)</label><input type="text" id="lib-link" value="${escAttr(item.link)}" placeholder="https://..."></div>
      </div>
    `;
  }
  wrap.innerHTML = `
    <div class="divider"></div>
    <h2 class="sub">Upravit — ${typeLabel}</h2>
    <div class="field"><label>Název</label><input type="text" id="lib-title" value="${escAttr(item.title)}" placeholder="Název knihy, filmu, místa..."></div>
    ${item.type!=='wishlist' ? `<div class="field"><label>Hodnocení</label>${starsHtml(item.rating)}</div>` : ''}
    ${extraFields}
    <div class="field"><label>${item.type==='wishlist'?'Poznámka':'Krátká recenze / poznámka'}</label><textarea id="lib-review" placeholder="Co si o tom myslíš...">${esc(item.review)}</textarea></div>
    <div class="field"><label>Štítky (oddělené čárkou)</label><input type="text" id="lib-tags" value="${escAttr((item.tags||[]).join(', '))}" placeholder="např. sci-fi, doporučeno"></div>
    <div class="row">
      <button class="btn primary" id="lib-save"><i class="ti ti-check"></i> Uložit</button>
      <button class="btn danger" id="lib-del"><i class="ti ti-trash"></i> Smazat</button>
    </div>
  `;
  let currentRating = item.rating || 0;
  let currentStatus = item.status || 'wishlist';
  let currentPhoto = item.photo || '';
  if(item.type!=='wishlist'){
    const starsEl = document.getElementById('lib-stars');
    starsEl.querySelectorAll('.star').forEach(s=>{
      s.addEventListener('click', ()=>{
        const v = parseInt(s.dataset.val);
        currentRating = (currentRating===v) ? 0 : v;
        starsEl.querySelectorAll('.star').forEach(st=>st.classList.toggle('filled', parseInt(st.dataset.val)<=currentRating));
      });
    });
  }
  if(item.type==='place'){
    wrap.querySelectorAll('[data-status]').forEach(b=>{
      b.addEventListener('click', ()=>{
        currentStatus = b.dataset.status;
        wrap.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('active', x.dataset.status===currentStatus));
      });
    });
    const photoInput = document.getElementById('lib-photo');
    photoInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (ev)=>{
        img.onload = ()=>{
          const maxW = 640;
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width*scale;
          canvas.height = img.height*scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          currentPhoto = canvas.toDataURL('image/jpeg', 0.75);
          showToast('Fotka připravena — nezapomeň uložit');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  document.getElementById('lib-save').addEventListener('click', ()=>{
    item.title = document.getElementById('lib-title').value.trim();
    item.review = document.getElementById('lib-review').value;
    item.tags = parseTags(document.getElementById('lib-tags').value);
    item.rating = currentRating;
    item.updated = Date.now();
    if(item.type==='place'){ item.status = currentStatus; item.photo = currentPhoto; }
    if(item.type==='wishlist'){
      item.price = document.getElementById('lib-price').value;
      item.link = document.getElementById('lib-link').value.trim();
    }
    saveKey('sovaa:library', state.library);
    showToast('Uloženo');
    renderLibrary();
  });
  document.getElementById('lib-del').addEventListener('click', ()=>{
    state.library = state.library.filter(i=>i.id!==item.id);
    activeLibId = null;
    saveKey('sovaa:library', state.library);
    showToast('Položka smazána');
    renderLibrary();
  });
}
