<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOVAA — osobní zápisník</title>
<meta name="apple-mobile-web-app-title" content="SOVAA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#232B31">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23232B31'/%3E%3Cellipse cx='32' cy='36' rx='18' ry='16' fill='%23EEE8D8'/%3E%3Cpath d='M14 20 L22 30 L14 30 Z' fill='%23EEE8D8'/%3E%3Cpath d='M50 20 L42 30 L50 30 Z' fill='%23EEE8D8'/%3E%3Ccircle cx='24' cy='34' r='7' fill='%23232B31'/%3E%3Ccircle cx='40' cy='34' r='7' fill='%23232B31'/%3E%3Ccircle cx='24' cy='34' r='3' fill='%23C68A2E'/%3E%3Ccircle cx='40' cy='34' r='3' fill='%23C68A2E'/%3E%3Cpath d='M29 42 L32 46 L35 42 Z' fill='%23C68A2E'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script>
  /* Nastaví téma ještě před vykreslením stránky, aby nebliklo špatnou barvou. */
  (function(){
    var saved = localStorage.getItem('sovaa:theme');
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
:root{
  --paper:#EEE8D8;
  --card:#F8F4E9;
  --surface:#fff;
  --ink:#232B31;
  --ink-fill:#232B31;
  --ink-soft:#5C6670;
  --ink-faint:#8A8477;
  --line:#D9D0B7;
  --teal:#2F6F62;
  --teal-ink:#173A32;
  --ochre:#C68A2E;
  --ochre-ink:#5C3F10;
  --rust:#AC4E2E;
  --rust-ink:#4C2013;
  --plum:#6B4C7A;
  --danger:#B33B3B;
  --page:#FBF7EC;
  --page-ink:#2B2A28;
  --page-line:#E3D9C0;
}
:root[data-theme="dark"]{
  --paper:#191D20;
  --card:#23282C;
  --surface:#2D3338;
  --ink:#ECE6D8;
  --ink-fill:#121516;
  --ink-soft:#A49C8C;
  --ink-faint:#6D6558;
  --line:#3A4045;
  --teal:#3E8A7A;
  --teal-ink:#BFE7DB;
  --ochre:#D9A245;
  --ochre-ink:#F3DBA8;
  --rust:#C5663F;
  --rust-ink:#F0B99D;
  --plum:#8B6B9C;
  --danger:#D97070;
  --page:#D8D1BF;
  --page-ink:#2B2A28;
  --page-line:#C2B9A2;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  transition:background .2s ease, color .2s ease;
}
::selection{background:var(--ochre);color:#fff;}
.app{
  max-width:1180px;
  margin:0 auto;
  padding:28px 20px 60px;
  display:flex;
  gap:0;
  align-items:flex-start;
}

/* ---------- Binder tab navigation (signature element) ---------- */
.binder{
  display:flex;
  flex-direction:column;
  gap:11px;
  padding-top:20px;
  flex-shrink:0;
  width:150px;
}
.wordmark{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:20px;
  letter-spacing:.02em;
  color:var(--ink);
  padding:0 0 24px 20px;
  display:flex;
  align-items:center;
  gap:7px;
}
.wordmark i{font-size:18px; color:var(--ochre);}
.tab{
  position:relative;
  border:none;
  cursor:pointer;
  text-align:left;
  font-family:'Fraunces',serif;
  font-size:14px;
  font-weight:500;
  padding:12px 14px 12px 18px;
  border-radius:10px 0 0 10px;
  color:#fff;
  background:var(--ink-faint);
  opacity:.72;
  transform:translateX(0);
  transition:transform .18s ease, opacity .18s ease, box-shadow .18s ease;
  display:flex;
  align-items:center;
  gap:9px;
  box-shadow:0 2px 4px rgba(0,0,0,.08);
}
.tab .num{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  opacity:.75;
}
.tab:hover{opacity:.9; transform:translateX(4px);}
.tab.active{
  opacity:1;
  transform:translateX(10px);
  box-shadow:2px 3px 8px rgba(0,0,0,.16);
}
.tab[data-tab="today"]{background:var(--ink-fill);}
.tab[data-tab="diary"]{background:#7A3E48;}
.tab[data-tab="home"]{background:#6B6558;}
.tab[data-tab="notes"]{background:var(--teal);}
.tab[data-tab="library"]{background:var(--plum);}
.tab[data-tab="finance"]{background:var(--ochre); color:#3a2a08;}
.tab[data-tab="calendar"]{background:var(--rust);}
.tab[data-tab="vault"]{background:#2B2320;}
.tab[data-tab="cookbook"]{background:#6E7F3A;}
.tab[data-tab="hobbies"]{background:#3F6C9B;}
.tab[data-tab="finance"] .num{color:#3a2a08; opacity:.6;}

/* ---------- Main binder page ---------- */
.page{
  flex:1;
  min-width:0;
  background:var(--card);
  border-radius:4px 16px 16px 16px;
  border:1px solid var(--line);
  padding:44px 48px;
  box-shadow:0 1px 2px rgba(0,0,0,.03), 0 12px 30px -18px rgba(30,25,10,.25);
  position:relative;
  min-height:640px;
}
.page::before{
  content:"";
  position:absolute;
  left:0; top:0; bottom:0;
  width:56px;
  background:repeating-linear-gradient(
    to bottom,
    transparent, transparent 27px,
    var(--line) 27px, var(--line) 28px
  );
  opacity:.35;
  pointer-events:none;
  border-radius:4px 0 0 16px;
}
.page-inner{position:relative; z-index:1;}
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-faint);
  margin:0 0 6px;
}
h1.section-title{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:32px;
  margin:0 0 28px;
  color:var(--ink);
}
h2.sub{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:19px;
  margin:0 0 12px;
}
p{line-height:1.6; color:var(--ink-soft);}
a{color:var(--teal);}
label{
  display:block;
  font-size:12px;
  color:var(--ink-faint);
  margin-bottom:4px;
  font-weight:500;
}
input[type=text], input[type=number], input[type=date], input[type=password], textarea, select{
  width:100%;
  font-family:'Inter',sans-serif;
  font-size:14px;
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface);
  color:var(--ink);
  outline:none;
}
input:focus, textarea:focus, select:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(47,111,98,.12);
}
textarea{resize:vertical; min-height:100px; font-family:'Inter',sans-serif; line-height:1.6;}
button.btn{
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:500;
  padding:9px 16px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  transition:background .12s;
}
button.btn:hover{background:var(--paper);}
button.btn.primary{background:var(--ink-fill); color:#fff; border-color:var(--ink-fill);}
button.btn.primary:hover{background:#000;}
button.btn.danger{color:var(--danger); border-color:#e6c9c9;}
button.btn.danger:hover{background:#fbecec;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.field{margin-bottom:14px;}
.muted{color:var(--ink-faint); font-size:13px;}
.divider{height:1px; background:var(--line); margin:24px 0;}

/* Home / profil */
.kate-hero{display:flex; gap:24px; align-items:center; margin-bottom:8px;}
.avatar{
  width:76px; height:76px; border-radius:50%;
  background:var(--ink-fill);
  color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces',serif;
  font-size:28px; font-weight:500;
  flex-shrink:0;
}
.kate-name{font-family:'Fraunces',serif; font-size:28px; font-weight:500; margin:0;}
.kate-motto{font-family:'Fraunces',serif; font-style:italic; font-size:15px; color:var(--ink-faint); margin:4px 0 0;}
.stat-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:28px 0;}
.stat-card{
  background:var(--paper);
  border-radius:10px;
  padding:16px 18px;
}
.stat-num{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:600;}
.stat-label{font-size:12px; color:var(--ink-faint); margin-top:2px;}

/* Generic list/editor layout (Notes, Library, Vault) */
.split-layout{display:grid; grid-template-columns:220px 1fr; gap:24px;}
.item-list{display:flex; flex-direction:column; gap:6px;}
.item-row{
  padding:10px 12px;
  border-radius:8px;
  cursor:pointer;
  border:1px solid transparent;
}
.item-row:hover{background:var(--paper);}
.item-row.active{background:var(--paper); border-color:var(--line);}
.item-row .row-top{display:flex; align-items:center; justify-content:space-between; gap:6px;}
.item-row .t{font-size:13px; font-weight:500; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.item-row .d{font-size:11px; color:var(--ink-faint);}
.pin-btn{background:none; border:none; cursor:pointer; color:var(--line); padding:2px; flex-shrink:0; font-size:13px;}
.pin-btn:hover{color:var(--ink-faint);}
.pin-btn.pinned{color:var(--ochre);}
.tag-chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:5px;}
.tag-chip{
  font-size:10px;
  padding:2px 8px;
  border-radius:10px;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--ink-soft);
}
.tag-filter-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
.tag-filter-chip{
  font-size:11px;
  padding:5px 12px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
}
.tag-filter-chip.active{background:var(--teal); color:#fff; border-color:var(--teal);}

/* ---------- Checklist (v Poznámkách) ---------- */
.checklist-progress{font-size:12px; margin:-4px 0 10px;}
.checklist-items{display:flex; flex-direction:column; gap:2px; margin-bottom:10px;}
.checklist-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 6px;
  border-radius:8px;
}
.checklist-item:hover{background:var(--paper);}
.checklist-item input[type=checkbox]{
  width:18px; height:18px;
  accent-color:var(--teal);
  cursor:pointer;
  flex-shrink:0;
}
.checklist-item .ci-text{flex:1; font-size:14px;}
.checklist-item.done .ci-text{color:var(--ink-faint); text-decoration:line-through;}
.checklist-item .ci-del{opacity:0; transition:opacity .12s;}
.checklist-item:hover .ci-del{opacity:1;}

/* ---------- Kuchařka ---------- */
.cook-toolbar{display:flex; gap:10px; margin-bottom:12px;}
.cook-toolbar input{flex:1;}
.cook-toolbar select{width:auto; min-width:180px;}
.lib-card.active{border-color:var(--teal);}
.card-meta{font-size:11px; color:var(--ink-faint); margin-top:4px;}
.lib-card .row-top{display:flex; align-items:flex-start; justify-content:space-between; gap:6px;}
.fav-btn{background:none; border:none; cursor:pointer; font-size:20px; line-height:1; padding:2px 6px; color:var(--ink-faint);}
.fav-btn:hover{color:var(--rust);}
.fav-btn.on{color:var(--rust);}
.recipe-head{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.recipe-title{font-family:'Fraunces',serif; font-weight:500; font-size:26px; margin:0;}
.recipe-meta{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; font-size:13px; color:var(--ink-soft); margin:10px 0;}
.recipe-meta i{color:var(--ochre);}
.servings-ctl{display:inline-flex; align-items:center; gap:8px; background:var(--paper); border-radius:20px; padding:3px 8px;}
.servings-ctl button{width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; font-size:15px; line-height:1;}
.recipe-h{font-family:'Fraunces',serif; font-weight:500; font-size:17px; margin:22px 0 8px;}
.ing-list{list-style:none; padding:0; margin:0;}
.ing-list li{display:flex; gap:12px; padding:7px 4px; border-bottom:1px dashed var(--line); font-size:14px; color:var(--ink);}
.ing-amt{min-width:92px; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--teal); padding-top:1px;}
.ing-price{margin-left:auto; color:var(--ink-faint); font-size:12px; white-space:nowrap;}
.steps-list{padding-left:22px; margin:0;}
.steps-list li{padding:6px 0; line-height:1.6; font-size:14px; color:var(--ink);}
.ing-row{display:grid; grid-template-columns:1fr 80px 80px 84px 28px; gap:6px; margin-bottom:6px; align-items:center;}
.plan-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px;}
.plan-day{background:var(--paper); border-radius:10px; padding:12px 14px; border:1px solid transparent;}
.plan-day.today{border-color:var(--rust);}
.plan-day h3{font-family:'Fraunces',serif; font-weight:500; font-size:15px; margin:0 0 8px;}
.plan-item{display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:13px; padding:4px 0;}
.plan-link{cursor:pointer; color:var(--ink);}
.plan-link:hover{color:var(--teal); text-decoration:underline;}
.plan-day select{margin-top:8px; font-size:12px; padding:6px 8px;}
.ci-price{font-size:12px; color:var(--ink-faint); white-space:nowrap;}

/* ---------- Sporty a medaile ---------- */
.hobby-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
.hobby-form{background:var(--paper); border-radius:12px; padding:18px 20px; margin-bottom:20px;}
.log-form{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 14px;}
.log-form input[type=date]{flex:0 0 150px;}
.log-form input[type=number]{flex:0 0 96px;}
.log-form #lg-note{flex:1 1 180px;}
.log-form #lg-add{flex:0 0 auto;}
.log-row{display:flex; align-items:center; gap:12px; padding:8px 6px; border-bottom:1px dashed var(--line); font-size:13px;}
.log-row .lr-date{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-faint); min-width:84px;}
.log-row .lr-amt{font-weight:600; min-width:120px; color:var(--ink);}
.log-row .lr-note{flex:1; color:var(--ink-soft);}
.medal-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:22px;}
.medal-card{background:var(--paper); border-radius:12px; padding:16px 10px 12px; text-align:center; position:relative; border:1px solid transparent;}
.medal-card.earned{border-color:var(--line);}
.medal-svg{width:64px; height:84px; display:block; margin:0 auto 6px;}
.medal-svg.locked{opacity:.6;}
.medal-title{font-size:13px; font-weight:600; color:var(--ink);}
.medal-desc{font-size:11px; color:var(--ink-faint); margin-top:2px; line-height:1.4;}
.medal-date{font-size:11px; color:var(--ochre); margin-top:6px; font-family:'JetBrains Mono',monospace;}
.medal-progress{height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:8px;}
.medal-progress > span{display:block; height:100%; background:var(--teal);}
.medal-new{position:absolute; top:8px; right:8px; font-size:9px; background:var(--rust); color:#fff; border-radius:8px; padding:1px 7px;}
.medal-del{position:absolute; top:6px; left:6px; opacity:0; transition:opacity .12s;}
.medal-card:hover .medal-del{opacity:1;}
.ach-form{display:grid; grid-template-columns:2fr 1.2fr 140px 110px; gap:8px; align-items:center;}
.ach-form .ach-note{grid-column:1 / span 3;}
.medal-celebrate{text-align:center; max-width:400px;}
.medal-row{display:flex; flex-wrap:wrap; justify-content:center; gap:18px; margin-top:12px;}
.medal-win{max-width:140px;}

/* ---------- Úvodní obrazovka ---------- */
.wordmark{cursor:pointer; border-radius:8px;}
.wordmark:focus-visible{outline:2px solid var(--ochre); outline-offset:3px;}
.wordmark.active{text-decoration:underline; text-decoration-color:var(--ochre); text-decoration-thickness:2px; text-underline-offset:7px;}
.start-hero{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px 24px; margin-bottom:14px;}
.sg-hello{font-family:'Fraunces',serif; font-size:38px; font-weight:500; line-height:1.1; color:var(--ink);}
.sg-sub{font-size:14px; color:var(--ink-soft); margin-top:4px;}
.start-chips{display:flex; flex-wrap:wrap; gap:6px;}
.start-actions{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
.start-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(380px,100%), 1fr)); gap:16px; align-items:start;}
.start-grid .habit-card{margin-bottom:0;}
.start-card{background:var(--paper); border-radius:14px; padding:14px 16px 16px;}
.sc-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px;}
.sc-head h3{margin:0; font-family:'Fraunces',serif; font-size:17px; font-weight:500; color:var(--ink);}
.sc-head .muted{font-size:12px;}
.sc-next{font-size:13px; color:var(--ink); background:var(--card); border-radius:10px; padding:8px 12px; margin-bottom:8px;}
.sc-next i{color:var(--ochre);}
.sc-line{margin:0 0 6px; font-size:13.5px; color:var(--ink-soft);}
.sc-line b{color:var(--ink);}
.sc-pays{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
.sc-pays i{color:var(--ochre);}
.sc-prompt{font-family:'Fraunces',serif; font-style:italic; font-size:15px; color:var(--ink-soft); margin:2px 0 8px;}
.sc-add{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.sc-add input[type=text]{flex:1 1 160px;}
.sc-money input[type=number]{flex:0 0 110px;}
.sc-money select{flex:1 1 130px;}
.st-time{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-faint); min-width:40px;}
.st-ago{margin-top:12px; padding:8px 12px; border-left:3px solid var(--ochre); background:var(--card); border-radius:0 10px 10px 0; font-size:12.5px; color:var(--ink-soft); cursor:pointer;}
.st-ago:hover{background:var(--surface);}
.st-ago div{margin-top:3px; font-family:'Caveat','Segoe Script',cursive; font-size:17px; line-height:1.25; color:var(--ink);}


/* ---------- Finance: výdaje, příjmy, pravidelné platby ---------- */
.seg-toggle{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--surface);}
.seg-toggle button{border:none; background:transparent; padding:9px 16px; font-size:13px; cursor:pointer; color:var(--ink-soft);}
.seg-toggle button.on{background:var(--ink-fill); color:#fff;}
.fin-add{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 12px; align-items:center;}
.fin-add input[type=number]{flex:0 0 130px;}
.fin-add select{flex:0 1 190px;}
.fin-add input[type=date]{flex:0 0 150px;}
.fin-add input[type=text]{flex:1 1 180px;}
.fin-cat{margin-bottom:10px;}
.fc-head{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; color:var(--ink);}
.fc-head small{color:var(--ink-faint);}
.fc-bar{height:8px; background:var(--paper); border-radius:5px; overflow:hidden;}
.fc-bar span{display:block; height:100%; border-radius:5px;}
.fin-list{display:flex; flex-direction:column;}
.fin-row{display:flex; align-items:center; gap:12px; padding:10px 6px; border-bottom:1px dashed var(--line); cursor:pointer; font-size:13.5px;}
.fin-row:hover{background:var(--paper);}
.fin-row.pending{opacity:.6;}
.fr-date{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-faint); min-width:46px;}
.fr-cat{font-size:18px; width:22px; text-align:center;}
.fr-note{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; color:var(--ink);}
.fr-note b{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.fr-note small{font-size:11px; color:var(--ink-faint);}
.fr-tag{font-style:normal; font-size:10px; padding:1px 7px; border-radius:8px; background:var(--paper); border:1px solid var(--line); color:var(--ink-soft); align-self:flex-start; margin-top:2px;}
.fr-tag.wait{border-color:var(--ochre); color:var(--ochre-ink);}
.fr-amt{font-family:'JetBrains Mono',monospace; font-weight:600; white-space:nowrap;}
.fr-amt.income{color:var(--teal-ink);}
.fr-amt.expense{color:var(--ink);}
.cal-day .paydot{width:5px; height:5px; border-radius:50%; background:var(--ochre);}
.cal-day.selected .paydot{background:#fff;}
.pay-item i{color:var(--ochre);}

/* ---------- Jídlo a energie (Dnes) ---------- */
.energy-grid{margin-top:6px;}
.meal-list{margin-top:10px;}
.meal-row{display:flex; align-items:center; gap:10px; padding:6px 4px; border-bottom:1px dashed var(--line); font-size:13px;}
.meal-type{font-size:10.5px; color:var(--ink-faint); min-width:56px; text-transform:uppercase; letter-spacing:.04em;}
.meal-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink);}
.meal-kcal{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); white-space:nowrap;}
.energy-foot{display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px 14px; margin-top:12px; font-size:12.5px; color:var(--ink);}
.week-bars{display:flex; align-items:flex-end; gap:8px; margin-top:14px; flex-wrap:wrap;}
.wb{display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; min-width:28px;}
.wb-bars{display:flex; align-items:flex-end; gap:2px; height:54px;}
.wb-eat,.wb-burn{display:block; width:9px; border-radius:3px 3px 0 0;}
.wb-eat{background:var(--teal);}
.wb-burn{background:var(--ochre);}
.wb-day{font-size:10px; color:var(--ink-faint);}
.wb-day.today{color:var(--rust); font-weight:700;}
.wb-legend{display:flex; gap:12px; width:100%; font-size:11px; color:var(--ink-soft);}
.wb-legend i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px;}
.wb-legend .wb-eat{width:8px; height:8px; border-radius:50%;}
.wb-legend .wb-burn{width:8px; height:8px; border-radius:50%;}


/* ---------- Deník (kniha) ---------- */
.book-wrap{perspective:2200px; padding:6px 0 26px;}
.book{position:relative; display:grid; grid-template-columns:1fr 1fr; max-width:1000px; margin:0 auto; padding:10px; border-radius:12px; background:#4A332C; background-image:linear-gradient(135deg,#5B403A,#3B2822); box-shadow:0 26px 40px -20px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06); animation:bookIn .6s ease-out both;}
.book::before{content:""; position:absolute; left:50%; top:10px; bottom:10px; width:40px; transform:translateX(-50%); background:linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.2) 50%, rgba(0,0,0,0)); z-index:3; pointer-events:none;}
@keyframes bookIn{from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:none;}}
.book-page{position:relative; min-height:540px; padding:30px 34px 22px; background:var(--page); color:var(--page-ink); box-shadow:inset 0 0 40px rgba(120,90,40,.08);}
.page-left{border-radius:6px 0 0 6px; display:flex; flex-direction:column; gap:14px; font-size:13px;}
.page-right{border-radius:0 6px 6px 0; display:flex; flex-direction:column;}
.page-right::after{content:""; position:absolute; top:-8px; right:36px; width:18px; height:74px; background:#A8362F; clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%); filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));}
.pg-date{display:flex; align-items:center; gap:14px;}
.pg-day{font-family:'Fraunces',serif; font-size:60px; line-height:1; font-weight:500; color:var(--page-ink);}
.pg-month{font-family:'Fraunces',serif; font-size:18px; line-height:1.25; color:var(--page-ink);}
.pg-month span{display:block; font-family:'Inter',sans-serif; font-size:12px; text-transform:capitalize; color:#7a7466; margin-top:2px;}
.pg-nameday{font-size:12px; color:#7a7466; margin-top:-8px;}
.pg-section h4{margin:0 0 6px; font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:#8a8372;}
.page-left .mood-btn{background:rgba(255,255,255,.55); width:38px; height:38px; font-size:20px;}
.page-left .mood-btn.on{border-color:#4A332C; background:#fff;}
.page-left .mood-label{color:#6f695c;}
.pg-facts{list-style:none; margin:0; padding:0;}
.pg-facts li{display:flex; gap:8px; align-items:flex-start; padding:3px 0; color:var(--page-ink);}
.pg-facts i{color:#8a6a3a; margin-top:2px;}
.pg-empty{margin:0; color:#8a8372; font-style:italic; font-size:12.5px;}
.pg-ago{padding:8px 10px; border-left:3px solid #C9B58A; background:rgba(255,255,255,.4); border-radius:0 8px 8px 0; margin-bottom:6px; cursor:pointer; font-size:12.5px; color:var(--page-ink);}
.pg-ago:hover{background:rgba(255,255,255,.7);}
.pg-ago b{font-weight:600;}
.pg-ago div{margin-top:3px; color:#5f594d; font-family:'Caveat','Segoe Script','Bradley Hand',cursive; font-size:17px; line-height:1.25;}
.pg-foot{margin-top:auto; font-size:11px; color:#8a8372; font-family:'JetBrains Mono',monospace;}
.pg-prompt{font-family:'Fraunces',serif; font-style:italic; font-size:15px; color:#8a8372; margin:0 0 4px; padding-right:40px;}
#dy-text{flex:1; width:100%; min-height:420px; border:none; background:transparent; resize:none; outline:none; font-family:'Caveat','Segoe Script','Bradley Hand',cursive; font-size:23px; line-height:32px; color:var(--page-ink); padding:0 2px; background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--page-line) 31px, var(--page-line) 32px); background-attachment:local; border-radius:0;}
#dy-text:focus{border:none; box-shadow:none;}
#dy-text::placeholder{color:#b3aa94;}
.pg-meta{display:flex; justify-content:space-between; font-size:11px; color:#8a8372; font-family:'JetBrains Mono',monospace; margin-top:10px;}
.cover{position:absolute; inset:0; z-index:8; border-radius:12px; background:radial-gradient(120% 90% at 30% 20%, #8A4A55, #5E2A35 60%, #46202A); box-shadow:0 0 0 2px rgba(255,255,255,.07) inset, 6px 0 18px rgba(0,0,0,.35); transform-origin:left center; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 1.15s cubic-bezier(.55,.05,.25,1), opacity .5s ease .75s;}
.cover.open{transform:rotateY(-105deg); opacity:0; pointer-events:none;}
.cover-inner{text-align:center; color:#E9D9A8; padding:30px; border:2px solid rgba(233,217,168,.55); border-radius:8px; outline:6px double rgba(233,217,168,.25); outline-offset:6px; min-width:min(70%,360px);}
.cover-orn{width:46px; height:3px; margin:0 auto 14px; background:#E9D9A8; border-radius:2px; box-shadow:0 8px 0 #E9D9A8;}
.cover-title{font-family:'Fraunces',serif; font-size:44px; font-weight:500; letter-spacing:.04em;}
.cover-sub{font-family:'Caveat','Segoe Script',cursive; font-size:26px; margin-top:6px;}
.cover-year{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.2em; margin-top:10px; opacity:.8;}
.cover-hint{font-size:11px; margin-top:22px; opacity:.6;}
.leaf{position:absolute; top:10px; bottom:10px; left:50%; width:calc(50% - 10px); transform-origin:left center; transform-style:preserve-3d; z-index:6; pointer-events:none;}
.leaf .face{position:absolute; inset:0; background:var(--page); background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--page-line) 31px, var(--page-line) 32px); backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:inset 0 0 40px rgba(120,90,40,.1), 0 0 18px rgba(0,0,0,.25);}
.leaf .front{border-radius:0 6px 6px 0;}
.leaf .back{transform:rotateY(180deg); border-radius:6px 0 0 6px;}
.leaf.next{animation:leafNext .72s cubic-bezier(.45,.05,.3,1) forwards;}
.leaf.prev{animation:leafPrev .72s cubic-bezier(.45,.05,.3,1) forwards;}
@keyframes leafNext{from{transform:rotateY(0);} to{transform:rotateY(-180deg);}}
@keyframes leafPrev{from{transform:rotateY(-180deg);} to{transform:rotateY(0);}}
.di-list{max-height:55vh; overflow-y:auto; margin-top:10px;}
.di-month{margin:14px 0 4px; font-family:'Fraunces',serif; font-size:15px; font-weight:500;}
.di-row{display:flex; align-items:baseline; gap:10px; padding:8px 6px; border-bottom:1px dashed var(--line); cursor:pointer; font-size:13px;}
.di-row:hover{background:var(--paper);}
.di-day{font-family:'JetBrains Mono',monospace; min-width:30px; color:var(--ink-faint);}
.di-mood{min-width:22px;}
.di-snip{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink);}
.di-words{font-size:11px; color:var(--ink-faint); white-space:nowrap;}
@media (prefers-reduced-motion: reduce){ .book{animation:none;} .leaf,.cover{display:none;} }


/* ---------- Návyky a nálada (Dnes) ---------- */
.habit-card{background:var(--paper); border-radius:14px; padding:14px 16px 16px; margin-bottom:16px;}
.habit-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.habit-head .muted{flex:1; font-size:12px; min-width:120px;}
.habit-toggle{display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer; color:var(--ink); padding:2px 0;}
.habit-title{font-family:'Fraunces',serif; font-size:17px; font-weight:500;}
.habit-grid{display:grid; grid-template-columns:minmax(96px,1.7fr) repeat(7, minmax(26px,1fr)) 46px; align-items:center; gap:7px 4px; margin:6px 0 14px;}
.hb-head{text-align:center; font-size:11px; color:var(--ink-faint); font-weight:500; padding:3px 0; border-radius:6px; border:1px solid transparent;}
.hb-head.today{border-color:var(--ink); color:var(--ink);}
.hb-name{display:flex; align-items:center; gap:8px; font-size:13.5px; cursor:pointer; min-width:0; color:var(--ink);}
.hb-name span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hb-name:hover span{text-decoration:underline;}
.hb-dot{width:28px; height:28px; border-radius:50%; border:2px solid var(--c); background:transparent; color:#fff; font-size:14px; line-height:1; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; margin:0 auto;}
.hb-dot.on{background:var(--c);}
.hb-dot.off{border-color:var(--line); color:var(--ink-faint); cursor:default; border-style:dashed;}
.hb-dot.future{border-color:var(--line); opacity:.55; cursor:default;}
.hb-dot:not([disabled]):hover{box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent);}
.hb-streak{font-size:12px; color:var(--rust); font-weight:600; display:flex; align-items:center; gap:2px; justify-content:flex-end;}
.mood-block{border-top:1px dashed var(--line); padding-top:12px;}
.mood-title{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
.mood-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.mood-btn{width:42px; height:42px; border-radius:50%; border:2px solid transparent; background:var(--card); font-size:22px; line-height:1; cursor:pointer; padding:0; transition:transform .12s;}
.mood-btn:hover{transform:scale(1.1);}
.mood-btn.on{border-color:var(--ink); background:var(--surface);}
.mood-label{font-size:13px; color:var(--ink-soft); margin-left:6px;}
.mood-history{display:flex; gap:4px; margin-top:10px;}
.mood-dot{width:12px; height:12px; border-radius:50%; display:inline-block;}
.day-toggles{display:flex; gap:6px; flex-wrap:wrap;}
.day-toggle{min-width:40px; padding:7px 0; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer; font-size:12.5px;}
.day-toggle.on{background:var(--teal); border-color:var(--teal); color:#fff;}


/* ---------- Kuchařka: výživa, strava, fotky ---------- */
.recipe-thumb{display:block; width:100%; height:110px; object-fit:cover; border-radius:8px; margin-bottom:8px;}
.recipe-photo{display:block; width:100%; max-height:280px; object-fit:cover; border-radius:12px; margin-bottom:14px;}
.photo-prev{display:block; max-width:240px; max-height:160px; border-radius:10px; margin:8px 0 4px;}
.diet-badges{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px;}
.diet-badge{font-size:10.5px; padding:2px 9px; border-radius:10px; background:color-mix(in srgb, var(--olive, #6E7F3A) 20%, var(--card)); border:1px solid #6E7F3A; color:var(--ink); }
.diet-banner{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--paper); border-radius:10px; padding:10px 14px; margin-bottom:12px; font-size:12.5px; color:var(--ink-soft);}
.diet-banner i{color:#6E7F3A; font-size:16px;}
.diet-banner span{flex:1; min-width:180px;}
.diet-checks{display:flex; flex-wrap:wrap; gap:8px 18px; margin:4px 0 8px;}
.diet-check{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink); margin:0; cursor:pointer;}
.diet-check input{accent-color:var(--teal); width:16px; height:16px;}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.nutri-card{background:var(--paper); border-radius:12px; padding:14px 16px; margin-top:14px;}
.nutri-head{font-family:'Fraunces',serif; font-size:16px; font-weight:500; margin-bottom:10px;}
.nutri-head .muted{font-family:'Inter',sans-serif; font-size:11.5px; font-weight:400;}
.nutri-grid{display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr; gap:10px;}
.nutri-cell{background:var(--card); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column;}
.nutri-cell b{font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:600; color:var(--ink);}
.nutri-cell.big b{font-size:24px; color:var(--rust);}
.nutri-cell span{font-size:11px; color:var(--ink-faint); margin-top:2px;}
.macro-bar{display:flex; height:9px; border-radius:5px; overflow:hidden; margin-top:12px; background:var(--line);}
.macro-bar span{display:block; height:100%;}
.seg-p,.dot-p{background:var(--teal);}
.seg-c,.dot-c{background:var(--ochre);}
.seg-f,.dot-f{background:var(--rust);}
.macro-legend{display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:6px; font-size:11.5px; color:var(--ink-soft);}
.macro-legend i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}
.nutri-warn{color:var(--rust);}
.nutri-table td{white-space:normal; vertical-align:top;}
.nutri-table select{font-size:12px; padding:5px 6px; min-width:170px;}
.nt-g{font-size:11px; color:var(--ink-faint);}
.nutri-preview{font-size:12.5px; color:var(--teal); margin:0 0 14px;}
.plan-kcal{font-size:11px; margin:-4px 0 8px;}


.stat-cards.wrap{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));}
.stat-cards.wrap .stat-num{font-size:19px; overflow-wrap:anywhere;}
.stat-delta{font-size:11px; color:var(--ink-faint); margin-top:4px;}
.stat-delta.up{color:var(--teal);}
.stat-delta.down{color:var(--rust);}
.month-chart{display:flex; align-items:flex-end; gap:3px; height:128px; margin:10px 0 4px; padding:0 2px;}
.month-bar-wrap{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px;}
.month-bar{width:100%; max-width:22px; border-radius:3px 3px 0 0;}
.month-bar-label{font-size:9px; color:var(--ink-faint); height:11px; line-height:11px;}
.month-bar-wrap.today .month-bar-label{color:var(--rust); font-weight:700;}
.highlights{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin:18px 0 6px;}
.highlight{background:var(--paper); border-radius:10px; padding:12px 14px;}
.hl-label{font-size:11px; color:var(--ink-faint);}
.hl-value{font-family:'Fraunces',serif; font-size:18px; font-weight:500; margin:2px 0; color:var(--ink);}
.hl-sub{font-size:11.5px; color:var(--ink-soft);}
.table-wrap{overflow-x:auto;}
.month-table{width:100%; border-collapse:collapse; font-size:13px; color:var(--ink);}
.month-table th{text-align:left; font-weight:500; font-size:11.5px; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
.month-table td{padding:9px 10px; border-bottom:1px dashed var(--line); white-space:nowrap;}
.month-table tfoot td{font-weight:600; border-bottom:none; border-top:1px solid var(--line);}


/* ---------- Dnes: plán dne ---------- */
.plan-nav{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.plan-nav .plan-date{font-family:'Fraunces',serif; font-size:18px; font-weight:500; min-width:200px; text-align:center;}
.plan-nav input[type=date]{width:auto;}
.plan-summary{background:var(--paper); border-radius:12px; padding:12px 16px; margin-bottom:14px; display:flex; flex-wrap:wrap; gap:10px 24px; align-items:center; font-size:13px; color:var(--ink-soft);}
.plan-progress{flex:1; min-width:150px;}
.plan-progress .bar{height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:6px;}
.plan-progress .bar span{display:block; height:100%; background:var(--teal); transition:width .25s;}
.allday{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
.allday-chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 11px; border-radius:14px; background:var(--paper); border:1px solid var(--line); color:var(--ink-soft);}
.allday-chip i{color:var(--ochre);}
.allday-chip.link{cursor:pointer;}
.allday-chip.link:hover{border-color:var(--teal);}
.plan-quick{display:grid; grid-template-columns:1fr 110px auto auto; gap:8px; margin-bottom:18px;}
.planner-layout{display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:22px; align-items:start;}
.planner-side h3{margin:0 0 8px; font-family:'Fraunces',serif; font-weight:500; font-size:16px;}
.timeline{max-height:660px; overflow-y:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface); position:relative;}
.tl-inner{position:relative; margin:8px 0;}
.tl-label{position:absolute; left:0; width:46px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-faint); transform:translateY(-6px);}
.tl-grid{position:absolute; left:52px; right:6px; top:0; bottom:0; background-image:linear-gradient(var(--line) 1px, transparent 1px); background-size:100% var(--hour); cursor:cell;}
.tl-block{position:absolute; box-sizing:border-box; border-left:4px solid var(--c); border-radius:8px; padding:4px 6px 4px 6px; background:var(--paper); background:color-mix(in srgb, var(--c) 16%, var(--card)); color:var(--ink); display:flex; gap:6px; align-items:flex-start; overflow:hidden; cursor:pointer; font-size:12.5px; box-shadow:0 1px 2px rgba(0,0,0,.08);}
.tl-block.done{opacity:.55;}
.tl-block.done .tl-title{text-decoration:line-through;}
.tl-check{width:18px; height:18px; border-radius:50%; border:2px solid var(--c); background:transparent; cursor:pointer; flex-shrink:0; padding:0; color:#fff; font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; margin-top:1px;}
.tl-check.on{background:var(--c);}
.tl-body{flex:1; min-width:0;}
.tl-title{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tl-meta{font-size:11px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tl-block.short .tl-meta{display:none;}
.tl-grip{touch-action:none; cursor:grab; color:var(--ink-faint); padding:0 4px; font-size:13px; user-select:none; letter-spacing:-2px;}
.tl-resize{position:absolute; left:0; right:0; bottom:0; height:9px; cursor:ns-resize; touch-action:none;}
.tl-resize::after{content:""; position:absolute; left:50%; bottom:2px; width:22px; height:3px; border-radius:2px; background:var(--ink-faint); opacity:.45; transform:translateX(-50%);}
.tl-now{position:absolute; left:46px; right:0; height:0; border-top:2px solid var(--rust); z-index:3; pointer-events:none;}
.tl-now::before{content:""; position:absolute; left:-1px; top:-6px; width:10px; height:10px; border-radius:50%; background:var(--rust);}
.plan-row{display:flex; align-items:center; gap:8px; padding:8px 6px; border-bottom:1px dashed var(--line); font-size:13px;}
.plan-row input[type=checkbox]{accent-color:var(--teal); width:17px; height:17px; flex-shrink:0; cursor:pointer;}
.plan-row .pr-icon{color:var(--c, var(--teal));}
.plan-row .pr-title{flex:1; cursor:pointer; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.plan-row.done .pr-title{color:var(--ink-faint); text-decoration:line-through;}
.pr-meta{font-size:11px; color:var(--ink-faint); white-space:nowrap;}
.btn-mini{font-size:11px; padding:4px 9px; border-radius:7px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
.btn-mini:hover{background:var(--paper);}
.plan-modal{max-width:520px;}
.swatches{display:flex; gap:8px; flex-wrap:wrap;}
.swatch{width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; background:var(--c); padding:0;}
.swatch.on{border-color:var(--ink); box-shadow:0 0 0 2px var(--card) inset;}
.icon-pick{display:flex; flex-wrap:wrap; gap:6px;}
.icon-opt{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer; font-size:17px; padding:0;}
.icon-opt.on{background:var(--teal); color:#fff; border-color:var(--teal);}
.sub-row{display:flex; align-items:center; gap:8px; padding:3px 0; font-size:13px;}
.sub-row input[type=checkbox]{accent-color:var(--teal);}
.sub-row span{flex:1;}
.sub-row .sub-done{text-decoration:line-through; color:var(--ink-faint);}

.medal-celebrate .medal-svg{width:110px; height:144px; animation:medalPop .7s cubic-bezier(.2,.9,.3,1.3);}
@keyframes medalPop{0%{transform:scale(.3) rotate(-18deg); opacity:0;} 70%{transform:scale(1.12) rotate(4deg); opacity:1;} 100%{transform:scale(1) rotate(0);}}


.empty-state{
  text-align:center;
  padding:50px 20px;
  color:var(--ink-faint);
}
.empty-state i{font-size:28px; display:block; margin-bottom:10px;}

/* Finance */
.bal-bar{
  height:14px;
  background:var(--paper);
  border-radius:7px;
  overflow:hidden;
  display:flex;
  margin:10px 0 4px;
}
.bal-bar .seg{height:100%;}
.legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--ink-soft);}
.legend .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}
.result-big{font-family:'JetBrains Mono',monospace; font-size:34px; font-weight:600;}
.expense-rows{margin-top:6px;}
.expense-row{display:grid; grid-template-columns:1fr 120px 32px; gap:8px; align-items:center; margin-bottom:8px;}

/* Calendar */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.cal-month{font-family:'Fraunces',serif; font-size:20px; font-weight:500;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{font-size:11px; text-align:center; color:var(--ink-faint); padding-bottom:4px; text-transform:uppercase; letter-spacing:.04em;}
.cal-day{
  aspect-ratio:1/0.9;
  border-radius:8px;
  background:var(--paper);
  padding:6px 7px;
  cursor:pointer;
  font-size:12px;
  color:var(--ink-soft);
  position:relative;
  border:1px solid transparent;
  overflow:hidden;
}
.cal-day .nameday{
  display:block;
  font-size:9px;
  color:var(--ink-faint);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:1px;
}
.cal-day.other{opacity:.35;}
.cal-day.today{border-color:var(--rust); font-weight:600; color:var(--ink);}
.cal-day.selected{background:var(--rust); color:#fff;}
.cal-day.selected .nameday{color:rgba(255,255,255,.75);}
.cal-day .dotwrap{position:absolute; bottom:5px; left:7px; display:flex; gap:3px;}
.cal-day .evdot{width:5px; height:5px; border-radius:50%; background:var(--rust);}
.cal-day .bdaydot{width:5px; height:5px; border-radius:50%; background:var(--plum);}
.cal-day.selected .evdot, .cal-day.selected .bdaydot{background:#fff;}
.day-events{margin-top:20px;}
.ev-item{display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--paper); border-radius:8px; margin-bottom:6px; font-size:13px;}
.today-banner{
  background:var(--paper);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:20px;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:10px;
}
.today-banner i{color:var(--rust); font-size:18px;}
.today-banner b{font-weight:600;}
.birthday-panel{margin-top:28px;}
.bday-list{display:flex; flex-direction:column; gap:6px; margin-top:10px;}
.bday-item{display:flex; justify-content:space-between; align-items:center; padding:9px 12px; background:var(--paper); border-radius:8px; font-size:13px;}
.bday-add-row{display:grid; grid-template-columns:1fr 70px 70px 32px; gap:8px; margin-top:12px;}

/* Library */
.lib-tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
.lib-tab-btn{
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:500;
  padding:8px 14px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
}
.lib-tab-btn.active{background:var(--plum); color:#fff; border-color:var(--plum);}
.stars{display:flex; gap:3px; font-size:20px; cursor:pointer;}
.stars .star{color:var(--line);}
.stars .star.filled{color:var(--ochre);}
.lib-photo-preview{
  width:100%;
  max-width:260px;
  border-radius:10px;
  margin:10px 0;
  display:block;
}
.status-toggle{display:flex; gap:8px; margin-bottom:14px;}
.status-toggle button{
  flex:1;
  padding:9px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface);
  cursor:pointer;
  font-size:13px;
}
.status-toggle button.active{background:var(--teal); color:#fff; border-color:var(--teal);}
.lib-card-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;}
.lib-card{
  background:var(--paper);
  border-radius:10px;
  padding:12px 14px;
  cursor:pointer;
  border:1px solid transparent;
}
.lib-card:hover{border-color:var(--line);}
.lib-card .t{font-weight:600; font-size:14px; margin-bottom:4px;}
.lib-card .r{color:var(--ochre); font-size:12px;}

/* Vault */
.vault-lock{
  text-align:center;
  padding:60px 20px;
  max-width:320px;
  margin:0 auto;
}
.vault-lock i{font-size:36px; color:var(--ink-faint); display:block; margin-bottom:14px;}
.pin-dots{display:flex; gap:10px; justify-content:center; margin:18px 0;}
.pin-dots input{
  width:44px; height:52px;
  text-align:center;
  font-size:22px;
  font-family:'JetBrains Mono',monospace;
  border-radius:10px;
}
.vault-warning{
  background:#FBF0DC;
  border:1px solid #E6CC93;
  border-radius:10px;
  padding:12px 14px;
  font-size:12.5px;
  color:var(--ochre-ink);
  margin-bottom:16px;
  line-height:1.5;
}

/* Settings */
.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 0;
  border-bottom:1px solid var(--line);
  gap:20px;
}
.setting-row:last-child{border-bottom:none;}
.setting-text b{display:block; font-size:14px; margin-bottom:3px;}
.setting-text span{font-size:12.5px; color:var(--ink-faint);}
.switch{
  position:relative;
  width:44px; height:26px;
  flex-shrink:0;
  background:var(--line);
  border-radius:14px;
  cursor:pointer;
  border:none;
  transition:background .15s;
}
.switch.on{background:var(--teal);}
.switch::after{
  content:"";
  position:absolute;
  top:3px; left:3px;
  width:20px; height:20px;
  background:#fff;
  border-radius:50%;
  transition:transform .15s;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.switch.on::after{transform:translateX(18px);}

.icon-btn{background:none; border:none; cursor:pointer; color:var(--ink-faint); padding:4px;}
.icon-btn:hover{color:var(--danger);}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink-fill); color:#fff; padding:10px 18px; border-radius:8px;
  font-size:13px; opacity:0; transition:all .25s; pointer-events:none; z-index:50;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (max-width:820px){
  .app{flex-direction:column; padding:16px;}
  .binder{flex-direction:row; flex-wrap:wrap; width:100%; padding-top:0; gap:8px;}
  .wordmark{width:100%; padding:0 0 6px 2px;}
  .tab{border-radius:10px; transform:none !important;}
  .page{padding:26px 20px; width:100%;}
  .split-layout{grid-template-columns:1fr;}
  .stat-cards{grid-template-columns:repeat(2,1fr);}
  .grid2{grid-template-columns:1fr;}
  h1.section-title{font-size:26px; margin-bottom:20px;}
  .page{padding:22px 16px;}
  .kate-hero{gap:16px;}
  .avatar{width:60px; height:60px; font-size:22px;}
  .kate-name{font-size:22px;}
  .result-big{font-size:28px;}
  .expense-row{grid-template-columns:1fr 96px 28px;}
  .bday-add-row{grid-template-columns:1fr; gap:6px;}
  .sidebar-today{display:none;}
  .gear-btn{top:14px; right:14px;}
  .btn-pos-1{right:14px;}
  .btn-pos-2{right:60px;}
  .btn-pos-3{right:106px;}
  .cook-toolbar{flex-direction:column;}
  .cook-toolbar select{width:100%;}
  .ing-row{grid-template-columns:1fr 1fr 1fr 28px;}
  .ing-row .ir-name{grid-column:1/-1;}
  .log-form input[type=date]{flex:1 1 100%;}
  .log-form input[type=number]{flex:1 1 80px;}
  .log-form #lg-note, .log-form #lg-add{flex:1 1 100%;}
  .month-bar-wrap{gap:2px;}
  .nutri-grid{grid-template-columns:1fr 1fr;}
  .sg-hello{font-size:30px;}
  .start-actions .btn{flex:1 1 calc(50% - 8px);}
  .fin-add input[type=number], .fin-add input[type=date], .fin-add select{flex:1 1 130px;}
  .fr-date{min-width:38px;}
  .book{grid-template-columns:1fr; padding:6px;}
  .book::before{display:none;}
  .book-page{min-height:0; padding:22px 20px 18px;}
  .page-left{border-radius:6px 6px 0 0;}
  .page-right{border-radius:0 0 6px 6px;}
  .page-right::after{right:22px;}
  #dy-text{min-height:340px;}
  .leaf{left:6px; width:calc(100% - 12px);}
  .cover-title{font-size:34px;}
  .habit-grid{grid-template-columns:minmax(70px,1.3fr) repeat(7, minmax(22px,1fr)) 34px; gap:6px 2px;}
  .hb-dot{width:26px; height:26px;}
  .hb-name i{display:none;}
  .grid4{grid-template-columns:1fr 1fr;}
  .ach-form{grid-template-columns:1fr 1fr;}
  .ach-form #ac-title, .ach-form .ach-note, .ach-form #ac-add{grid-column:1/-1;}
  .plan-quick{grid-template-columns:1fr 1fr;}
  .plan-quick #pl-q{grid-column:1/-1;}
  .planner-layout{grid-template-columns:1fr;}
  .timeline{max-height:540px;}
  .plan-nav .plan-date{min-width:0; flex:1;}
}

/* ---------- Ozubené kolečko (nastavení) ---------- */
.gear-btn{
  position:fixed;
  top:24px;
  right:28px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--ink-fill);
  border:2px solid var(--card);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:200;
  color:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  transition:transform .2s ease, background .15s;
}
.gear-btn svg{width:20px; height:20px; display:block;}
.gear-btn:hover{background:#000; transform:rotate(35deg);}
.btn-pos-1{right:28px;}
.btn-pos-2{right:76px;}
.btn-pos-3{right:124px;}
#search-btn:hover{transform:scale(1.08); background:#000;}

/* ---------- Modální okno nastavení ---------- */
.modal-backdrop{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(35,43,49,.45);
  z-index:80;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-backdrop.open{display:flex;}
.modal-panel{
  position:relative;
  background:var(--card);
  border-radius:16px;
  border:1px solid var(--line);
  max-width:480px;
  width:100%;
  max-height:85vh;
  overflow-y:auto;
  padding:36px 32px;
  box-shadow:0 20px 50px -12px rgba(20,15,5,.35);
}
.modal-close{position:absolute; top:14px; right:14px;}

/* ---------- Globální hledání ---------- */
.search-panel{max-width:560px;}
.search-input-wrap{display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:6px;}
.search-input-wrap i{font-size:18px; color:var(--ink-faint);}
.search-input-wrap input{border:none; background:transparent; font-size:16px; padding:4px 0;}
.search-input-wrap input:focus{box-shadow:none;}
.search-results{max-height:50vh; overflow-y:auto; margin-top:8px;}
.search-result{
  display:flex; align-items:flex-start; gap:10px;
  padding:10px 8px;
  border-radius:8px;
  cursor:pointer;
}
.search-result:hover{background:var(--paper);}
.search-result i{font-size:16px; color:var(--teal); margin-top:2px; flex-shrink:0;}
.search-result .sr-title{font-size:13.5px; font-weight:500;}
.search-result .sr-sub{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}
.search-hint{font-size:11px; color:var(--ink-faint); margin-top:14px; text-align:center;}
kbd{background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-family:'JetBrains Mono',monospace; font-size:11px;}

/* ---------- Historie financí (mini graf) ---------- */
.fin-history-chart{display:flex; align-items:flex-end; gap:6px; height:110px; margin:14px 0 6px; padding:0 2px;}
.fin-history-bar-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px;}
.fin-history-bar{width:100%; max-width:28px; border-radius:4px 4px 0 0; min-height:3px;}
.fin-history-label{font-size:9.5px; color:var(--ink-faint); writing-mode:horizontal-tb; text-align:center;}

/* ---------- Kalendář: rychlý skok na datum ---------- */
.cal-jump-row{display:flex; gap:8px; align-items:center; margin-bottom:14px;}
.cal-jump-row input[type=month]{flex:1;}

/* ---------- Boční panel „Dnes" (jen na desktopu — výhoda většího displeje) ---------- */
.sidebar-today{
  margin-top:18px;
  padding:14px 14px 14px 20px;
  background:var(--card);
  border-radius:10px 0 0 10px;
  border:1px solid var(--line);
  border-right:none;
  font-size:12px;
  color:var(--ink-soft);
  line-height:1.55;
}
.sidebar-today .st-date{
  font-family:'Fraunces',serif;
  font-size:15px;
  font-weight:500;
  color:var(--ink);
  margin-bottom:6px;
}
.sidebar-today .st-row{display:flex; align-items:flex-start; gap:6px; margin-top:6px;}
.sidebar-today .st-row i{font-size:13px; margin-top:1px; color:var(--ochre); flex-shrink:0;}
.sidebar-today .st-empty{color:var(--ink-faint); font-style:italic;}


</style>

/* ---------------- 3. Utility ---------------- */
function fmtDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function mmdd(d){
  return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function esc(s){ return (s||'').toString().replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
/** "práce, nápady" -> ['práce','nápady'] — sdílené mezi Poznámkami a Knihovnou. */
function parseTags(str){
  return (str||'').split(',').map(s=>s.trim()).filter(Boolean);
}
/** Sesbírá unikátní štítky ze seznamu položek (pro filtrovací chipy). */
function collectTags(items){
  const set = new Set();
  items.forEach(i=>(i.tags||[]).forEach(t=>set.add(t)));
  return [...set].sort((a,b)=>a.localeCompare(b,'cs'));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 1900);
}
/** Vykreslí boční seznam položek (title + datum) do daného kontejneru.
 *  Sdílené mezi Poznámkami a Trezorem, ať se logika seznamu nepíše dvakrát.
 *  Volitelně podporuje připíchnutí nahoru (opts.getPinned/onTogglePin) a štítky (opts.getTags). */
function renderTitledList(containerEl, items, activeId, opts){
  if(!items.length){
    containerEl.innerHTML = `<p class="muted">${opts.emptyText}</p>`;
    return;
  }
  containerEl.innerHTML = '';
  const sorted = [...items].sort((a,b)=>{
    if(opts.getPinned){
      const pa = opts.getPinned(a) ? 1 : 0, pb = opts.getPinned(b) ? 1 : 0;
      if(pa!==pb) return pb-pa;
    }
    return b.updated-a.updated;
  });
  sorted.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'item-row' + (item.id===activeId ? ' active' : '');
    const titleHtml = opts.getTitleHtml ? opts.getTitleHtml(item) : (esc(item.title)||'Bez názvu');
    const tags = opts.getTags ? opts.getTags(item) : [];
    const tagsHtml = tags.length ? `<div class="tag-chips">${tags.map(t=>`<span class="tag-chip">${esc(t)}</span>`).join('')}</div>` : '';
    const pinned = opts.getPinned ? opts.getPinned(item) : false;
    const pinHtml = opts.onTogglePin ? `<button class="pin-btn ${pinned?'pinned':''}" title="${pinned?'Odepíchnout':'Připíchnout nahoru'}"><i class="ti ti-pin"></i></button>` : '';
    row.innerHTML = `<div class="row-top"><div class="t">${titleHtml}</div>${pinHtml}</div><div class="d">${new Date(item.updated).toLocaleDateString('cs-CZ')}</div>${tagsHtml}`;
    if(opts.onTogglePin){
      row.querySelector('.pin-btn').addEventListener('click', (e)=>{
        e.stopPropagation();

/* ---------------- 5b. Dnes — plán dne (časová osa, inbox, rutiny) ----------------
   Úkoly s časem se kladou na časovou osu (přetažením za ⋮⋮ je posuneš, tažením za spodní okraj
   změníš délku). Úkoly bez dne jsou v Inboxu. Opakované úkoly (rutiny) se zobrazují každý
   odpovídající den a odškrtávají se pro každý den zvlášť. */
const PLAN_COLORS = { teal:'var(--teal)', ochre:'var(--ochre)', rust:'var(--rust)', plum:'var(--plum)', blue:'#3F6C9B', olive:'#6E7F3A' };
const PLAN_ICONS = ['ti-checkbox','ti-briefcase','ti-device-laptop','ti-book','ti-run','ti-tools-kitchen-2','ti-shopping-cart','ti-phone','ti-home','ti-heart','ti-coffee','ti-bed','ti-music'];
const PLAN_REPEATS = { none:'Neopakovat', daily:'Každý den', weekdays:'Ve všední dny', weekly:'Každý týden' };
const PLAN_DURATIONS = [5,10,15,20,25,30,45,60,75,90,120,150,180,240,300,480];
const PX_PER_MIN = 1.2;            // 72 px na hodinu
const SNAP = 15;                   // přichytávání při tažení (minuty)
const WAKE_START = 7*60;           // okno, ve kterém se počítá volný čas
const WAKE_END = 22*60;

let plannerDate = fmtDate(new Date());
let plannerScrollPending = true;

/* ---- pomocné funkce ---- */
function pad2(n){ return String(n).padStart(2,'0'); }
function toMin(hhmm){
  if(!hhmm) return null;
  const [h,m] = String(hhmm).split(':').map(Number);
  return h*60 + (m||0);
}
function toHHMM(min){
  const v = Math.max(0, Math.min(1439, Math.round(min)));
  return pad2(Math.floor(v/60))+':'+pad2(v%60);
}
function fmtDur(min){
  const h = Math.floor(min/60), m = min%60;
  return h ? (m ? `${h} h ${m} min` : `${h} h`) : `${m} min`;
}
function nowMinutes(){ const n = new Date(); return n.getHours()*60 + n.getMinutes(); }
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return fmtDate(d);
}
function newTask(over){
  return Object.assign({ id:'t'+Date.now()+Math.random().toString(36).slice(2,6), title:'', date:'', start:'', duration:30,
    done:false, color:'teal', icon:'ti-checkbox', notes:'', subtasks:[], repeat:'none', doneDates:[], updated:Date.now() }, over||{});
}
function savePlanner(){ saveKey('sovaa:planner', state.planner); }
function isRecurring(t){ return !!t.repeat && t.repeat!=='none'; }
function taskOccursOn(t, date){
  if(!t.date) return false;                       // Inbox
  if(!isRecurring(t)) return t.date===date;
  if(date < t.date) return false;
  const d = new Date(date+'T00:00:00'), s = new Date(t.date+'T00:00:00');
  if(t.repeat==='daily') return true;
  if(t.repeat==='weekdays') return ((d.getDay()+6)%7) < 5;
  if(t.repeat==='weekly') return d.getDay()===s.getDay();
  return false;
}
function tasksOn(date){ return state.planner.filter(t=>taskOccursOn(t, date)); }
function isTaskDone(t, date){ return isRecurring(t) ? (t.doneDates||[]).includes(date) : !!t.done; }
function toggleTaskDone(t, date){
  if(isRecurring(t)){
    t.doneDates = t.doneDates || [];
    const i = t.doneDates.indexOf(date);
    if(i>=0) t.doneDates.splice(i,1); else t.doneDates.push(date);
  } else {
    t.done = !t.done;
  }
  t.updated = Date.now();
  savePlanner();
  renderToday();
  renderSidebarToday();
}
/** "14:30 Schůzka" -> {start:'14:30', title:'Schůzka'} */
function parseQuickTitle(text){
  const m = text.trim().match(/^(\d{1,2})[:.](\d{2})\s+(.+)$/);
  if(m && +m[1]<24 && +m[2]<60) return { start: pad2(+m[1])+':'+m[2], title: m[3].trim() };
  return { start:'', title:text.trim() };
}

/* ---- volný čas a hledání místa v dni ---- */
function busyIntervals(date, excludeId){
  return tasksOn(date).filter(t=>t.start && t.id!==excludeId)
    .map(t=>[toMin(t.start), toMin(t.start)+(t.duration||30)])
    .sort((a,b)=>a[0]-b[0]);
}
function freeGaps(date, from, excludeId){
  const lo = Math.max(WAKE_START, from||0), hi = WAKE_END;
  const gaps = [];
  let cur = lo;
  busyIntervals(date, excludeId).forEach(([s,e])=>{
    if(e<=cur) return;
    if(s>cur) gaps.push([cur, Math.min(s,hi)]);
    cur = Math.max(cur, e);
  });
  if(cur<hi) gaps.push([cur,hi]);
  return gaps.filter(g=>g[1]>g[0]);
}
function findFreeSlot(date, duration, from, excludeId){
  const base = Math.ceil((from||0)/5)*5;
  for(const [a,b] of freeGaps(date, base, excludeId)){
    const s = Math.ceil(a/5)*5;
    if(s+duration<=b) return s;
  }
  return null;
}
/** Umístí úkol do nejbližšího volného okna zobrazeného dne (u dneška až od teď). */
function scheduleTask(t){
  const date = t.date || plannerDate;
  const from = date===fmtDate(new Date()) ? nowMinutes() : 0;
  const slot = findFreeSlot(date, t.duration||30, from, t.id);
  if(slot===null){ showToast('Ve zvoleném dni se to už nevejde'); return false; }
  t.date = date;
  t.start = toHHMM(slot);
  t.updated = Date.now();
  savePlanner();
  renderToday();
  renderSidebarToday();
  return true;
}
function missedTasks(){
  const today = fmtDate(new Date()), now = nowMinutes();
  return tasksOn(today).filter(t=>t.start && !isRecurring(t) && !t.done && toMin(t.start)+(t.duration||30)<=now);
}
function replanMissed(){
  const today = fmtDate(new Date());
  const missed = missedTasks();
  missed.forEach(t=>{
    const slot = findFreeSlot(today, t.duration||30, nowMinutes(), t.id);
    t.start = slot===null ? '' : toHHMM(slot);
    t.updated = Date.now();
  });
  savePlanner();
  showToast(missed.length ? `Přeplánováno úkolů: ${missed.length}` : 'Nic ke přeplánování');
  renderToday();
}

/* ---- rozložení překrývajících se úkolů do sloupců ---- */
function layoutColumns(items){
  const sorted = [...items].sort((a,b)=>a.start-b.start || b.end-a.end);
  const clusters = [];
  let cur = null;
  sorted.forEach(it=>{
    if(!cur || it.start>=cur.end){ cur = { items:[], end:it.end }; clusters.push(cur); }
    cur.items.push(it);
    cur.end = Math.max(cur.end, it.end);
  });
  clusters.forEach(c=>{
    const cols = [];
    c.items.forEach(it=>{
      let i = cols.findIndex(end=>end<=it.start);
      if(i===-1){ i = cols.length; cols.push(0); }
      cols[i] = it.end;
      it.col = i;
    });
    c.items.forEach(it=>{ it.cols = cols.length; });
  });
}

/* ---- hlavní vykreslení ---- */
function renderToday(){
  const el = document.getElementById('page-today');
  const prevScroll = document.getElementById('pl-timeline') ? document.getElementById('pl-timeline').scrollTop : 0;

  const freeTotal = gaps.reduce((s,g)=>s+(g[1]-g[0]),0);

  el.innerHTML = `

      <div class="plan-progress">${dayTasks.length ? `${doneCount} z ${dayTasks.length} hotovo` : 'Zatím nic naplánováno'}
        <div class="bar"><span style="width:${dayTasks.length ? Math.round(doneCount/dayTasks.length*100) : 0}%"></span></div></div>
      <div id="pl-free"><i class="ti ti-hourglass" style="color:var(--ochre);"></i> ${freeTotal>0
        ? `Volno ${esc(fmtDur(freeTotal))}${longest ? ` · nejdelší okno ${toHHMM(longest[0])}–${toHHMM(longest[1])}` : ''}`
        : 'Žádné volné okno'}</div>
      ${missed ? `<button class="btn" id="pl-replan"><i class="ti ti-refresh"></i> Přeplánovat zmeškané (${missed})</button>` : ''}
    </div>

    <div class="plan-quick">
      <input type="text" id="pl-q" placeholder="Nový úkol — třeba „14:30 Schůzka“">

    </div>

      <div class="planner-main"><div class="timeline" id="pl-timeline"></div></div>
      <div class="planner-side">

        <div id="pl-untimed"></div>
        <h3 style="margin-top:20px;">Inbox <span class="muted">(${inbox.length})</span></h3>
        <div id="pl-inbox"></div>
      </div>
    </div>
  `;

  document.getElementById('pl-prev').addEventListener('click', ()=>{ plannerDate = addDays(plannerDate,-1); plannerScrollPending = true; renderToday(); });
  document.getElementById('pl-next').addEventListener('click', ()=>{ plannerDate = addDays(plannerDate,1); plannerScrollPending = true; renderToday(); });
  document.getElementById('pl-jump').addEventListener('change', (e)=>{
    if(!e.target.value) return;
    plannerDate = e.target.value; plannerScrollPending = true; renderToday();
  });
  const todayBtn = document.getElementById('pl-today');
  if(todayBtn) todayBtn.addEventListener('click', ()=>{ plannerDate = today; plannerScrollPending = true; renderToday(); });

    renderToday();
    renderSidebarToday();
    const again = document.getElementById('pl-q');
    if(again) again.focus();
  };
  document.getElementById('pl-add').addEventListener('click', ()=>quick(false));
  document.getElementById('pl-add-inbox').addEventListener('click', ()=>quick(true));
  document.getElementById('pl-q').addEventListener('keydown', (e)=>{ if(e.key==='Enter') quick(false); });
  renderStart();                      // úvodní obrazovka ukazuje stejná data → udržet ji aktuální
}

/** Pruh s věcmi, které nejsou úkoly s časem: svátek, narozeniny, události z kalendáře, plánovaná jídla. */
function buildAllDay(wrap, date){
  const dayObj = new Date(date+'T00:00:00');

      .forEach(b=>chips.push(`<span class="allday-chip"><i class="ti ti-cake"></i>${esc(b.name)}</span>`));
  }
  (state.events[date]||[]).forEach(t=>chips.push(`<span class="allday-chip"><i class="ti ti-calendar-event"></i>${esc(t)}</span>`));
  paymentsOn(date).forEach(r=>chips.push(`<span class="allday-chip"><i class="ti ti-coin"></i>Platba: ${esc(r.name)} · ${esc(finSigned(r))}</span>`));
  if(date===fmtDate(new Date())) paymentsOn(addDays(date,1)).forEach(r=>chips.push(`<span class="allday-chip"><i class="ti ti-clock"></i>Zítra: ${esc(r.name)} · ${esc(finSigned(r))}</span>`));
  wrap.innerHTML = chips.join('');
  const dow = (dayObj.getDay()+6)%7;
  (state.mealPlan[dow]||[]).forEach(id=>{
    const r = state.recipes.find(x=>x.id===id);
    if(!r) return;
    const chip = document.createElement('span');

/** Časová osa zobrazeného dne s bloky úkolů. */
function buildTimeline(scroller, timed, isToday, prevScroll){
  const items = timed.map(t=>{ const s = toMin(t.start); return { t, start:s, end:s+(t.duration||30) }; });
  let startH = 6, endH = 23;
  items.forEach(i=>{ startH = Math.min(startH, Math.floor(i.start/60)); endH = Math.max(endH, Math.ceil(i.end/60)); });
  endH = Math.min(24, endH);
  const hourPx = 60*PX_PER_MIN;
  scroller.innerHTML = `<div class="tl-inner" style="height:${(endH-startH)*hourPx}px; --hour:${hourPx}px;"></div>`;
  const inner = scroller.firstChild;
  for(let h=startH; h<endH; h++){
    const lab = document.createElement('div');
    lab.className = 'tl-label';
    lab.style.top = ((h-startH)*hourPx)+'px';
    lab.textContent = pad2(h)+':00';
    inner.appendChild(lab);
  }
  const grid = document.createElement('div');
  grid.className = 'tl-grid';
  inner.appendChild(grid);
  grid.addEventListener('click', (e)=>{
    if(e.target!==grid) return;
    const rect = grid.getBoundingClientRect();
    const y = (e.clientY - rect.top) || e.offsetY || 0;
    const min = Math.floor((startH*60 + y/PX_PER_MIN)/SNAP)*SNAP;
    openTaskModal(newTask({ date:plannerDate, start:toHHMM(Math.max(0,Math.min(min, 1439))) }), true);
  });

  layoutColumns(items);
  items.forEach(it=>{
    const t = it.t;
    const done = isTaskDone(t, plannerDate);
    const subs = t.subtasks||[];
    const top = (it.start-startH*60)*PX_PER_MIN;
    const height = Math.max((it.end-it.start)*PX_PER_MIN, 22);
    const block = document.createElement('div');
    block.className = 'tl-block' + (done ? ' done' : '') + (height<44 ? ' short' : '');
    block.dataset.id = t.id;
    block.style.cssText = `top:${top}px; height:${height}px; left:calc(${it.col/it.cols*100}% + 1px); width:calc(${100/it.cols}% - 3px); --c:${PLAN_COLORS[t.color]||PLAN_COLORS.teal};`;
    block.innerHTML = `
      <button class="tl-check ${done?'on':''}" title="Hotovo" aria-label="Hotovo">${done?'✓':''}</button>
      <div class="tl-body">
        <div class="tl-title"><i class="ti ${esc(t.icon||'ti-checkbox')}"></i> ${esc(t.title)||'Bez názvu'}</div>
        <div class="tl-meta"><span class="tl-time">${toHHMM(it.start)}–${toHHMM(it.end)}</span>${subs.length ? ` · ${subs.filter(s=>s.done).length}/${subs.length}` : ''}${isRecurring(t) ? ' · ↻' : ''}</div>
      </div>
      <span class="tl-grip" title="Přesunout">⋮⋮</span>
      <span class="tl-resize" title="Změnit délku"></span>
    `;
    block.addEventListener('click', ()=>openTaskModal(t,false));
    const check = block.querySelector('.tl-check');
    check.addEventListener('click', (e)=>{ e.stopPropagation(); toggleTaskDone(t, plannerDate); });
    const grip = block.querySelector('.tl-grip');
    grip.addEventListener('click', (e)=>e.stopPropagation());
    grip.addEventListener('pointerdown', (e)=>startBlockDrag(e, block, t, startH, endH, 'move'));
    const rez = block.querySelector('.tl-resize');
    rez.addEventListener('click', (e)=>e.stopPropagation());
    rez.addEventListener('pointerdown', (e)=>startBlockDrag(e, block, t, startH, endH, 'resize'));
    grid.appendChild(block);
  });

  if(isToday){
    const n = nowMinutes();
    if(n>=startH*60 && n<=endH*60){
      const line = document.createElement('div');
      line.className = 'tl-now';
      line.id = 'tl-now';
      line.style.top = ((n-startH*60)*PX_PER_MIN)+'px';
      inner.appendChild(line);
    }
  }
  scroller.id = 'pl-timeline';
  if(plannerScrollPending){
    const firstStart = items.length ? Math.min(...items.map(i=>i.start)) : 8*60;
    const target = isToday ? nowMinutes()-60 : firstStart-30;
    scroller.scrollTop = Math.max(0, (target-startH*60)*PX_PER_MIN);
    plannerScrollPending = false;
  } else {
    scroller.scrollTop = prevScroll || 0;
  }
}
/** Posun úkolu / změna délky tažením (pointer events — funguje myší i dotykem). */
function startBlockDrag(e, block, task, startH, endH, mode){
  e.preventDefault();
  e.stopPropagation();
  const y0 = e.clientY;
  const s0 = toMin(task.start), d0 = task.duration||30;
  let moved = false, ns = s0, nd = d0;
  const onMove = (ev)=>{
    if(Math.abs(ev.clientY-y0)>3) moved = true;
    const dMin = Math.round(((ev.clientY-y0)/PX_PER_MIN)/SNAP)*SNAP;
    if(mode==='move'){
      ns = Math.max(startH*60, Math.min(endH*60-d0, s0+dMin));
      block.style.top = ((ns-startH*60)*PX_PER_MIN)+'px';
      const lab = block.querySelector('.tl-time');
      if(lab) lab.textContent = toHHMM(ns)+'–'+toHHMM(ns+d0);
    } else {
      nd = Math.max(SNAP, Math.min(endH*60-s0, d0+dMin));
      block.style.height = Math.max(nd*PX_PER_MIN, 22)+'px';
    }
  };
  const onUp = ()=>{
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    if(!moved) return;
    if(mode==='move') task.start = toHHMM(ns); else task.duration = nd;
    task.updated = Date.now();
    savePlanner();
    renderToday();
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}
/** Čára „teď“ se posouvá každou minutu, jen když je zobrazený dnešek. */
