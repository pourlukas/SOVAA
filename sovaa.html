  document.getElementById('n-save').addEventListener('click', ()=>{
    active.title = document.getElementById('n-title').value.trim();
    active.content = document.getElementById('n-content').value;
    active.tags = parseTags(document.getElementById('n-tags').value);
    active.updated = Date.now();
    saveKey('sovaa:notes', state.notes);
    showToast('Poznámka uložena');
    renderNotes();
  });
  document.getElementById('n-pin').addEventListener('click', ()=>{
    active.pinned = !active.pinned;
    saveKey('sovaa:notes', state.notes);
    renderNotes();
  });
  document.getElementById('n-del').addEventListener('click', ()=>{
    state.notes = state.notes.filter(n=>n.id!==active.id);
    activeNoteId = state.notes.length ? state.notes[0].id : null;
    saveKey('sovaa:notes', state.notes);
    showToast('Poznámka smazána');
    renderNotes();
  });
}
/** Checklist: zaškrtávání a přidávání/mazání položek se ukládá hned (bez tlačítka Uložit).
 *  Název a štítky mají vlastní tlačítko Uložit stejně jako u textové poznámky. */
function renderChecklistEditor(active){
  const editor = document.getElementById('n-editor');
  const items = active.items || [];
  const done = items.filter(i=>i.done).length;
  editor.innerHTML = `
    <div class="field"><input type="text" id="n-title" value="${escAttr(active.title)}" placeholder="Název checklistu (např. Úkoly na pondělí)" style="font-family:'Fraunces',serif; font-size:19px; font-weight:500; border:none; padding:4px 0; background:transparent;"></div>
    ${items.length ? `<p class="muted checklist-progress">${done} z ${items.length} hotovo</p>` : ''}
    <div class="checklist-items" id="n-cl-items"></div>
    <div class="row" style="margin-top:4px;">
      <input type="text" id="n-cl-add" placeholder="Přidat položku a stisknout Enter..." style="flex:1;">
    </div>
    <div class="field" style="margin-top:16px;"><label>Štítky (oddělené čárkou)</label><input type="text" id="n-tags" value="${escAttr((active.tags||[]).join(', '))}" placeholder="např. práce, nápady"></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn primary" id="n-save"><i class="ti ti-check"></i> Uložit název a štítky</button>
      <button class="btn" id="n-pin"><i class="ti ti-pin"></i> ${active.pinned?'Odepíchnout':'Připíchnout'}</button>
      <button class="btn danger" id="n-del"><i class="ti ti-trash"></i> Smazat</button>
    </div>
  `;
  const itemsWrap = document.getElementById('n-cl-items');
  items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'checklist-item' + (item.done ? ' done' : '');
    row.innerHTML = `
      <input type="checkbox" ${item.done?'checked':''}>
      <span class="ci-text">${esc(item.text)}</span>
      <button class="icon-btn ci-del" title="Smazat položku"><i class="ti ti-x"></i></button>
    `;
    row.querySelector('input[type=checkbox]').addEventListener('change', ()=>{
      item.done = !item.done;
      active.updated = Date.now();
      saveKey('sovaa:notes', state.notes);
      renderNotes();
    });
    row.querySelector('.ci-del').addEventListener('click', ()=>{
      active.items = items.filter(i=>i.id!==item.id);
      active.updated = Date.now();
      saveKey('sovaa:notes', state.notes);
      renderNotes();
    });
    itemsWrap.appendChild(row);
  });
  const addInput = document.getElementById('n-cl-add');
  addInput.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter') return;
    const text = addInput.value.trim();
    if(!text) return;
    if(!active.items) active.items = [];
    active.items.push({ id:'ci'+Date.now()+Math.random().toString(36).slice(2,6), text, done:false });
    active.updated = Date.now();
    saveKey('sovaa:notes', state.notes);
    renderNotes();
    const freshInput = document.getElementById('n-cl-add');
    if(freshInput) freshInput.focus();
  });
  document.getElementById('n-save').addEventListener('click', ()=>{
    active.title = document.getElementById('n-title').value.trim();
    active.tags = parseTags(document.getElementById('n-tags').value);
    active.updated = Date.now();
    saveKey('sovaa:notes', state.notes);
    showToast('Uloženo');
    renderNotes();
  });
  document.getElementById('n-pin').addEventListener('click', ()=>{
    active.pinned = !active.pinned;
    saveKey('sovaa:notes', state.notes);
    renderNotes();
  });
  document.getElementById('n-del').addEventListener('click', ()=>{
    state.notes = state.notes.filter(n=>n.id!==active.id);
    activeNoteId = state.notes.length ? state.notes[0].id : null;
    saveKey('sovaa:notes', state.notes);
    showToast('Checklist smazán');
    renderNotes();
  });
}
function createNote(type){
  const n = { id: 'n'+Date.now(), type: type||'text', title:'', content:'', items:[], tags:[], pinned:false, updated: Date.now() };
  state.notes.push(n);
  activeNoteId = n.id;
  saveKey('sovaa:notes', state.notes);
  renderNotes();
}

/* ---------------- 7. Knihovna ("Co jsem...") ---------------- */
const LIB_TYPES = [
  {key:'book', label:'Knihy', icon:'ti-book'},
  {key:'movie', label:'Filmy a seriály', icon:'ti-device-tv'},
  {key:'place', label:'Místa', icon:'ti-map-pin'},
  {key:'wishlist', label:'Wishlist', icon:'ti-gift'}
];
function renderLibrary(){
  const el = document.getElementById('page-library');
  const itemsOfType = state.library.filter(i=>i.type===libFilter);
  const allTags = collectTags(itemsOfType);
  const items = libTagFilter ? itemsOfType.filter(i=>(i.tags||[]).includes(libTagFilter)) : itemsOfType;
  const active = state.library.find(i=>i.id===activeLibId);
  el.innerHTML = `
    <p class="eyebrow">Co jsem přečetl, viděl, navštívil a co bych chtěl</p>
    <h1 class="section-title">Knihovna</h1>
    <div class="lib-tabs" id="lib-tabs"></div>
    ${allTags.length ? `<div class="tag-filter-row" id="lib-tag-filters"></div>` : ''}
    <button class="btn primary" id="lib-new" style="margin-bottom:16px;"><i class="ti ti-plus"></i> Přidat položku</button>
    <div class="lib-card-list" id="lib-cards"></div>
    <div id="lib-editor" style="margin-top:24px;"></div>
  `;
  const tabsWrap = document.getElementById('lib-tabs');
  LIB_TYPES.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'lib-tab-btn' + (t.key===libFilter?' active':'');
    b.innerHTML = `<i class="ti ${t.icon}"></i> ${t.label}`;
    b.addEventListener('click', ()=>{ libFilter=t.key; activeLibId=null; libTagFilter=null; renderLibrary(); });
    tabsWrap.appendChild(b);
  });
  if(allTags.length){
    const filterWrap = document.getElementById('lib-tag-filters');
    allTags.forEach(tag=>{
      const chip = document.createElement('button');
      chip.className = 'tag-filter-chip' + (libTagFilter===tag ? ' active' : '');
      chip.textContent = tag;
      chip.addEventListener('click', ()=>{ libTagFilter = (libTagFilter===tag) ? null : tag; renderLibrary(); });
      filterWrap.appendChild(chip);
    });
  }
  const cardsWrap = document.getElementById('lib-cards');
  if(!items.length){
    cardsWrap.innerHTML = '';
    document.getElementById('lib-editor').innerHTML = active && active.type===libFilter ? '' :
      `<div class="empty-state"><i class="ti ti-stack-2"></i>${libTagFilter ? 'Nic s tímhle štítkem.' : 'Zatím tu nic není. Přidej první položku.'}</div>`;
  } else {
    [...items].sort((a,b)=>{
      const pa = a.pinned?1:0, pb = b.pinned?1:0;
      if(pa!==pb) return pb-pa;
      return b.updated-a.updated;
    }).forEach(item=>{
      const card = document.createElement('div');
      card.className = 'lib-card';
      const ratingStr = item.rating ? '★'.repeat(item.rating)+'☆'.repeat(5-item.rating) : '';
      let sub = '';
      if(item.type==='place') sub = item.status==='visited' ? 'navštíveno' : 'bucket list';
      if(item.type==='wishlist') sub = item.price ? item.price+' Kč' : '';
      const tags = item.tags||[];
      const tagsHtml = tags.length ? `<div class="tag-chips">${tags.map(t=>`<span class="tag-chip">${esc(t)}</span>`).join('')}</div>` : '';
      const pinHtml = `<button class="pin-btn ${item.pinned?'pinned':''}" title="${item.pinned?'Odepíchnout':'Připíchnout nahoru'}"><i class="ti ti-pin"></i></button>`;
      card.innerHTML = `<div class="row-top"><div class="t">${esc(item.title)||'Bez názvu'}</div>${pinHtml}</div><div class="r">${ratingStr}</div><div class="muted" style="font-size:11px; margin-top:2px;">${sub}</div>${tagsHtml}`;
      card.querySelector('.pin-btn').addEventListener('click', (e)=>{
        e.stopPropagation();
        item.pinned = !item.pinned;
        saveKey('sovaa:library', state.library);
        renderLibrary();
      });
      card.addEventListener('click', ()=>{ activeLibId = item.id; renderLibrary(); });
      cardsWrap.appendChild(card);
    });
  }
  document.getElementById('lib-new').addEventListener('click', ()=>{
    const n = { id:'l'+Date.now(), type:libFilter, title:'', rating:0, review:'', status:'wishlist', price:'', link:'', photo:'', tags:[], pinned:false, updated:Date.now() };
    state.library.push(n);
    activeLibId = n.id;
    saveKey('sovaa:library', state.library);
    renderLibrary();
  });
  if(active && active.type===libFilter) renderLibEditor(active);
}
function starsHtml(rating, editable){
  let html = `<div class="stars" id="lib-stars">`;
  for(let i=1;i<=5;i++){
    html += `<span class="star ${i<=rating?'filled':''}" data-val="${i}">★</span>`;
  }
  html += `</div>`;
  return html;
}
function renderLibEditor(item){
  const wrap = document.getElementById('lib-editor');
  const typeLabel = LIB_TYPES.find(t=>t.key===item.type).label;
  let extraFields = '';
  if(item.type==='place'){
    extraFields = `
      <div class="status-toggle">
        <button type="button" data-status="visited" class="${item.status==='visited'?'active':''}"><i class="ti ti-check"></i> Navštíveno</button>
        <button type="button" data-status="wishlist" class="${item.status==='wishlist'?'active':''}"><i class="ti ti-flag"></i> Bucket list</button>
      </div>
      <div class="field"><label>Fotka (volitelné)</label><input type="file" id="lib-photo" accept="image/*"></div>
      ${item.photo ? `<img src="${item.photo}" class="lib-photo-preview">` : ''}
    `;
  }
  if(item.type==='wishlist'){
    extraFields = `
      <div class="grid2">
        <div class="field"><label>Cena (Kč)</label><input type="number" id="lib-price" value="${escAttr(item.price)}" placeholder="0"></div>
        <div class="field"><label>Odkaz (volitelné)</label><input type="text" id="lib-link" value="${escAttr(item.link)}" placeholder="https://..."></div>
      </div>
    `;
  }
  wrap.innerHTML = `
    <div class="divider"></div>
    <h2 class="sub">Upravit — ${typeLabel}</h2>
    <div class="field"><label>Název</label><input type="text" id="lib-title" value="${escAttr(item.title)}" placeholder="Název knihy, filmu, místa..."></div>
    ${item.type!=='wishlist' ? `<div class="field"><label>Hodnocení</label>${starsHtml(item.rating)}</div>` : ''}
    ${extraFields}
    <div class="field"><label>${item.type==='wishlist'?'Poznámka':'Krátká recenze / poznámka'}</label><textarea id="lib-review" placeholder="Co si o tom myslíš...">${esc(item.review)}</textarea></div>
    <div class="field"><label>Štítky (oddělené čárkou)</label><input type="text" id="lib-tags" value="${escAttr((item.tags||[]).join(', '))}" placeholder="např. sci-fi, doporučeno"></div>
    <div class="row">
      <button class="btn primary" id="lib-save"><i class="ti ti-check"></i> Uložit</button>
      <button class="btn danger" id="lib-del"><i class="ti ti-trash"></i> Smazat</button>
    </div>
  `;
  let currentRating = item.rating || 0;
  let currentStatus = item.status || 'wishlist';
  let currentPhoto = item.photo || '';
  if(item.type!=='wishlist'){
    const starsEl = document.getElementById('lib-stars');
    starsEl.querySelectorAll('.star').forEach(s=>{
      s.addEventListener('click', ()=>{
        const v = parseInt(s.dataset.val);
        currentRating = (currentRating===v) ? 0 : v;
        starsEl.querySelectorAll('.star').forEach(st=>st.classList.toggle('filled', parseInt(st.dataset.val)<=currentRating));
      });
    });
  }
  if(item.type==='place'){
    wrap.querySelectorAll('[data-status]').forEach(b=>{
      b.addEventListener('click', ()=>{
        currentStatus = b.dataset.status;
        wrap.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('active', x.dataset.status===currentStatus));
      });
    });
    const photoInput = document.getElementById('lib-photo');
    photoInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (ev)=>{
        img.onload = ()=>{
          const maxW = 640;
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width*scale;
          canvas.height = img.height*scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          currentPhoto = canvas.toDataURL('image/jpeg', 0.75);
          showToast('Fotka připravena — nezapomeň uložit');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  document.getElementById('lib-save').addEventListener('click', ()=>{
    item.title = document.getElementById('lib-title').value.trim();
    item.review = document.getElementById('lib-review').value;
    item.tags = parseTags(document.getElementById('lib-tags').value);
    item.rating = currentRating;
    item.updated = Date.now();
    if(item.type==='place'){ item.status = currentStatus; item.photo = currentPhoto; }
    if(item.type==='wishlist'){
      item.price = document.getElementById('lib-price').value;
      item.link = document.getElementById('lib-link').value.trim();
    }
    saveKey('sovaa:library', state.library);
    showToast('Uloženo');
    renderLibrary();
  });
  document.getElementById('lib-del').addEventListener('click', ()=>{
    state.library = state.library.filter(i=>i.id!==item.id);
    activeLibId = null;
    saveKey('sovaa:library', state.library);
    showToast('Položka smazána');
    renderLibrary();
  });
}

/* zanedbatelné suroviny (koření, sůl, voda…) — nepočítají se, ale ani se neoznačují jako „nerozpoznané“ */
const FOOD_IGNORED = 'sůl|soli|pepř|pepře|voda|vody|ocet|octa|koření|koření|kmín|majoránka|majoránky|tymián|oregano|bazalka|bazalky|bobkový list|bobkový|nové koření|hřebíček|muškátový oříšek|skořice|skořici|prášek do pečiva|droždí|petrželka|petrželová nať|nať|mletá paprika|paprika mletá|sladká paprika|pálivá paprika|kari|chilli|rozmarýn|kopr|pažitka|libeček|vanilka|jedlá soda|led|zázvor|kurkuma|grilovací koření|kypřicí prášek|kypřicího prášku|kypřícího prášku|jedlé sody|vanilkový extrakt|vanilkového extraktu|mandlový extrakt|mandlového extraktu|badyán|badyánu|hřebíčky|rybí omáčka|rybí omáčky|kardamom|kardamomu|koriandr|koriandru|česnekový prášek|česnekového prášku|cibulový prášek|cibulového prášku|káva|kávy|silná káva|silné kávy|espresso|espressa|erythritol|erythritolu|kofein'.split('|');

const DIET_LABELS = { vegetarian:'Vegetariánské', vegan:'Veganské', lactosefree:'Bez laktózy', glutenfree:'Bez lepku' };
const DIET_KEYS = Object.keys(DIET_LABELS);

/* ---- normalizace a rozpoznání suroviny ---- */
function normFood(s){
  return String(s==null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
}
const FOOD_INDEX = FOODS.map(r=>({
  key:r[0], label:r[1], aliases:r[2].split('|').map(normFood).filter(Boolean),
  kcal:r[3], p:r[4], c:r[5], f:r[6], tags:r[7] ? r[7].split(',') : [], pieceG:r[8]||0, sliceG:r[9]||0, density:r[10]||1
}));
const FOOD_IGNORED_NORM = FOOD_IGNORED.map(normFood).filter(Boolean);
function wordMatches(aliasWord, words){
  return words.some(w=> w===aliasWord || (aliasWord.length>=5 && w.length>=aliasWord.length && w.length<=aliasWord.length+2 && w.startsWith(aliasWord.slice(0,-1))));
}
/** Najde nejlepší shodu názvu suroviny v databázi (vlastní suroviny mají přednost). */
function matchFood(name){
  const norm = normFood(name);
  if(!norm) return null;
  const words = norm.split(' ');
  let best = null, bestScore = 0;
  const consider = (aliases, payload, bonus)=>{
    for(const al of aliases){
      if(!al.split(' ').every(a=>wordMatches(a, words))) continue;
      const score = al.length + (al===norm ? 100 : 0) + bonus;
      if(score>bestScore){ bestScore = score; best = payload; }
    }
  };
  state.customFoods.forEach(cf=>consider([normFood(cf.name)], { kind:'custom', food:cf }, 1000));
  FOOD_INDEX.forEach(fd=>consider(fd.aliases, { kind:'food', food:fd }, 0));
  consider(FOOD_IGNORED_NORM, { kind:'ignore', food:null }, 0);
  return best;
}
/** Ruční volba rozpoznání u suroviny: '' = automaticky, 'ignore', 'f:klíč', 'c:id'. */
function foodFromRef(ref){
  if(!ref) return null;
  if(ref==='ignore') return { kind:'ignore', food:null };
  if(ref.startsWith('f:')){ const fd = FOOD_INDEX.find(x=>x.key===ref.slice(2)); if(fd) return { kind:'food', food:fd }; }
  if(ref.startsWith('c:')){ const cf = state.customFoods.find(x=>x.id===ref.slice(2)); if(cf) return { kind:'custom', food:cf }; }
  return null;
}

/* ---- převod množství na gramy ---- */
const UNIT_GRAMS = { g:1, gram:1, gramu:1, kg:1000, dkg:10 };
const UNIT_ML = { ml:1, l:1000, dl:100, cl:5, pl:15, lzice:15, lzic:15, lzici:15, lzicka:5, lzicky:5, lzicek:5, lzicku:5, hrnek:250, hrnky:250, hrnku:250, salek:250, sklenice:250 };
const UNIT_PIECE = ['', 'ks', 'kus', 'kusy', 'kusu', 'kusech'];
const UNIT_SLICE = ['platek', 'platky', 'platku'];
const UNIT_CLOVE = ['strouzek', 'strouzky', 'strouzku'];
const UNIT_PINCH = ['spetka', 'spetky', 'spetek'];
function ingredientGrams(ing, food){
  const amount = Number(ing.amount);
  if(ing.amount==='' || ing.amount==null || isNaN(amount)) return { err:'noamount' };
  const u = normFood(ing.unit).split(' ').pop() || '';
  if(u in UNIT_GRAMS) return { g: amount*UNIT_GRAMS[u] };
  if(u in UNIT_ML) return { g: amount*UNIT_ML[u]*(food.density||1) };
  if(UNIT_PINCH.includes(u)) return { g: amount*0.5 };
  if(UNIT_CLOVE.includes(u)) return { g: amount*5 };
  if(UNIT_SLICE.includes(u)) return food.sliceG ? { g: amount*food.sliceG } : { err:'nopiece' };
  if(UNIT_PIECE.includes(u)) return food.pieceG ? { g: amount*food.pieceG } : { err:'nopiece' };
  return { err:'unit' };
}

/* ---- výpočet výživových hodnot receptu ---- */
function computeRecipeNutrition(r){
  const rows = (r.ingredients||[]).map(ing=>{
    const m = foodFromRef(ing.ref) || matchFood(ing.name);
    const row = { ing, match:m, g:null, kcal:0, p:0, c:0, f:0, status:'nomatch' };
    if(!m) return row;
    if(m.kind==='ignore'){ row.status = 'ignored'; row.g = 0; return row; }
    const res = ingredientGrams(ing, m.food);
    if(res.err){ row.status = res.err; return row; }
    const k = res.g/100;
    row.status = 'ok';
    row.g = res.g;
    row.kcal = (m.food.kcal||0)*k; row.p = (m.food.p||0)*k; row.c = (m.food.c||0)*k; row.f = (m.food.f||0)*k;
    return row;
  });
  const total = rows.reduce((a,x)=>({ kcal:a.kcal+x.kcal, p:a.p+x.p, c:a.c+x.c, f:a.f+x.f }), { kcal:0, p:0, c:0, f:0 });
  const sv = Math.max(1, r.servings||1);
  return {
    rows, total,
    perPortion:{ kcal:total.kcal/sv, p:total.p/sv, c:total.c/sv, f:total.f/sv },
    count: rows.length,
    used: rows.filter(x=>x.status==='ok' || x.status==='ignored').length,
    real: rows.filter(x=>x.status==='ok').length
  };
}
/** Hodnoty na 1 porci: ručně zadané, nebo spočítané ze surovin. null = nic k zobrazení. */
function effectiveNutrition(r){
  if(r.nutriMode==='manual'){
    const m = r.nutriManual || {};
    if(['kcal','p','c','f'].some(k=>Number(m[k])>0)){
      return { source:'manual', perPortion:{ kcal:Number(m.kcal)||0, p:Number(m.p)||0, c:Number(m.c)||0, f:Number(m.f)||0 }, calc:null };
    }
  }
  const calc = computeRecipeNutrition(r);
  if(!calc.real) return null;
  return { source:'auto', perPortion:calc.perPortion, calc };
}

/* ---- stravovací omezení ---- */
function detectDiet(r){
  const calc = computeRecipeNutrition(r);
  const reliable = calc.count>0 && calc.used===calc.count;        // všechny suroviny jsou rozpoznané
  const tags = new Set();
  calc.rows.forEach(x=>{ if(x.match && x.match.food) (x.match.food.tags||[]).forEach(t=>tags.add(t)); });
  const flags = [];
  const noAnimal = !tags.has('maso') && !tags.has('ryba');
  if(noAnimal) flags.push('vegetarian');
  if(noAnimal && !tags.has('vejce') && !tags.has('mléko') && !tags.has('med')) flags.push('vegan');
  if(!tags.has('mléko')) flags.push('lactosefree');
  if(!tags.has('lepek')) flags.push('glutenfree');
  return { flags, reliable, calc };
}
/** Ručně nastavené štítky (r.diet je pole), jinak automaticky — ale jen když jsou rozpoznané všechny suroviny. */
function effectiveDiet(r){
  if(Array.isArray(r.diet)) return r.diet;
  const d = detectDiet(r);
  return d.reliable ? d.flags : [];
}
function dietOk(r, wanted){
  if(!wanted || !wanted.length) return true;
  const have = effectiveDiet(r);
  return wanted.every(w=>{
    if(w==='vegetarian') return have.includes('vegetarian') || have.includes('vegan');
    if(w==='lactosefree') return have.includes('lactosefree') || have.includes('vegan');
    return have.includes(w);
  });
}
function dietBadgesHtml(r){
  const have = effectiveDiet(r);
  const show = DIET_KEYS.filter(k=>have.includes(k) && !(k==='vegetarian' && have.includes('vegan')));
  return show.length ? `<div class="diet-badges">${show.map(k=>`<span class="diet-badge">${DIET_LABELS[k]}</span>`).join('')}</div>` : '';
}

      </div>
      <div class="field"><label>Váha 1 kusu v gramech <span class="muted">(volitelné — kvůli recepturám typu „2 ks“)</span></label><input type="number" step="any" min="0" id="fm-piece" value="${escAttr(f.pieceG)}"></div>

  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) closeFoodModal(); });
  $f('fm-save').addEventListener('click', ()=>{
    const name = $f('fm-name').value.trim();

    const vals = { kcal:parseNum($f('fm-kcal').value), p:parseNum($f('fm-p').value), c:parseNum($f('fm-c').value), f:parseNum($f('fm-f').value) };
    if(!['kcal','p','c','f'].some(k=>vals[k]>0)){ showToast('Zadej aspoň jednu nutriční hodnotu'); return; }
    const out = Object.assign({}, f, { name, kcal:vals.kcal||0, p:vals.p||0, c:vals.c||0, f:vals.f||0, pieceG:parseNum($f('fm-piece').value)||0 });
    if(food){ Object.assign(food, out); }
    else { out.id = 'cf'+Date.now()+Math.random().toString(36).slice(2,5); state.customFoods.push(out); }
    saveFoods();
    closeFoodModal();

    if(onSaved) onSaved(saved); else renderCookbook();
  });
  const del = $f('fm-del');
  if(del) del.addEventListener('click', ()=>{
    if(!confirm('Smazat surovinu „'+food.name+'“?')) return;
    state.customFoods = state.customFoods.filter(x=>x.id!==food.id);
    saveFoods();
    closeFoodModal();
    renderCookbook();
  });
  $f('fm-name').focus();
}

/* ---------------- 7b. Kuchařka (recepty, týdenní plán, nákupní seznam) ----------------
   Recepty se ukládají lokálně. Cena u suroviny je volitelný odhad pro množství v receptu;
   při přepočtu porcí se množství i cena násobí stejným koeficientem. */
const WEEKDAYS = ['Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota','Neděle'];
const RECIPE_SORTS = [
  {key:'updated', label:'Nejnovější'},
  {key:'title',   label:'Název A–Z'},
  {key:'rating',  label:'Nejlépe hodnocené'},
  {key:'time',    label:'Nejrychlejší'},
  {key:'cost',    label:'Nejlevnější na porci'},
  {key:'kcal',    label:'Nejméně kalorií na porci'}
];
let cookView = 'recipes';          // 'recipes' | 'plan' | 'shopping'
let activeRecipeId = null;
let recipeEditMode = false;
let recipeDraft = null;            // rozpracovaný nový recept (do uložení není ve state.recipes)
let recipeServings = null;         // aktuálně zvolený počet porcí v detailu
let recipeFilter = { q:'', fav:false, tag:null, sort:'updated', diets:[], ignoreProfileDiet:false };

/* ---- pomocné funkce ---- */
function parseNum(v){
  const n = parseFloat(String(v==null?'':v).replace(',','.'));
  return isNaN(n) ? '' : n;
}
function fmtQty(n){
  if(n===''||n===null||n===undefined||isNaN(n)) return '';
  return (Math.round(n*100)/100).toString().replace('.',',');
}
function fmtMoney(n){ return Math.round(n).toLocaleString('cs-CZ')+' Kč'; }
function portionsLabel(n){ return n===1 ? 'porce' : (n<5 ? 'porce' : 'porcí'); }
function recipeCost(r, factor){
  return (r.ingredients||[]).reduce((sum,i)=>sum+(Number(i.price)||0),0)*(factor||1);
}
function costPerPortion(r){ return recipeCost(r,1)/Math.max(1, r.servings||1); }
function newRecipe(){
  return { id:'r'+Date.now()+Math.random().toString(36).slice(2,5), title:'', servings:4, time:'', ingredients:[], steps:'', tags:[], rating:0, favorite:false, notes:'',
    photo:'', nutriMode:'auto', nutriManual:{ kcal:'', p:'', c:'', f:'' }, diet:null, updated:Date.now() };
}
function safePhoto(r){
  const p = r && r.photo;
  return (typeof p==='string' && /^data:image\/(jpeg|png|webp|gif);base64,/.test(p) && !/["'<>\s]/.test(p)) ? p : '';
}
/** Zmenší nahranou fotku (nejdelší strana max. maxSide px, JPEG) — šetří místo v úložišti prohlížeče. */
function resizeImageFile(file, maxSide, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (ev)=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const scale = Math.min(1, maxSide/Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width*scale));
        canvas.height = Math.max(1, Math.round(img.height*scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
let nutriOpen = false;            // rozpis výpočtu výživových hodnot v detailu receptu
function saveRecipes(){ saveKey('sovaa:recipes', state.recipes); }
function saveShopping(){ saveKey('sovaa:shopping', state.shopping); }
function saveMealPlan(){ saveKey('sovaa:mealplan', state.mealPlan); }
function currentRecipe(){ return recipeDraft || state.recipes.find(r=>r.id===activeRecipeId) || null; }
function slugify(s){
  return (s||'recept').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'recept';
}
function downloadJson(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function openRecipe(id){
  const r = state.recipes.find(x=>x.id===id);
  if(!r) return;
  cookView = 'recipes';
  recipeDraft = null;
  recipeEditMode = false;

/* ---- hlavní obrazovka + přepínání podstránek ---- */

/* ---- Recepty: seznam, filtry, import ---- */
function renderRecipesView(body){
  const f = recipeFilter;
  const allTags = collectTags(state.recipes);
  const profileDiets = state.settings.diets || [];
  const hiddenByProfile = (profileDiets.length && !f.ignoreProfileDiet) ? state.recipes.filter(r=>!dietOk(r, profileDiets)).length : 0;
  body.innerHTML = `
    <div class="cook-toolbar">

    </div>
    ${profileDiets.length ? `<div class="diet-banner">
      <i class="ti ti-leaf"></i>
      <span>Filtr mé stravy (${profileDiets.map(d=>DIET_LABELS[d].toLowerCase()).join(', ')}) ${f.ignoreProfileDiet ? 'je dočasně vypnutý.' : (hiddenByProfile ? `skrývá ${hiddenByProfile} ${hiddenByProfile===1?'recept':(hiddenByProfile<5?'recepty':'receptů')}.` : 'je zapnutý.')}</span>
      <button class="btn-mini" id="rc-profile-toggle">${f.ignoreProfileDiet ? 'Zapnout filtr' : 'Zobrazit všechny'}</button>
    </div>` : ''}

      <button class="btn" id="rc-import"><i class="ti ti-upload"></i> Importovat recept</button>

    </div>
    <div class="lib-card-list" id="rc-cards"></div>
    <div id="rc-detail"></div>
  `;
  const filters = document.getElementById('rc-filters');
  const addChip = (label, active, onClick)=>{
    const c = document.createElement('button');
    c.className = 'tag-filter-chip' + (active ? ' active' : '');
    c.textContent = label;
    c.addEventListener('click', onClick);
    filters.appendChild(c);
  };
  addChip('♥ Oblíbené', f.fav, ()=>{ f.fav = !f.fav; renderCookbook(); });
  DIET_KEYS.forEach(k=>addChip(DIET_LABELS[k], f.diets.includes(k), ()=>{
    f.diets = f.diets.includes(k) ? f.diets.filter(x=>x!==k) : [...f.diets, k];
    renderCookbook();
  }));
  allTags.forEach(tag=>addChip(tag, f.tag===tag, ()=>{ f.tag = (f.tag===tag) ? null : tag; renderCookbook(); }));

  const toggle = document.getElementById('rc-profile-toggle');
  if(toggle) toggle.addEventListener('click', ()=>{ f.ignoreProfileDiet = !f.ignoreProfileDiet; renderCookbook(); });
  document.getElementById('rc-q').addEventListener('input', (e)=>{ f.q = e.target.value; buildRecipeCards(); });
  document.getElementById('rc-sort').addEventListener('change', (e)=>{ f.sort = e.target.value; buildRecipeCards(); });
  document.getElementById('rc-new').addEventListener('click', ()=>{
    recipeDraft = newRecipe();
    activeRecipeId = null;
    recipeEditMode = true;
    renderCookbook();
    document.getElementById('rc-detail').scrollIntoView({behavior:'smooth', block:'start'});
  });
  const fileInput = document.getElementById('rc-import-file');
  document.getElementById('rc-import').addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(file) await importRecipeFile(file);

  });
  buildRecipeCards();
  renderRecipeDetailArea();
}
function buildRecipeCards(){
  const wrap = document.getElementById('rc-cards');
  if(!wrap) return;
  const f = recipeFilter;
  const q = f.q.trim().toLowerCase();
  const profileDiets = f.ignoreProfileDiet ? [] : (state.settings.diets || []);
  const wanted = [...new Set([...f.diets, ...profileDiets])];
  const kcalOf = r=>{ const n = effectiveNutrition(r); return n ? n.perPortion.kcal : 0; };
  const list = state.recipes.filter(r=>{
    if(f.fav && !r.favorite) return false;
    if(f.tag && !(r.tags||[]).includes(f.tag)) return false;
    if(!dietOk(r, wanted)) return false;
    if(!q) return true;
    const hay = [r.title, ...(r.tags||[]), ...(r.ingredients||[]).map(i=>i.name)].join(' ').toLowerCase();
    return hay.includes(q);
  });
  const costKey = r=>{ const c = costPerPortion(r); return c>0 ? c : 1e9; };
  const kcalKey = r=>{ const k = kcalOf(r); return k>0 ? k : 1e9; };
  const sorters = {
    updated:(a,b)=>b.updated-a.updated,
    title:(a,b)=>(a.title||'').localeCompare(b.title||'','cs'),
    rating:(a,b)=>(b.rating||0)-(a.rating||0) || b.updated-a.updated,
    time:(a,b)=>(Number(a.time)||1e9)-(Number(b.time)||1e9),
    cost:(a,b)=>costKey(a)-costKey(b),
    kcal:(a,b)=>kcalKey(a)-kcalKey(b)
  };
  list.sort(sorters[f.sort] || sorters.updated);
  if(!list.length){
    wrap.innerHTML = `<p class="muted">${state.recipes.length ? 'Nic nenalezeno — zkus upravit hledání nebo filtry.' : 'Zatím tu nejsou žádné recepty. Přidej první, nebo importuj hotový soubor.'}</p>`;
    return;
  }
  wrap.innerHTML = '';
  list.forEach(r=>{
    const card = document.createElement('div');
    card.className = 'lib-card recipe-card' + (r.id===activeRecipeId && !recipeDraft ? ' active' : '');
    const rating = r.rating ? '★'.repeat(r.rating)+'☆'.repeat(5-r.rating) : '';
    const meta = [r.time ? r.time+' min' : '', r.servings+' '+portionsLabel(r.servings)].filter(Boolean).join(' · ');
    const cpp = costPerPortion(r);
    const kc = kcalOf(r);
    const photo = safePhoto(r);
    card.innerHTML = `
      ${photo ? `<img class="recipe-thumb" src="${photo}" alt="">` : ''}
      <div class="row-top"><div class="t">${esc(r.title)||'Bez názvu'}</div>
        <button class="fav-btn ${r.favorite?'on':''}" title="Oblíbené">${r.favorite?'♥':'♡'}</button></div>
      <div class="r">${rating}</div>
      <div class="card-meta">${esc(meta)}${kc>0 ? ' · '+Math.round(kc)+' kcal / porce' : ''}${cpp>0 ? ' · ≈ '+fmtMoney(cpp)+' / porce' : ''}</div>
      ${dietBadgesHtml(r)}
      ${(r.tags||[]).length ? `<div class="tag-chips">${r.tags.map(t=>`<span class="tag-chip">${esc(t)}</span>`).join('')}</div>` : ''}
    `;
    card.querySelector('.fav-btn').addEventListener('click', (e)=>{
      e.stopPropagation();
      r.favorite = !r.favorite;
      saveRecipes();
      renderCookbook();
    });
    card.addEventListener('click', ()=>{
      openRecipe(r.id);
      document.getElementById('rc-detail').scrollIntoView({behavior:'smooth', block:'start'});
    });
    wrap.appendChild(card);
  });
}
function renderRecipeDetailArea(){
  const wrap = document.getElementById('rc-detail');
  if(!wrap) return;
  const r = currentRecipe();
  if(!r){ wrap.innerHTML = ''; return; }
  if(recipeDraft || recipeEditMode) renderRecipeEditor(wrap, r);
  else renderRecipeDetail(wrap, r);

/* ---- Detail receptu (čtení, přepočet porcí, akce) ---- */
const NUTRI_STATUS = { nomatch:'nerozpoznáno', noamount:'chybí množství', nopiece:'chybí váha kusu', unit:'neznámá jednotka', ignored:'zanedbatelné' };
function foodOptionsHtml(){
  const builtIn = FOOD_INDEX.map(fd=>`<option value="f:${fd.key}">${esc(fd.label)}</option>`).join('');
  const custom = state.customFoods.map(c=>`<option value="c:${escAttr(c.id)}">${esc(c.name)}</option>`).join('');
  return `<option value="">Automaticky</option><option value="ignore">Nezapočítávat</option>${custom ? `<optgroup label="Moje suroviny">${custom}</optgroup>` : ''}<optgroup label="Databáze">${builtIn}</optgroup><option value="__new__">+ Přidat vlastní surovinu…</option>`;
}
function nutritionCardHtml(r, nut){
  const hasIngs = (r.ingredients||[]).length>0;
  if(!nut){
    return `<div class="nutri-card">
      <div class="nutri-head">Nutriční hodnoty</div>
      <p class="muted" style="margin:6px 0;">${hasIngs
        ? 'Zatím je nejde spočítat. Doplň u surovin množství s jednotkou (g, ml, ks, lžíce…), oprav rozpoznání v rozpisu, přidej vlastní surovinu, nebo hodnoty zadej ručně při úpravě receptu.'
        : 'Přidej suroviny — nutriční hodnoty se spočítají automaticky.'}</p>
      ${hasIngs ? '<button class="btn-mini" id="nt-toggle">'+(nutriOpen?'Skrýt rozpis':'Rozpis surovin')+'</button>' : ''}
      ${nutriOpen && hasIngs ? '<div id="nt-breakdown"></div>' : ''}
    </div>`;
  }
  const n = nut.perPortion;
  const energy = n.p*4 + n.c*4 + n.f*9;
  const pct = (v)=>energy>0 ? Math.round(v/energy*100) : 0;
  const pp = pct(n.p*4), pc = pct(n.c*4), pf = Math.max(0, 100-pp-pc);
  const calc = nut.calc;
  const total = calc ? calc.total.kcal : n.kcal*(r.servings||1);
  return `<div class="nutri-card">
    <div class="nutri-head">Nutriční hodnoty na 1 porci <span class="muted">· ${nut.source==='manual' ? 'zadáno ručně' : 'orientační výpočet ze surovin'}</span></div>
    <div class="nutri-grid">
      <div class="nutri-cell big"><b>${Math.round(n.kcal)}</b><span>kcal</span></div>
      <div class="nutri-cell"><b>${fmtDist(n.p)} g</b><span>bílkoviny</span></div>
      <div class="nutri-cell"><b>${fmtDist(n.c)} g</b><span>sacharidy</span></div>
      <div class="nutri-cell"><b>${fmtDist(n.f)} g</b><span>tuky</span></div>
    </div>
    ${energy>0 ? `<div class="macro-bar" title="Podíl energie z bílkovin, sacharidů a tuků">
      <span class="seg-p" style="width:${pp}%"></span><span class="seg-c" style="width:${pc}%"></span><span class="seg-f" style="width:${pf}%"></span></div>
      <div class="macro-legend"><span><i class="dot-p"></i>bílkoviny ${pp} %</span><span><i class="dot-c"></i>sacharidy ${pc} %</span><span><i class="dot-f"></i>tuky ${pf} %</span></div>` : ''}
    <p class="muted" style="margin:8px 0 0;">Celý recept: ${fmtKcal(total)} (${r.servings} ${portionsLabel(r.servings)})${calc && calc.used<calc.count
      ? ` · <span class="nutri-warn">spočítáno z ${calc.used} z ${calc.count} surovin — zbytek nebyl rozpoznán, takže hodnoty jsou nižší</span>` : ''}</p>
    ${calc ? `<button class="btn-mini" id="nt-toggle" style="margin-top:8px;">${nutriOpen ? 'Skrýt rozpis' : 'Jak se to spočítalo'}</button>` : ''}
    ${calc && nutriOpen ? '<div id="nt-breakdown"></div>' : ''}
  </div>`;
}
function wireNutritionCard(wrap, r, nut){
  const toggle = wrap.querySelector('#nt-toggle');
  if(toggle) toggle.addEventListener('click', ()=>{ nutriOpen = !nutriOpen; renderRecipeDetailArea(); });
  const host = wrap.querySelector('#nt-breakdown');
  if(!host) return;
  const calc = (nut && nut.calc) || computeRecipeNutrition(r);
  const optionsHtml = foodOptionsHtml();
  host.innerHTML = `<div class="table-wrap"><table class="month-table nutri-table">
    <thead><tr><th>Surovina</th><th>Množství</th><th>Rozpoznáno jako</th><th>kcal</th></tr></thead>
    <tbody>${calc.rows.map((row,i)=>{
      const ing = row.ing;

/* ---- Import receptu ze souboru .json (stejný formát jako export) ---- */
function sanitizeRecipe(d){
  if(!d || typeof d!=='object' || !d.title) return null;
  const r = newRecipe();
  r.title = String(d.title).slice(0,200);
  r.servings = Math.min(99, Math.max(1, parseInt(d.servings)||1));
  r.time = parseInt(d.time) || '';
  r.ingredients = (Array.isArray(d.ingredients) ? d.ingredients : []).map(i=>({
    name: String((i&&i.name)||'').slice(0,200),
    amount: parseNum(i&&i.amount),
    unit: String((i&&i.unit)||'').slice(0,30),
    price: parseNum(i&&i.price),
    ref: (i && typeof i.ref==='string' && (i.ref==='ignore' || /^f:[a-z0-9-]+$/.test(i.ref))) ? i.ref : undefined
  })).filter(i=>i.name);
  r.steps = typeof d.steps==='string' ? d.steps : (Array.isArray(d.steps) ? d.steps.map(String).join('\n') : '');
  r.tags = Array.isArray(d.tags) ? d.tags.map(String).slice(0,20) : [];
  r.notes = typeof d.notes==='string' ? d.notes : '';
  r.photo = (typeof d.photo==='string' && d.photo.length<=700000 && safePhoto({photo:d.photo})) ? d.photo : '';
  r.nutriMode = d.nutriMode==='manual' ? 'manual' : 'auto';
  const nm = d.nutriManual || {};
  r.nutriManual = { kcal:parseNum(nm.kcal), p:parseNum(nm.p), c:parseNum(nm.c), f:parseNum(nm.f) };
  r.diet = Array.isArray(d.diet) ? d.diet.filter(x=>DIET_KEYS.includes(x)) : null;
  return r;
}

/* ---------- Import balíčku (recepty + poznámky) — jen PŘIDÁVÁ, nic nepřepisuje ---------- */
function sanitizeNote(d){
  if(!d || typeof d!=='object' || !d.title) return null;
  const type = d.type==='checklist' ? 'checklist' : 'text';
  const n = { id:'n'+Date.now()+Math.random().toString(36).slice(2,7), type, title:String(d.title).slice(0,200), content:'', items:[], tags:[], pinned:false, updated:Date.now() };
  n.content = typeof d.content==='string' ? d.content.slice(0,100000) : '';
  n.tags = Array.isArray(d.tags) ? d.tags.map(x=>String(x).slice(0,40)).slice(0,20) : [];
  if(type==='checklist'){
    n.items = (Array.isArray(d.items) ? d.items : []).map((it,i)=>{
      const text = typeof it==='string' ? it : (it && it.text);
      return text ? { id:'i'+Date.now()+'-'+i+Math.random().toString(36).slice(2,5), text:String(text).slice(0,300), done:false } : null;
    }).filter(Boolean).slice(0,500);
  }
  return n;
}
/** Přidá recepty a poznámky z balíčku. Položky se stejným názvem, které už máš, přeskočí. */
function importPack(data){
  const normTitle = t=>normFood(String(t||'')).replace(/\s+/g,' ').trim();
  const haveRecipes = new Set(state.recipes.map(r=>normTitle(r.title)));
  const haveNotes = new Set(state.notes.map(n=>normTitle(n.title)));
  const res = { recipes:0, recipesSkipped:0, notes:0, notesSkipped:0 };
  (Array.isArray(data.recipes) ? data.recipes : []).forEach(raw=>{
    const r = sanitizeRecipe(raw);
    if(!r) return;
    const k = normTitle(r.title);
    if(haveRecipes.has(k)){ res.recipesSkipped++; return; }
    haveRecipes.add(k); state.recipes.push(r); res.recipes++;
  });
  (Array.isArray(data.notes) ? data.notes : []).forEach(raw=>{
    const n = sanitizeNote(raw);
    if(!n) return;
    const k = normTitle(n.title);
    if(haveNotes.has(k)){ res.notesSkipped++; return; }
    haveNotes.add(k); state.notes.push(n); res.notes++;
  });
  if(res.recipes) saveRecipes();
  if(res.notes) saveKey('sovaa:notes', state.notes);
  return res;
}
function packSummary(res){
  const parts = [];
  if(res.recipes || res.recipesSkipped) parts.push(`recepty: ${res.recipes} přidáno${res.recipesSkipped ? `, ${res.recipesSkipped} už tam bylo` : ''}`);
  if(res.notes || res.notesSkipped) parts.push(`poznámky: ${res.notes} přidáno${res.notesSkipped ? `, ${res.notesSkipped} už tam bylo` : ''}`);
  return parts.length ? 'Import hotov — ' + parts.join(' · ') : 'Balíček neobsahuje nic k importu';
}

/* ---------- Výchozí obsah: recepty a poznámky z balíčku se přidají při PRVNÍM spuštění ---------- */
function readSeed(){
  try{ const el = document.getElementById('sovaa-seed'); return el ? JSON.parse(el.textContent) : null; }catch(e){ return null; }
}
/** Jen jednou na prohlížeč: přidá vestavěný balíček (nic nepřepíše, duplicity přeskočí). Smazané recepty se nevrací. */
function seedFirstRun(){
  try{ if(localStorage.getItem('sovaa:seed-v1')) return null; }catch(e){ return null; }
  const seed = readSeed();
  if(!seed) return null;
  const res = importPack(seed);
  try{ localStorage.setItem('sovaa:seed-v1', String(Date.now())); }catch(e){}
  return res;
}
async function importPackFile(file){
  try{
    const data = JSON.parse(await file.text());
    if(!data || typeof data!=='object' || !data.sovaaPack){ showToast('Tohle není balíček SOVAA'); return false; }
    const res = importPack(data);
    showToast(packSummary(res));
    renderCookbook();
    if(document.getElementById('n-editor')) renderNotes();
    return res;
  }catch(err){
    showToast('Soubor se nepodařilo přečíst');
    return false;
  }
}
async function importRecipeFile(file){
  try{
    const data = JSON.parse(await file.text());
    if(data && data.sovaaPack){ const res = importPack(data); showToast(packSummary(res)); renderCookbook(); return; }
    const list = (Array.isArray(data) ? data : [data]).map(sanitizeRecipe).filter(Boolean);
    if(!list.length){ showToast('Soubor neobsahuje žádný recept'); return; }
    list.forEach(r=>state.recipes.push(r));
    saveRecipes();
    showToast('Importováno receptů: '+list.length);
    renderCookbook();
  }catch(err){
    showToast('Soubor se nepodařilo přečíst');
  }
}

  const today = (new Date().getDay()+6)%7;
  body.innerHTML = `

      <button class="btn danger" id="plan-clear"><i class="ti ti-trash"></i> Vyčistit plán</button>

      ${dayKcal>0 ? `<div class="muted plan-kcal">≈ ${esc(fmtKcal(dayKcal))} (1 porce od každého jídla)</div>` : ''}

      <select class="plan-add" ${state.recipes.length ? '' : 'disabled'}>
        <option value="">${state.recipes.length ? '+ Přidat recept...' : 'Nejdřív přidej recept'}</option>
        ${state.recipes.map(r=>`<option value="${escAttr(r.id)}">${esc(r.title)||'Bez názvu'}</option>`).join('')}
      </select>
    `;
    const itemsWrap = card.querySelector('.plan-items');
    ids.forEach((id, idx)=>{
      const row = document.createElement('div');
      row.className = 'plan-item';
      row.innerHTML = `<span class="plan-link">${esc(byId[id].title)||'Bez názvu'}</span><button class="icon-btn" title="Odebrat z plánu"><i class="ti ti-x"></i></button>`;
      row.querySelector('.plan-link').addEventListener('click', ()=>openRecipe(id));

        saveMealPlan();
        renderCookbook();
      });
      itemsWrap.appendChild(row);
    });

    let added = 0;

      (state.mealPlan[d]||[]).forEach(id=>{ if(byId[id]) added += addRecipeToShopping(byId[id], 1); });

/* ---- Nákupní seznam ---- */
/** Přidá položku; stejnou surovinu (název + jednotka) sečte, pokud ještě není odškrtnutá. */
function addToShopping(entry){
  const key = s=>String(s||'').trim().toLowerCase();
  const hit = state.shopping.find(i=>!i.done && key(i.name)===key(entry.name) && key(i.unit)===key(entry.unit));
  if(hit){
    if(entry.amount!=='' && hit.amount!==''){
      hit.amount = Math.round((hit.amount+entry.amount)*100)/100;
      if(entry.price!=='') hit.price = Math.round(((Number(hit.price)||0)+entry.price)*100)/100;
      return true;
    }
    if(entry.amount==='' && hit.amount==='') return false;   // už tam je
  }
  state.shopping.push(Object.assign({ id:'s'+Date.now()+Math.random().toString(36).slice(2,6), done:false }, entry));
  return true;
}
function addRecipeToShopping(r, factor){
  let n = 0;
  (r.ingredients||[]).forEach(i=>{
    const amount = (i.amount!=='' && i.amount!=null) ? Math.round(i.amount*factor*100)/100 : '';
    const price = Number(i.price) ? Math.round(i.price*factor*100)/100 : '';
    if(addToShopping({ name:i.name, amount, unit:i.unit||'', price })) n++;
  });
  saveShopping();
  return n;
}
function renderShopping(body){
  const items = state.shopping;
  const open = items.filter(i=>!i.done);
  const total = open.reduce((s,i)=>s+(Number(i.price)||0), 0);
  body.innerHTML = `
    <div class="row" style="margin-bottom:12px;">
      <input type="text" id="sh-name" placeholder="Položka (např. mléko)" style="flex:3; min-width:150px;">
      <input type="number" step="any" min="0" id="sh-amt" placeholder="Množ." style="flex:1; min-width:70px;">
      <input type="text" id="sh-unit" placeholder="Jedn." style="flex:1; min-width:70px;">
      <button class="btn primary" id="sh-add" aria-label="Přidat"><i class="ti ti-plus"></i></button>
    </div>
    ${items.length ? `<p class="muted checklist-progress">${open.length} k nakoupení${total>0 ? ' · odhad ceny ≈ '+fmtMoney(total) : ''}</p>` : '<p class="muted">Nákupní seznam je prázdný. Suroviny sem přidáš z receptu nebo z týdenního plánu.</p>'}
    <div class="checklist-items" id="sh-items"></div>
    ${items.length ? `<div class="row" style="margin-top:8px;">
      <button class="btn" id="sh-clear-done"><i class="ti ti-checks"></i> Smazat odškrtnuté</button>
      <button class="btn danger" id="sh-clear-all"><i class="ti ti-trash"></i> Vyprázdnit seznam</button>
    </div>` : ''}
  `;
  const wrap = document.getElementById('sh-items');
  [...items].sort((a,b)=>(a.done?1:0)-(b.done?1:0)).forEach(item=>{
    const row = document.createElement('div');
    row.className = 'checklist-item' + (item.done ? ' done' : '');
    const qty = item.amount!=='' && item.amount!=null ? fmtQty(item.amount)+' '+(item.unit||'')+' ' : '';
    row.innerHTML = `
      <input type="checkbox" ${item.done?'checked':''}>
      <span class="ci-text">${esc((qty+item.name).trim())}</span>
      ${Number(item.price) ? `<span class="ci-price">${fmtMoney(item.price)}</span>` : ''}
      <button class="icon-btn ci-del" title="Smazat položku"><i class="ti ti-x"></i></button>
    `;
    row.querySelector('input').addEventListener('change', ()=>{ item.done = !item.done; saveShopping(); renderCookbook(); });
    row.querySelector('.ci-del').addEventListener('click', ()=>{
      state.shopping = state.shopping.filter(x=>x.id!==item.id);
      saveShopping(); renderCookbook();
    });
    wrap.appendChild(row);
  });
  const add = ()=>{
    const name = document.getElementById('sh-name').value.trim();
    if(!name) return;
    addToShopping({ name, amount: parseNum(document.getElementById('sh-amt').value), unit: document.getElementById('sh-unit').value.trim(), price:'' });
    saveShopping();
    renderCookbook();
    const again = document.getElementById('sh-name');
    if(again) again.focus();
  };
  document.getElementById('sh-add').addEventListener('click', add);
  ['sh-name','sh-amt','sh-unit'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', (e)=>{ if(e.key==='Enter') add(); });
  });
  const clearDone = document.getElementById('sh-clear-done');
  if(clearDone) clearDone.addEventListener('click', ()=>{ state.shopping = state.shopping.filter(i=>!i.done); saveShopping(); renderCookbook(); });
  const clearAll = document.getElementById('sh-clear-all');
  if(clearAll) clearAll.addEventListener('click', ()=>{
    if(!confirm('Opravdu vyprázdnit celý nákupní seznam?')) return;
    state.shopping = []; saveShopping(); renderCookbook();
  });
}

const TIERS = { bronze:'Bronz', silver:'Stříbro', gold:'Zlato', trophy:'Pohár' };
const MEDAL_COLORS = { bronze:['#E0A46A','#A8622B'], silver:['#E3E8EC','#8F99A3'], gold:['#F6D96E','#C28F14'], trophy:['#C7A9DE','#6B4C7A'] };
/* singles = [vzdálenost v jedné aktivitě, název medaile], totals = celková vzdálenost */
const HOBBY_PRESETS = {
  run:  { name:'Běh', unit:'km', one:'v jednom běhu',
          singles:[[5,'První pětka'],[10,'Desítka'],[21.0975,'Půlmaraton'],[42.195,'Maraton']],
          totals:[50,100,250,500,1000] },
  bike: { name:'Kolo', unit:'km', one:'na jedné jízdě',
          singles:[[25,'Rozjezd'],[50,'Půlstovka'],[100,'Stovka'],[200,'Dvojstovka']],
          totals:[100,500,1000,2500] },
  swim: { name:'Plavání', unit:'km', one:'při jednom plavání',
          singles:[[0.5,'Pět set metrů'],[1,'Kilometr'],[2.5,'Dálkový plavec'],[5,'Plavecký maraton']],

  hike: { name:'Turistika', unit:'km', one:'na jednom výletě',
          singles:[[10,'Desítka'],[20,'Dvacítka'],[30,'Třicítka']],

          totals:[25,50,100,250,500] },
  gym:  { name:'Posilovna', unit:'', singles:[], totals:[] },
  custom:{ name:'', unit:'', singles:[], totals:[] }
};
const COUNT_MILESTONES = [[1,'První krok'],[10,'Deset aktivit'],[25,'Čtvrt stovky'],[50,'Padesátka'],[100,'Stovka aktivit'],[365,'Rok v pohybu']];

let hobbyView = 'activity';        // 'activity' | 'month' | 'medals'

function saveAchievements(){ saveKey('sovaa:achievements', state.achievements); }
function fmtDist(v){ return (Math.round(v*10)/10).toString().replace('.',','); }
function glyphFor(v){ return v>=1000 ? fmtDist(v/1000)+'K' : fmtDist(v); }
function tierByIndex(i, n){
  if(n<=1) return 'gold';
  const ratio = i/(n-1);
  if(ratio>=1) return 'trophy';
  if(ratio>=0.6) return 'gold';
  if(ratio>=0.25) return 'silver';
  return 'bronze';
}
function hobbyLogsOf(h){
  return state.hobbyLogs.filter(l=>l.hobbyId===h.id)
    .sort((a,b)=>a.date.localeCompare(b.date) || (a.ts||0)-(b.ts||0));
}

/** Spočítá všechny automatické medaile sportu: kdy byly získány, nebo kolik chybí. */
function computeHobbyAchievements(h){
  const logs = hobbyLogsOf(h);
  const p = HOBBY_PRESETS[h.preset] || HOBBY_PRESETS.custom;
  const unit = h.unit || '';
  const amounts = logs.map(l=>Number(l.amount)||0);
  const best = Math.max(0, ...amounts);
  const total = amounts.reduce((s,a)=>s+a,0);
  const out = [];
  (p.singles||[]).forEach(([v,title],i,arr)=>{
    const hit = logs.find(l=>(Number(l.amount)||0)>=v);
    out.push({ key:`${h.id}:s${v}`, hobbyId:h.id, kind:'single', title,
      desc:`${fmtDist(v)} ${unit} ${p.one||'v jedné aktivitě'}`, tier:tierByIndex(i,arr.length), glyph:glyphFor(v),
      earned: hit ? hit.date : null, progress: Math.min(1, best/v), progressText:`nejlepší ${fmtDist(best)} / ${fmtDist(v)} ${unit}` });
  });
  (p.totals||[]).forEach((v,i,arr)=>{
    let run = 0, date = null;
    for(const l of logs){ run += Number(l.amount)||0; if(run>=v){ date = l.date; break; } }
    out.push({ key:`${h.id}:t${v}`, hobbyId:h.id, kind:'total', title:`${fmtDist(v)} ${unit} celkem`,
      desc:`Celkem naběháno/najeto ${fmtDist(v)} ${unit}`.replace('naběháno/najeto','nasbíráno'), tier:tierByIndex(i,arr.length), glyph:glyphFor(v),
      earned:date, progress:Math.min(1,total/v), progressText:`${fmtDist(total)} / ${fmtDist(v)} ${unit}` });
  });
  COUNT_MILESTONES.forEach(([n,title],i,arr)=>{
    out.push({ key:`${h.id}:c${n}`, hobbyId:h.id, kind:'count', title,
      desc:`${n} zapsan${n===1?'á aktivita':'ých aktivit'}`, tier:tierByIndex(i,arr.length), glyph:n>=1000?'1K':String(n),
      earned: logs.length>=n ? logs[n-1].date : null, progress:Math.min(1,logs.length/n), progressText:`${logs.length} / ${n} aktivit` });
  });
  return out;
}
function manualAchievementStatuses(){
  return state.achievements.map(a=>({
    key:'m:'+a.id, manual:true, id:a.id, hobbyId:a.hobbyId||'', kind:'manual', title:a.title,
    desc:a.note||'', tier:a.tier||'gold', glyph:'★', earned:a.date, progress:1, progressText:''
  }));
}
function allAchievementStatuses(){
  return [...state.hobbies.flatMap(computeHobbyAchievements), ...manualAchievementStatuses()];
}

function medalSvg(tier, locked, glyph){
  const [c1,c2] = locked ? ['#D8D2C2','#A39C8A'] : (MEDAL_COLORS[tier] || MEDAL_COLORS.gold);
  const ribbon = locked ? ['#BDB6A4','#A39C8A'] : (tier==='trophy' ? ['#6B4C7A','#4A3356'] : ['#C5663F','#9A4528']);
  const g = String(glyph||'★');
  const size = g.length<=2 ? 20 : (g.length===3 ? 16 : 13);
  return `<svg class="medal-svg ${locked?'locked':''}" viewBox="0 0 64 84" role="img" aria-label="Medaile">
    <path d="M17 0h13l8 30H25z" fill="${ribbon[0]}"/><path d="M47 0H34l-8 30h13z" fill="${ribbon[1]}"/>
    <circle cx="32" cy="54" r="26" fill="${c2}"/><circle cx="32" cy="54" r="21" fill="${c1}"/>
    <circle cx="32" cy="54" r="21" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
    <text x="32" y="54" text-anchor="middle" dominant-baseline="central" font-family="Fraunces,serif" font-weight="700" font-size="${size}" fill="${locked?'#8A8477':'rgba(35,43,49,.85)'}">${esc(g)}</text>
  </svg>`;
}

/* ---- Aktivity ---- */
function weeklyTotals(h, weeks){
  const logs = state.hobbyLogs.filter(l=>l.hobbyId===h.id);
  const now = new Date();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay()+6)%7));
  const out = [];
  for(let i=weeks-1; i>=0; i--){
    const start = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()-7*i);
    const end = new Date(start.getFullYear(), start.getMonth(), start.getDate()+7);
    const s = fmtDate(start), e = fmtDate(end);
    const inWeek = logs.filter(l=>l.date>=s && l.date<e);
    out.push({ label:`${start.getDate()}.${start.getMonth()+1}.`,
      value: h.unit ? inWeek.reduce((a,l)=>a+(Number(l.amount)||0),0) : inWeek.length });
  }
  return out;
}
function createHobby(preset, name, unit){
  const h = { id:'h'+Date.now()+Math.random().toString(36).slice(2,5), name, preset, unit };
  state.hobbies.push(h);

  const preset = document.getElementById('hf-preset');
  const name = document.getElementById('hf-name');
  const unit = document.getElementById('hf-unit');
  const sync = ()=>{
    const p = HOBBY_PRESETS[preset.value];
    name.value = p.name;
    unit.value = p.unit;
    unit.disabled = preset.value!=='custom';
  };
  preset.addEventListener('change', sync);
  sync();
  document.getElementById('hf-cancel').addEventListener('click', ()=>{ hobbyFormOpen = false; renderHobbies(); });
  document.getElementById('hf-save').addEventListener('click', ()=>{
    const n = name.value.trim();
    if(!n){ showToast('Doplň název sportu'); return; }
    createHobby(preset.value, n, unit.value.trim());
    showToast('Sport přidán');
    renderHobbies();
  });
}
/* ---- Pomocné funkce pro čas a kalorie ---- */
function logMinutes(l, h){
  const m = Number(l.minutes);
  if(m>0) return m;
  return (h && h.unit==='min') ? (Number(l.amount)||0) : 0;   // starší záznamy s jednotkou „min“
}
function fmtKcal(n){ return Math.round(n).toLocaleString('cs-CZ')+' kcal'; }
function logSummary(l, h){
  const u = h.unit ? ' '+h.unit : '';
  const parts = [];
  if(l.amount!=='' && l.amount!=null) parts.push(fmtDist(l.amount)+u);
  if(Number(l.minutes)>0) parts.push(fmtDur(Number(l.minutes)));
  if(Number(l.kcal)>0) parts.push(fmtKcal(Number(l.kcal))+(l.kcalEst ? ' (odhad)' : ''));
  return parts.join(' · ');
}

/* ---- Detail sportu: statistiky, zápis aktivity, záznamy ---- */
function renderHobbyDetail(wrap, h){
  const logs = hobbyLogsOf(h);
  const thisMonth = fmtDate(new Date()).slice(0,7);
  const amounts = logs.map(l=>Number(l.amount)||0);
  const total = amounts.reduce((s,a)=>s+a,0);
  const monthTotal = logs.filter(l=>l.date.slice(0,7)===thisMonth).reduce((s,l)=>s+(Number(l.amount)||0),0);
  const best = Math.max(0, ...amounts);
  const kcalTotal = logs.reduce((s,l)=>s+(Number(l.kcal)||0),0);
  const minTotal = logs.reduce((s,l)=>s+logMinutes(l,h),0);
  const u = h.unit ? ' '+h.unit : '';
  const showAmounts = !!h.unit;
  const cards = [];
  if(showAmounts) cards.push(['celkem', fmtDist(total)+u], ['tento měsíc', fmtDist(monthTotal)+u]);
  cards.push(['aktivit', String(logs.length)]);
  if(showAmounts) cards.push(['nejlepší aktivita', fmtDist(best)+u]);
  if(kcalTotal>0) cards.push(['spáleno celkem', fmtKcal(kcalTotal)]);
  if(minTotal>0 && h.unit!=='min') cards.push(['čas celkem', fmtDur(minTotal)]);
  const weeks = weeklyTotals(h, 8);
  const maxW = Math.max(1, ...weeks.map(w=>w.value));
  wrap.innerHTML = `
    <div class="row" style="justify-content:space-between; margin-bottom:8px;">
      <h2 class="sub" style="margin:0; font-size:24px;">${esc(h.name)}</h2>
      <button class="btn danger" id="hd-del"><i class="ti ti-trash"></i> Smazat sport</button>
    </div>
    <div class="stat-cards wrap">${cards.map(([label,val])=>`
      <div class="stat-card"><div class="stat-num">${esc(val)}</div><div class="stat-label">${label}</div></div>`).join('')}</div>
    <h3 class="recipe-h" style="margin-top:6px;">Posledních 8 týdnů</h3>
    <div class="fin-history-chart">${weeks.map(w=>`
      <div class="fin-history-bar-wrap" title="týden od ${w.label}: ${fmtDist(w.value)}${esc(u)}">
        <div class="fin-history-bar" style="height:${Math.max(3, Math.round(w.value/maxW*90))}px; background:${w.value>0 ? 'var(--teal)' : 'var(--line)'};"></div>
        <div class="fin-history-label">${w.label}</div>
      </div>`).join('')}</div>
    <h3 class="recipe-h">Zapsat aktivitu</h3>
    <div class="log-form">
      <input type="date" id="lg-date" value="${fmtDate(new Date())}" aria-label="Datum">
      ${h.unit ? `<input type="number" step="any" min="0" id="lg-amt" placeholder="${esc(h.unit)}" aria-label="Vzdálenost / množství (${esc(h.unit)})">` : ''}
      ${h.unit!=='min' ? '<input type="number" step="1" min="0" id="lg-min" placeholder="min" aria-label="Čas v minutách">' : ''}
      <input type="number" step="1" min="0" id="lg-kcal" placeholder="kcal" aria-label="Spálené kalorie">
      <input type="text" id="lg-note" placeholder="Poznámka (např. zápas, trasa...)">
      <button class="btn primary" id="lg-add"><i class="ti ti-plus"></i> Zapsat</button>
    </div>
    <div class="muted" id="lg-est" style="margin:-4px 0 10px; font-size:12.5px;"></div>
    <h3 class="recipe-h">Záznamy</h3>
    <div id="lg-list"></div>
  `;
  const list = document.getElementById('lg-list');
  const recent = [...logs].reverse().slice(0, 15);
  if(!recent.length) list.innerHTML = '<p class="muted">Zatím žádné záznamy.</p>';
  recent.forEach(l=>{
    const row = document.createElement('div');
    row.className = 'log-row';
    row.innerHTML = `<span class="lr-date">${esc(new Date(l.date+'T00:00:00').toLocaleDateString('cs-CZ'))}</span>
      <span class="lr-amt">${esc(logSummary(l,h))}</span><span class="lr-note">${esc(l.note||'')}</span>
      <button class="icon-btn" title="Smazat záznam"><i class="ti ti-x"></i></button>`;
    row.querySelector('button').addEventListener('click', ()=>{
      state.hobbyLogs = state.hobbyLogs.filter(x=>x.id!==l.id);
      saveHobbyLogs();
      renderHobbies();
    });
    list.appendChild(row);
  });
  if(logs.length>recent.length){
    const more = document.createElement('p');
    more.className = 'muted';
    more.textContent = `… a dalších ${logs.length-recent.length} starších záznamů`;
    list.appendChild(more);
  }
  const addLog = ()=>{
    const val = (id)=>{ const el = document.getElementById(id); return el ? parseNum(el.value) : ''; };
    const date = document.getElementById('lg-date').value || fmtDate(new Date());
    const amount = val('lg-amt'), minutes = val('lg-min');
    let kcal = val('lg-kcal'), kcalEst = false;
    if(kcal===''){                                       // prázdné kcal → odhad z váhy, času a vzdálenosti
      const est = estimateSportKcal(h, amount, minutes, latestWeight(date));
      if(est){ kcal = est; kcalEst = true; }
    }
    if(h.unit==='km' && !(amount>0) && !(minutes>0) && !(kcal>0)){ showToast('Zadej aspoň vzdálenost, čas nebo kalorie'); return; }
    const before = new Set(computeHobbyAchievements(h).filter(a=>a.earned).map(a=>a.key));
    state.hobbyLogs.push({ id:'l'+Date.now()+Math.random().toString(36).slice(2,5), hobbyId:h.id, date, amount, minutes, kcal, kcalEst,
      note:document.getElementById('lg-note').value.trim(), ts:Date.now() });
    saveHobbyLogs();
    const fresh = computeHobbyAchievements(h).filter(a=>a.earned && !before.has(a.key));
    showToast('Aktivita zapsána');
    renderHobbies();
    if(fresh.length) showMedalCelebration(fresh);
  };
  document.getElementById('lg-add').addEventListener('click', addLog);
  const updateEst = ()=>{
    const out = document.getElementById('lg-est');
    if(!out) return;
    const num2 = id=>{ const el = document.getElementById(id); return el ? parseNum(el.value) : ''; };
    const date = document.getElementById('lg-date').value || fmtDate(new Date());
    const amount = num2('lg-amt'), minutes = num2('lg-min'), kcal = num2('lg-kcal');
    if(kcal!=='' || (!(minutes>0) && !(amount>0))){ out.textContent = ''; return; }
    const w = latestWeight(date);
    if(!w){ out.textContent = 'Tip: doplň svou váhu (Dnes → Jídlo a energie → Údaje) a kalorie se odhadnou samy.'; return; }
    const est = estimateSportKcal(h, amount, minutes, w);
    out.textContent = est ? `Odhad spálených kalorií: ≈ ${est} kcal (podle váhy ${String(r1(w)).replace('.',',')} kg). Uloží se, když políčko kcal necháš prázdné.` : '';
  };
  ['lg-amt','lg-min','lg-kcal','lg-date'].forEach(id=>{ const el = document.getElementById(id); if(el) el.addEventListener('input', updateEst); });
  ['lg-amt','lg-min','lg-kcal','lg-note'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('keydown', (e)=>{ if(e.key==='Enter') addLog(); });
  });
  document.getElementById('hd-del').addEventListener('click', ()=>{
    if(!confirm('Smazat sport „'+h.name+'“ a všechny jeho záznamy? Vlastní úspěchy zůstanou.')) return;
    state.hobbies = state.hobbies.filter(x=>x.id!==h.id);
    state.hobbyLogs = state.hobbyLogs.filter(l=>l.hobbyId!==h.id);
    state.achievements.forEach(a=>{ if(a.hobbyId===h.id) a.hobbyId = ''; });
    activeHobbyId = null;
    saveHobbies(); saveHobbyLogs(); saveAchievements();
    showToast('Sport smazán');
    renderHobbies();
  });
}

/* ---- Měsíční shrnutí: součty, srovnání s minulým měsícem, graf po dnech, tabulka podle sportů ---- */
let sportMonth = fmtDate(new Date()).slice(0,7);
let sportMetric = 'kcal';
const SPORT_METRICS = { kcal:'Kalorie', km:'Kilometry', time:'Čas', count:'Aktivity' };
function shiftMonth(key, n){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1);
}
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const s = new Date(y, m-1, 1).toLocaleDateString('cs-CZ', {month:'long', year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function monthLogs(key){
  return state.hobbyLogs
    .map(l=>({ l, h: state.hobbies.find(x=>x.id===l.hobbyId) }))
    .filter(x=>x.h && x.l.date.slice(0,7)===key);
}
function metricValue(x, metric){
  if(metric==='kcal') return Number(x.l.kcal)||0;
  if(metric==='km') return x.h.unit==='km' ? (Number(x.l.amount)||0) : 0;
  if(metric==='time') return logMinutes(x.l, x.h);
  return 1;
}
function fmtMetric(v, metric){
  if(metric==='kcal') return fmtKcal(v);
  if(metric==='km') return fmtDist(v)+' km';
  if(metric==='time') return fmtDur(Math.round(v));
  return String(v);
}
function monthTotals(key){
  const items = monthLogs(key);
  const sum = (metric)=>items.reduce((s,x)=>s+metricValue(x,metric),0);
  return { count:items.length, minutes:sum('time'), kcal:sum('kcal'), km:sum('km') };
}
function deltaHtml(cur, prev){
  if(!(prev>0)) return '';
  const pct = Math.round((cur-prev)/prev*100);
  if(pct===0) return '<div class="stat-delta">stejně jako minulý měsíc</div>';
  return `<div class="stat-delta ${pct>0?'up':'down'}">${pct>0?'▲ +':'▼ −'}${Math.abs(pct)} % oproti minulému měsíci</div>`;
}
function renderMonthSummary(body){
  const items = monthLogs(sportMonth);
  const cur = monthTotals(sportMonth), prev = monthTotals(shiftMonth(sportMonth,-1));
  const isCurrent = sportMonth===fmtDate(new Date()).slice(0,7);
  const [y,m] = sportMonth.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  body.innerHTML = `
    <div class="plan-nav">
      <button class="icon-btn" id="sm-prev" aria-label="Předchozí měsíc"><i class="ti ti-chevron-left" style="font-size:20px;"></i></button>
      <div class="plan-date">${esc(monthLabel(sportMonth))}</div>
      <button class="icon-btn" id="sm-next" aria-label="Další měsíc"><i class="ti ti-chevron-right" style="font-size:20px;"></i></button>
      <input type="month" id="sm-jump" value="${sportMonth}">
      ${isCurrent ? '' : '<button class="btn" id="sm-now">Tento měsíc</button>'}
    </div>
    <div id="sm-content"></div>
  `;
  document.getElementById('sm-prev').addEventListener('click', ()=>{ sportMonth = shiftMonth(sportMonth,-1); renderHobbies(); });
  document.getElementById('sm-next').addEventListener('click', ()=>{ sportMonth = shiftMonth(sportMonth,1); renderHobbies(); });
  document.getElementById('sm-jump').addEventListener('change', (e)=>{ if(e.target.value){ sportMonth = e.target.value; renderHobbies(); } });
  const nowBtn = document.getElementById('sm-now');
  if(nowBtn) nowBtn.addEventListener('click', ()=>{ sportMonth = fmtDate(new Date()).slice(0,7); renderHobbies(); });

  const wrap = document.getElementById('sm-content');
  if(!items.length){
    wrap.innerHTML = `<div class="empty-state"><i class="ti ti-chart-bar"></i>${state.hobbies.length
      ? 'V tomto měsíci zatím nejsou žádné zapsané aktivity.' : 'Nejdřív si na záložce Aktivity přidej nějaký sport.'}</div>`;
    return;
  }
  const cards = [
    ['aktivit', String(cur.count), deltaHtml(cur.count, prev.count)],
    ['čas', cur.minutes>0 ? fmtDur(cur.minutes) : '—', deltaHtml(cur.minutes, prev.minutes)],
    ['spálené kalorie', cur.kcal>0 ? fmtKcal(cur.kcal) : '—', deltaHtml(cur.kcal, prev.kcal)]
  ];
  if(cur.km>0 || prev.km>0) cards.push(['kilometry', fmtDist(cur.km)+' km', deltaHtml(cur.km, prev.km)]);

  /* graf po dnech */
  const vals = Array(days).fill(0);
  items.forEach(x=>{ vals[+x.l.date.slice(8,10)-1] += metricValue(x, sportMetric); });
  const max = Math.max(...vals);
  const todayDay = isCurrent ? new Date().getDate() : -1;
  const chart = max>0 ? `
    <div class="month-chart">${vals.map((v,i)=>`
      <div class="month-bar-wrap${i+1===todayDay?' today':''}" title="${i+1}. ${m}.: ${esc(fmtMetric(v, sportMetric))}">
        <div class="month-bar" style="height:${v>0 ? Math.max(4, Math.round(v/max*100)) : 2}px; background:${v>0 ? 'var(--teal)' : 'var(--line)'};"></div>
        <div class="month-bar-label">${(i+1)%5===0 || i===0 ? i+1 : ''}</div>
      </div>`).join('')}</div>
    <p class="muted" style="margin:4px 0 0;">Nejvíc za jeden den: ${esc(fmtMetric(max, sportMetric))}</p>`
    : `<p class="muted">V tomto měsíci nemáš zapsané údaje pro „${SPORT_METRICS[sportMetric].toLowerCase()}“.</p>`;

  /* zajímavosti měsíce */
  const dayKcal = Array(days).fill(0), dayCount = Array(days).fill(0);
  items.forEach(x=>{ const i = +x.l.date.slice(8,10)-1; dayKcal[i] += Number(x.l.kcal)||0; dayCount[i] += 1; });
  const useKcal = cur.kcal>0;
  const series = useKcal ? dayKcal : dayCount;
  const bestIdx = series.indexOf(Math.max(...series));
  const top = (metric)=>items.reduce((b,x)=>{ const v = metricValue(x,metric); return (v>0 && (!b || v>b.v)) ? {x,v} : b; }, null);
  const highlights = [];
  highlights.push(['Nejaktivnější den', `${bestIdx+1}. ${m}.`, useKcal ? fmtKcal(series[bestIdx]) : `${series[bestIdx]}× aktivita`]);
  const tk = top('kcal'); if(tk) highlights.push(['Nejvíc kalorií najednou', fmtKcal(tk.v), `${tk.x.h.name} · ${new Date(tk.x.l.date+'T00:00:00').toLocaleDateString('cs-CZ')}`]);
  const tm = top('time'); if(tm) highlights.push(['Nejdelší aktivita', fmtDur(Math.round(tm.v)), `${tm.x.h.name} · ${new Date(tm.x.l.date+'T00:00:00').toLocaleDateString('cs-CZ')}`]);
  const td = top('km'); if(td) highlights.push(['Nejdál', fmtDist(td.v)+' km', `${td.x.h.name} · ${new Date(td.x.l.date+'T00:00:00').toLocaleDateString('cs-CZ')}`]);

  /* tabulka podle sportů */
  const rows = state.hobbies.map(h=>{
    const own = items.filter(x=>x.h.id===h.id);
    const kcalLogs = own.filter(x=>Number(x.l.kcal)>0);
    return { h, count:own.length,
      dist: (h.unit && h.unit!=='min') ? own.reduce((s,x)=>s+(Number(x.l.amount)||0),0) : 0,
      minutes: own.reduce((s,x)=>s+logMinutes(x.l,x.h),0),
      kcal: own.reduce((s,x)=>s+(Number(x.l.kcal)||0),0),
      kcalCount: kcalLogs.length };
  }).filter(r=>r.count>0).sort((a,b)=>b.kcal-a.kcal || b.count-a.count);
  const tbl = `
    <div class="table-wrap"><table class="month-table">
      <thead><tr><th>Sport</th><th>Aktivit</th><th>Vzdálenost</th><th>Čas</th><th>Kalorie</th><th>Ø kcal / aktivita</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td>${esc(r.h.name)}</td><td>${r.count}</td>
        <td>${r.dist>0 ? esc(fmtDist(r.dist)+' '+r.h.unit) : '—'}</td>
        <td>${r.minutes>0 ? esc(fmtDur(r.minutes)) : '—'}</td>
        <td>${r.kcal>0 ? esc(fmtKcal(r.kcal)) : '—'}</td>
        <td>${r.kcal>0 ? esc(fmtKcal(r.kcal/r.kcalCount)) : '—'}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Celkem</td><td>${cur.count}</td><td>${cur.km>0 ? esc(fmtDist(cur.km)+' km') : '—'}</td>
        <td>${cur.minutes>0 ? esc(fmtDur(cur.minutes)) : '—'}</td><td>${cur.kcal>0 ? esc(fmtKcal(cur.kcal)) : '—'}</td><td></td></tr></tfoot>
    </table></div>`;

  wrap.innerHTML = `
    <div class="stat-cards wrap">${cards.map(([label,val,delta])=>`
      <div class="stat-card"><div class="stat-num">${esc(val)}</div><div class="stat-label">${label}</div>${delta}</div>`).join('')}</div>
    <h3 class="recipe-h" style="margin-top:6px;">Průběh měsíce</h3>
    <div class="hobby-chips" id="sm-metrics"></div>
    <div id="sm-chart">${chart}</div>
    <div class="highlights">${highlights.map(([t,v,s])=>`
      <div class="highlight"><div class="hl-label">${esc(t)}</div><div class="hl-value">${esc(v)}</div><div class="hl-sub">${esc(s)}</div></div>`).join('')}</div>
    <h3 class="recipe-h">Podle sportů</h3>
    ${tbl}
  `;
  const chips = document.getElementById('sm-metrics');
  Object.keys(SPORT_METRICS).forEach(k=>{
    const c = document.createElement('button');
    c.className = 'lib-tab-btn' + (sportMetric===k ? ' active' : '');
    c.textContent = SPORT_METRICS[k];
    c.addEventListener('click', ()=>{ sportMetric = k; renderHobbies(); });
    chips.appendChild(c);
  });
}

/* ---- Úspěchy: zeď medailí ---- */

    ${recent ? '<span class="medal-new">nové</span>' : ''}

  if(toggle) toggle.addEventListener('click', ()=>{ showAllLocked = !showAllLocked; renderHobbies(); });

  document.getElementById('ac-add').addEventListener('click', ()=>{
    const title = document.getElementById('ac-title').value.trim();
    if(!title){ showToast('Doplň název úspěchu'); return; }
    state.achievements.push({

      hobbyId: document.getElementById('ac-hobby').value,

}

function finCat(key){ return FIN_CATEGORIES.find(c=>c.key===key) || FIN_CATEGORIES.find(c=>c.key==='other'); }
function finCatsOf(kind){ return FIN_CATEGORIES.filter(c=>c.kind===kind); }

/* ---- pravidelné platby ---- */
/** Datum splatnosti pravidelné platby v měsíci 'YYYY-MM' (nebo null, když se tam neplatí). */
function recurringDueDate(r, ym){
  const [y,m] = ym.split('-').map(Number);
  const sy = +r.start.slice(0,4), sm = +r.start.slice(5,7), sd = +r.start.slice(8,10);
  if(y*12+m < sy*12+sm) return null;
  if(r.freq==='yearly' && m!==sm) return null;
  const dim = new Date(y, m, 0).getDate();
  return ym+'-'+pad2(Math.min(sd, dim));
}
function paymentsOn(date){
  const ym = date.slice(0,7);
  return state.recurring.filter(r=>recurringDueDate(r, ym)===date);
}
function nextDue(r){
  const today = fmtDate(new Date());
  let ym = today.slice(0,7);
  for(let n=0; n<26; n++, ym = shiftMonth(ym,1)){
    const due = recurringDueDate(r, ym);
    if(due && due>=today) return due;
  }
  return null;
}

/* ---- data jednoho měsíce ---- */
function finMonthData(ym){
  const today = fmtDate(new Date());
  const items = state.transactions.filter(t=>t.date.slice(0,7)===ym).map(t=>Object.assign({}, t, { auto:false, pending:false }));
  state.recurring.forEach(r=>{
    const due = recurringDueDate(r, ym);
    if(due) items.push({ id:'rec:'+r.id, date:due, amount:r.amount, type:r.type, category:r.category, note:r.name, auto:true, recId:r.id, pending:due>today });
  });
  items.sort((a,b)=>b.date.localeCompare(a.date) || (b.ts||0)-(a.ts||0));
  const counted = items.filter(i=>!i.pending);
  const sum = (arr, type)=>arr.filter(i=>i.type===type).reduce((s,i)=>s+i.amount, 0);
  const byCat = {};
  counted.filter(i=>i.type==='expense').forEach(i=>{ byCat[i.category] = (byCat[i.category]||0)+i.amount; });
  const [y,m] = ym.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const daily = Array(days).fill(0);
  counted.filter(i=>i.type==='expense').forEach(i=>{ daily[+i.date.slice(8,10)-1] += i.amount; });
  const pending = items.filter(i=>i.pending);
  return { items, days, daily, byCat, income:sum(counted,'income'), expense:sum(counted,'expense'),
    pendingExpense:sum(pending,'expense'), pendingIncome:sum(pending,'income') };
}
function finDelta(cur, prev, higherIsBad){
  if(!(prev>0)) return '';
  const pct = Math.round((cur-prev)/prev*100);
  if(pct===0) return '<div class="stat-delta">stejně jako minulý měsíc</div>';
  const good = higherIsBad ? pct<0 : pct>0;
  return `<div class="stat-delta ${good?'up':'down'}">${pct>0?'▲ +':'▼ −'}${Math.abs(pct)} % oproti minulému měsíci</div>`;
}
function downloadCsv(filename, rows){
  const csv = '\ufeff' + rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

      <span class="fr-note"><b>${esc(r.name)}</b><small>${esc(FIN_FREQ[r.freq])} · ${esc(c.name)}${due ? ' · příště '+esc(new Date(due+'T00:00:00').toLocaleDateString('cs-CZ')) : ''}</small></span>
      <span class="fr-amt ${r.type}">${finSigned(r)}</span>`;
    row.addEventListener('click', ()=>openRecurringModal(r));
    list.appendChild(row);
  });
}
function openRecurringModal(rec){
  closeFinModal();
  const draft = rec ? Object.assign({}, rec) : { id:'rc'+Date.now()+Math.random().toString(36).slice(2,5), name:'', amount:'', type:'expense', category:'housing', freq:'monthly', start:fmtDate(new Date()) };
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop open';
  wrap.id = 'fin-backdrop';
  wrap.innerHTML = `
    <div class="modal-panel plan-modal">
      <button class="icon-btn modal-close" id="rm-close" aria-label="Zavřít"><i class="ti ti-x"></i></button>
      <h2 class="sub">${rec ? 'Upravit pravidelnou platbu' : 'Nová pravidelná platba'}</h2>
      <div class="field"><label>Název</label><input type="text" id="rm-name" value="${escAttr(draft.name)}" placeholder="např. Nájem, Netflix, Výplata"></div>
      <div class="field"><div class="seg-toggle" id="rm-type"><button type="button" data-type="expense" class="${draft.type==='expense'?'on':''}">Výdaj</button><button type="button" data-type="income" class="${draft.type==='income'?'on':''}">Příjem</button></div></div>
      <div class="grid2">
        <div class="field"><label>Částka (Kč)</label><input type="number" step="any" min="0" id="rm-amount" value="${escAttr(draft.amount)}"></div>
        <div class="field"><label>Kategorie</label><select id="rm-cat"></select></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Opakování</label><select id="rm-freq">${Object.keys(FIN_FREQ).map(k=>`<option value="${k}" ${k===draft.freq?'selected':''}>${FIN_FREQ[k]}</option>`).join('')}</select></div>
        <div class="field"><label>První splatnost</label><input type="date" id="rm-start" value="${escAttr(draft.start)}"></div>
      </div>
      <p class="muted" style="margin-top:-6px;">Den v měsíci se bere z prvního data. V kratších měsících (např. 31. v únoru) se platba posune na poslední den.</p>
      <div class="row">
        <button class="btn primary" id="rm-save"><i class="ti ti-check"></i> Uložit</button>
        <button class="btn" id="rm-cancel">Zrušit</button>
        ${rec ? '<button class="btn danger" id="rm-del"><i class="ti ti-trash"></i> Smazat</button>' : ''}
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const $r = id=>document.getElementById(id);
  const fill = ()=>{
    $r('rm-cat').innerHTML = finCatsOf(draft.type).map(c=>`<option value="${c.key}">${esc(c.name)}</option>`).join('');
    $r('rm-cat').value = finCatsOf(draft.type).some(c=>c.key===draft.category) ? draft.category : finCatsOf(draft.type)[0].key;
  };
  fill();
  document.querySelectorAll('#rm-type button').forEach(b=>b.addEventListener('click', ()=>{
    draft.type = b.dataset.type;
    draft.category = '';
    document.querySelectorAll('#rm-type button').forEach(x=>x.classList.toggle('on', x===b));
    fill();
  }));
  $r('rm-close').addEventListener('click', closeFinModal);
  $r('rm-cancel').addEventListener('click', closeFinModal);
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) closeFinModal(); });
  $r('rm-save').addEventListener('click', ()=>{
    const name = $r('rm-name').value.trim();
    const amount = parseNum($r('rm-amount').value);
    if(!name){ showToast('Doplň název platby'); return; }
    if(!(amount>0)){ showToast('Zadej částku větší než 0'); return; }
    if(!$r('rm-start').value){ showToast('Zadej datum první splatnosti'); return; }
    Object.assign(draft, { name, amount, category:$r('rm-cat').value, freq:$r('rm-freq').value, start:$r('rm-start').value });
    if(rec) Object.assign(rec, draft); else state.recurring.push(draft);
    saveRecurring();
    closeFinModal();
    renderFinance();
    renderSidebarToday();
  });
  const del = $r('rm-del');
  if(del) del.addEventListener('click', ()=>{
    if(!confirm('Smazat pravidelnou platbu „'+rec.name+'“? Zapsané záznamy zůstanou.')) return;
    state.recurring = state.recurring.filter(x=>x.id!==rec.id);
    saveRecurring();
    closeFinModal();
    renderFinance();
    renderSidebarToday();
  });
  $r('rm-name').focus();
}
